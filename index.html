<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloDev v2.4</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb454;--line:#242b36}
body.light-theme{--bg:#f4f6f8;--card:#fff;--card2:#e9ecef;--txt:#212529;--mut:#6c757d;--line:#dee2e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;z-index:10}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;padding:8px;overflow-x:auto;z-index:20}
nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:60px;background:var(--card2);border:none;border-radius:10px;padding:8px 4px;color:var(--mut);font-size:11px;cursor:pointer}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-btn small{display:block;margin-top:2px;font-size:10px}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}.stat b{font-size:20px}
.mut{color:var(--mut);font-size:13px}.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:10px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.spread{justify-content:space-between}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.ai{background:linear-gradient(90deg,var(--acc),#9d6cff)}
.btn.warn{background:var(--warn);color:#000}
.btn.ok{background:var(--ok)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;margin:4px 0 10px}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff}.chip.ok{background:var(--ok);color:#fff}.chip.warn{background:var(--warn);color:#000}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#splash.hidden{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:24px;font-size:14px;z-index:50}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
#modal.on{display:flex}.m-card{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@keyframes load{0%{width:0%}100%{width:100%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes badge-pop{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.badge{display:inline-flex;flex-direction:column;align-items:center;padding:10px;background:var(--card2);border-radius:12px;margin:4px;min-width:80px}
.badge.earned{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000}
.badge .icon{font-size:28px}.badge .name{font-size:11px;margin-top:4px;text-align:center}
.mood-btn{font-size:32px;background:none;border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}
.mood-btn.selected{border-color:var(--acc);background:var(--card2)}
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:10px}
.chart-col{flex:1;background:var(--card2);border-radius:4px 4px 0 0;position:relative;min-height:4px}
.chart-col i{position:absolute;bottom:0;left:0;right:0;background:var(--acc);border-radius:4px 4px 0 0}
.chart-label{font-size:10px;color:var(--mut);text-align:center;margin-top:4px}
.article-card{border-left:3px solid var(--acc);padding-left:12px;margin:10px 0}
.tag{display:inline-block;background:var(--card2);padding:4px 10px;border-radius:12px;font-size:11px;margin:2px}
</style>
</head>
<body>
<div id="splash">
  <h1 style="font-size:48px;margin-bottom:20px;animation:pulse 1.5s ease infinite">⚡</h1>
  <h1>SoloDev v2.4</h1>
  <p class="mut">Загрузка приложения...</p>
  <div class="bar" style="width:200px;margin-top:20px"><i style="width:0%;animation:load 2s ease forwards"></i></div>
</div>
<header><b>⚡ SoloDev v2.4</b><span id="date"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="m-card" id="mcard"></div></div>
<script>
const KEY='solodev_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const STAGES=['Идея','В работе','Тестирование','Завершён'];
const TIMER_MODES=[{work:25,break:5,name:'25/5'},{work:50,break:10,name:'50/10'},{work:90,break:20,name:'90/20'}];
const MOODS=[{e:'😞',n:'Плохо'},{e:'😕',n:'Так себе'},{e:'😐',n:'Норм'},{e:'🙂',n:'Хорошо'},{e:'😄',n:'Отлично'}];
const ACHIEVEMENTS=[
  {id:'first_client',name:'Первый клиент',icon:'👥',desc:'Добавить первого клиента',check:d=>d.clients.length>=1},
  {id:'five_projects',name:'5 проектов',icon:'📁',desc:'Завершить 5 проектов',check:d=>d.projects.filter(p=>p.stage===3).length>=5},
  {id:'streak_7',name:'Неделя привычек',icon:'🔥',desc:'7 дней подряд отмечать привычки',check:d=>{const h=d.habits[0];return h&&h.streak>=7;}},
  {id:'earn_100k',name:'100K заработано',icon:'💰',desc:'Заработать 100 000 ₽',check:d=>d.finances.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0)>=100000},
  {id:'knowledge_10',name:'Учёный',icon:'',desc:'Освоить 10 тем',check:d=>d.knowledge.filter(k=>k.status===3).length>=10},
  {id:'articles_20',name:'Читатель',icon:'📖',desc:'Сохранить 20 статей',check:d=>(d.savedArticles||[]).length>=20}
];
const EMAIL_TEMPLATES=[
  {id:'cold',name:'Холодное письмо',text:'Здравствуйте!\n\nМеня зовут {name}, я {spec}.\n\nПредлагаю свои услуги по {service}.\n\nБуду рад обсудить детали.\n\nС уважением,\n{name}\n{phone}\n{email}'},
  {id:'follow',name:'После встречи',text:'Здравствуйте, {client}!\n\nСпасибо за встречу. Как договаривались:\n\n• Задача: {task}\n• Срок: {deadline}\n• Бюджет: {budget}\n\nЖду вашего решения.\n\n{name}'},
  {id:'reminder',name:'Напоминание',text:'Здравствуйте, {client}!\n\nНапоминаю о проекте "{project}".\n\nГотовы двигаться дальше?\n\n{name}'},
  {id:'invoice',name:'Счёт на оплату',text:'Счёт №{num} от {date}\n\nИсполнитель: {name}\nЗаказчик: {client}\n\nУслуга: {service}\nСумма: {budget} {cur}\n\nРеквизиты: {bank}'},
  {id:'completed',name:'Проект завершён',text:'Здравствуйте, {client}!\n\nПроект "{project}" успешно завершён.\n\nВсе материалы отправлены.\nБуду рад сотрудничеству в будущем!\n\n{name}'}
];

function seed(){return{
  profile:{name:'Дмитрий',spec:'Fullstack разработчик',currency:'RUB',rates:{BYN:30,CNY:11.5,USD:90},specs:['Фронтенд','Бэкенд','Боты'],phone:'+79001234567',email:'dev@example.com',bank:'Тинькофф 2200...'},
  clients:[],projects:[],finances:[],pains:[],
  skills:[{n:'JavaScript',l:4},{n:'React',l:3}],
  goals:[],knowledge:[],prices:[],tasks:[],
  templates:[],outreachStats:{sent:0,replied:0,converted:0},
  timerMode:0,leads:[],diary:[],
  habits:[{id:uid(),name:'Код 2 часа',icon:'💻',streak:0,history:{}},{id:uid(),name:'Спорт',icon:'🏃',streak:0,history:{}},{id:uid(),name:'Чтение',icon:'📚',streak:0,history:{}}],
  calendarView:'month',calendarDate:today(),
  savedArticles:[],searchQuery:'',
  moodHistory:[],
  partners:[],
  courses:[],
  githubUser:'',
  achievements:[],
  autoTheme:true
}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let db=(()=>{const s=seed(),l=load();return l?{...s,...l}:s})();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}

const TABS=[
  {id:'home',icon:'🏠',label:'Главная'},
  {id:'dashboard',icon:'📊',label:'Дашборд'},
  {id:'radar',icon:'🎯',label:'Радар'},
  {id:'clients',icon:'',label:'Клиенты'},
  {id:'projects',icon:'📁',label:'Проекты'},
  {id:'knowledge',icon:'📚',label:'База'},
  {id:'achievements',icon:'🏆',label:'Бейджи'},
  {id:'portfolio',icon:'💼',label:'Портфолио'},
  {id:'mood',icon:'😊',label:'Настрой'},
  {id:'habits',icon:'✅',label:'Привычки'},
  {id:'time',icon:'⏱',label:'Время'},
  {id:'settings',icon:'⚙️',label:'Настройки'}
];
let tab='home';

function renderNav(){document.getElementById('nav').innerHTML=TABS.map(t=>'<button class="nav-btn '+(t.id===tab?'active':'')+'" onclick="go(\\''+t.id+'\\')">'+t.icon+'<br><small>'+t.label+'</small></button>').join('');}
function go(id){tab=id;renderNav();render();window.scrollTo(0,0)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function openModal(h){document.getElementById('mcard').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('Скопировано!')).catch(()=>toast('Ошибка копирования'))}

// ===== АВТО-ТЕМА ПО ВРЕМЕНИ =====
function applyAutoTheme(){
  if(!db.autoTheme)return;
  const h=new Date().getHours();
  const isNight=h<7||h>=21;
  if(isNight&&!document.body.classList.contains('light-theme')&&localStorage.getItem('theme')!=='light'){
    // Ночь - тёмная тема (по умолчанию)
  }else if(!isNight&&localStorage.getItem('theme')==='light'){
    document.body.classList.add('light-theme');
  }
}

// ===== ГЛАВНАЯ =====
function rHome(){
  const m=MONTHS[new Date().getMonth()];
  const inc=db.finances.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0);
  const activeProjects=db.projects.filter(p=>p.stage<3).length;
  const leadsCount=(db.leads?db.leads.length:0)+(db.pains?db.pains.length:0);
  const earnedBadges=(db.achievements||[]).length;
  return '<div class="note" style="background:linear-gradient(135deg,var(--acc),#9d6cff);color:#fff;padding:20px;margin-bottom:20px"><div style="font-size:24px">Привет, '+esc(db.profile.name)+'! 👋</div><div style="opacity:.9">'+esc(db.profile.spec)+'</div></div><div class="grid"><div class="card stat"><span>Доход, '+m+'</span><b class="plus">'+inc.toLocaleString()+' ₽</b></div><div class="card stat"><span>Проектов</span><b>'+activeProjects+'</b></div><div class="card stat"><span>Лидов</span><b>'+leadsCount+'</b></div><div class="card stat"><span>Бейджей</span><b>🏆 '+earnedBadges+'</b></div></div><div class="card"><b>⚡ Быстрые действия</b><div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn" onclick="go(\\'dashboard\\')">📊 Дашборд</button><button class="btn sec" onclick="go(\\'radar\\')">🎯 Клиенты</button><button class="btn sec" onclick="go(\\'knowledge\\')">📚 База</button><button class="btn sec" onclick="go(\\'portfolio\\')">💼 Портфолио</button></div></div>';
}

// ===== ДАШБОРД ПРОДУКТИВНОСТИ =====
function rDashboard(){
  const m=today().slice(0,7);
  const monthFin=db.finances.filter(f=>f.date.startsWith(m));
  const monthInc=monthFin.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0);
  const monthExp=monthFin.filter(f=>f.type==='out').reduce((s,f)=>s+f.amt,0);
  const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);
  const weekStr=weekAgo.toISOString().slice(0,10);
  const weekFin=db.finances.filter(f=>f.date>=weekStr);
  const weekInc=weekFin.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0);
  const completedProjects=db.projects.filter(p=>p.stage===3).length;
  const totalTasks=db.projects.reduce((s,p)=>s+(p.tasks?p.tasks.length:0),0);
  const doneTasks=db.projects.reduce((s,p)=>s+(p.tasks?p.tasks.filter(t=>t.done).length:0),0);
  
  // Данные для графика за последние 7 дней
  const weekData=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const dayInc=db.finances.filter(f=>f.date===ds&&f.type==='in').reduce((s,f)=>s+f.amt,0);
    weekData.push({day:d.getDate(),inc:dayInc});
  }
  const maxInc=Math.max(...weekData.map(d=>d.inc),1);
  
  // Настроение за неделю
  const weekMoods=db.moodHistory.filter(m=>m.date>=weekStr);
  const avgMood=weekMoods.length?Math.round(weekMoods.reduce((s,m)=>s+m.value,0)/weekMoods.length):0;
  
  let h='<div class="row spread"><h2> Дашборд продуктивности</h2></div>';
  
  h+='<div class="grid"><div class="card stat"><span>Доход за неделю</span><b class="plus">'+weekInc.toLocaleString()+' ₽</b></div>';
  h+='<div class="card stat"><span>Доход за месяц</span><b class="plus">'+monthInc.toLocaleString()+' ₽</b></div>';
  h+='<div class="card stat"><span>Проектов завершено</span><b>'+completedProjects+'</b></div>';
  h+='<div class="card stat"><span>Задач выполнено</span><b>'+doneTasks+'/'+totalTasks+'</b></div></div>';
  
  h+='<div class="card"><b>📈 Доходы за последние 7 дней</b>';
  h+='<div class="chart-bar">';
  weekData.forEach(d=>{
    const hPct=(d.inc/maxInc)*100;
    h+='<div style="flex:1;text-align:center"><div class="chart-col" style="height:100px"><i style="height:'+hPct+'%"></i></div><div class="chart-label">'+d.day+'</div></div>';
  });
  h+='</div></div>';
  
  h+='<div class="card"><b>😊 Настроение (среднее за неделю)</b>';
  h+='<div style="font-size:48px;text-align:center;margin:10px 0">'+(avgMood>0?MOODS[avgMood-1].e:'')+'</div>';
  h+='<div class="mut" style="text-align:center">'+(avgMood>0?MOODS[avgMood-1].n:'Нет данных')+'</div></div>';
  
  // Прогноз дохода
  const daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  const currentDay=new Date().getDate();
  const forecast=currentDay>0?Math.round(monthInc/currentDay*daysInMonth):0;
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>💰 Прогноз дохода на месяц</b>';
  h+='<div style="font-size:32px;text-align:center;margin:10px 0;color:var(--ok)"><b>'+forecast.toLocaleString()+' ₽</b></div>';
  h+='<div class="mut" style="text-align:center">На основе текущей динамики</div></div>';
  
  return h;
}

// ===== СИСТЕМА ДОСТИЖЕНИЙ =====
function rAchievements(){
  const earned=db.achievements||[];
  let h='<div class="row spread"><h2>🏆 Достижения</h2></div>';
  h+='<div class="card" style="background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000"><b>🏆 Получено бейджей: '+earned.length+' / '+ACHIEVEMENTS.length+'</b>';
  h+='<div class="bar" style="margin-top:10px;background:rgba(0,0,0,.2)"><i style="width:'+(earned.length/ACHIEVEMENTS.length*100)+'%;background:#000"></i></div></div>';
  
  h+='<div class="card"><b>Ваши бейджи</b><div class="row" style="flex-wrap:wrap">';
  ACHIEVEMENTS.forEach(a=>{
    const isEarned=earned.includes(a.id);
    h+='<div class="badge '+(isEarned?'earned':'')+'" style="'+(isEarned?'animation:badge-pop .5s ease':'opacity:.4')+'"><span class="icon">'+a.icon+'</span><span class="name">'+a.name+'</span></div>';
  });
  h+='</div></div>';
  
  h+='<div class="card"><b>📋 Условия получения</b>';
  ACHIEVEMENTS.forEach(a=>{
    const isEarned=earned.includes(a.id);
    h+='<div class="row spread" style="margin:8px 0"><span>'+(isEarned?'✅':'⬜')+' '+a.icon+' '+a.name+'</span><span class="mut">'+a.desc+'</span></div>';
  });
  h+='</div>';
  
  h+='<button class="btn ai" onclick="checkAchievements()" style="width:100%"> Проверить достижения</button>';
  return h;
}

function checkAchievements(){
  let newBadges=0;
  if(!db.achievements)db.achievements=[];
  ACHIEVEMENTS.forEach(a=>{
    if(!db.achievements.includes(a.id)&&a.check(db)){
      db.achievements.push(a.id);
      newBadges++;
      setTimeout(()=>toast('🏆 Новый бейдж: '+a.name),500);
    }
  });
  save();render();
  if(newBadges===0)toast('Новых достижений нет');
}

// ===== АВТОГЕНЕРАТОР ПОРТФОЛИО =====
function rPortfolio(){
  let h='<div class="row spread"><h2>💼 Портфолио</h2></div>';
  
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>🎨 Автогенератор портфолио</b>';
  h+='<p class="mut">Создаёт красивую HTML-страницу из ваших проектов</p>';
  h+='<button class="btn ai" onclick="generatePortfolio()" style="width:100%;margin-top:10px">✨ Сгенерировать портфолио</button>';
  h+='<button class="btn sec" onclick="previewPortfolio()" style="width:100%;margin-top:8px">👁 Предпросмотр</button></div>';
  
  if(db.projects.length){
    h+='<div class="card"><b>📁 Ваши проекты ('+db.projects.length+')</b>';
    db.projects.forEach(p=>{
      h+='<div class="note" style="margin-top:8px"><div class="row spread"><b>'+esc(p.name)+'</b><span class="chip '+(p.stage===3?'ok':'on')+'">'+STAGES[p.stage]+'</span></div>';
      h+='<div class="mut">'+esc(p.client||'—')+' · '+p.budget.toLocaleString()+' '+p.cur+'</div></div>';
    });
    h+='</div>';
  }else{
    h+='<div class="card mut">Добавьте проекты для генерации портфолио</div>';
  }
  return h;
}

function generatePortfolioHTML(){
  const completed=db.projects.filter(p=>p.stage===3);
  const skills=db.skills.map(s=>s.n).join(', ');
  let projectsHTML=completed.map(p=>'<div class="project-card"><h3>'+esc(p.name)+'</h3><p>Клиент: '+esc(p.client||'—')+'</p><p>Бюджет: '+p.budget+' '+p.cur+'</p></div>').join('');
  
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Портфолио - '+esc(db.profile.name)+'</title><style>body{font-family:system-ui;max-width:800px;margin:0 auto;padding:20px;background:#0e1116;color:#e8ecf3}h1{color:#6c8cff}.project-card{background:#171b22;padding:20px;border-radius:12px;margin:15px 0;border:1px solid #242b36}.skills{display:flex;gap:8px;flex-wrap:wrap}.skill{background:#6c8cff;color:#fff;padding:6px 12px;border-radius:16px;font-size:13px}a{color:#6c8cff}</style></head><body><h1>⚡ '+esc(db.profile.name)+'</h1><p style="color:#8b94a7">'+esc(db.profile.spec)+'</p><p>📧 '+esc(db.profile.email)+' | 📱 '+esc(db.profile.phone)+'</p><h2> Навыки</h2><div class="skills">'+db.skills.map(s=>'<span class="skill">'+esc(s.n)+'</span>').join('')+'</div><h2>📁 Завершённые проекты ('+completed.length+')</h2>'+(projectsHTML||'<p>Пока нет завершённых проектов</p>')+'<footer style="margin-top:40px;color:#8b94a7;text-align:center">Создано с помощью SoloDev</footer></body></html>';
}

function generatePortfolio(){
  const html=generatePortfolioHTML();
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download='portfolio_'+db.profile.name.replace(/\s+/g,'_')+'.html';
  link.click();
  toast('✅ Портфолио скачано!');
}

function previewPortfolio(){
  const html=generatePortfolioHTML();
  openModal('<h3>👁 Предпросмотр портфолио</h3><iframe srcdoc="'+esc(html).replace(/"/g,'&quot;')+'" style="width:100%;height:400px;border:1px solid var(--line);border-radius:8px"></iframe><button class="btn" style="width:100%;margin-top:10px" onclick="generatePortfolio()">📥 Скачать HTML</button>');
}

// ===== ТРЕКЕР НАСТРОЕНИЯ =====
function rMood(){
  const todayMood=db.moodHistory.find(m=>m.date===today());
  const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);
  const weekStr=weekAgo.toISOString().slice(0,10);
  const weekMoods=db.moodHistory.filter(m=>m.date>=weekStr);
  const avgMood=weekMoods.length?Math.round(weekMoods.reduce((s,m)=>s+m.value,0)/weekMoods.length):0;
  
  let h='<div class="row spread"><h2>😊 Трекер настроения</h2></div>';
  
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>Как вы себя чувствуете сегодня?</b>';
  h+='<div class="row" style="justify-content:center;margin:20px 0;gap:10px">';
  MOODS.forEach((m,i)=>{
    const isSelected=todayMood&&todayMood.value===i+1;
    h+='<button class="mood-btn '+(isSelected?'selected':'')+'" onclick="setMood('+(i+1)+')">'+m.e+'</button>';
  });
  h+='</div>';
  if(todayMood) h+='<div class="mut" style="text-align:center">Сегодня: '+MOODS[todayMood.value-1].e+' '+MOODS[todayMood.value-1].n+'</div>';
  h+='</div>';
  
  h+='<div class="card"><b>📊 Статистика за неделю</b>';
  h+='<div style="font-size:48px;text-align:center;margin:10px 0">'+(avgMood>0?MOODS[avgMood-1].e:'😐')+'</div>';
  h+='<div class="mut" style="text-align:center">Среднее: '+(avgMood>0?MOODS[avgMood-1].n:'Нет данных')+'</div>';
  h+='<div class="mut" style="text-align:center;margin-top:10px">Отмечено дней: '+weekMoods.length+'/7</div></div>';
  
  h+='<div class="card"><b>📝 История</b>';
  db.moodHistory.slice().reverse().slice(0,14).forEach(m=>{
    h+='<div class="row spread" style="margin:8px 0"><span>'+m.date+'</span><span style="font-size:24px">'+MOODS[m.value-1].e+'</span></div>';
  });
  h+='</div>';
  return h;
}

function setMood(value){
  const todayStr=today();
  const existing=db.moodHistory.findIndex(m=>m.date===todayStr);
  if(existing>=0){db.moodHistory[existing].value=value;}
  else{db.moodHistory.push({date:todayStr,value:value,note:''});}
  save();render();
  toast('Настроение сохранено: '+MOODS[value-1].e);
  checkAchievements();
}

// ===== БАЗА ЗНАНИЙ (из v2.3) =====
function rKnowledge(){
  let h='<div class="row spread"><h2>📚 База знаний</h2></div>';
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>🇷🇺 Русскоязычные источники</b>';
  h+='<input id="searchQuery" placeholder="Поиск..." value="'+esc(db.searchQuery||'')+'" style="margin-top:10px">';
  h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn ai" onclick="searchHabr()" style="flex:1">Habr</button><button class="btn warn" onclick="searchVC()" style="flex:1">VC.ru</button></div>';
  h+='<button class="btn" onclick="searchAllRU()" style="width:100%;margin-top:8px"> Искать на РУССКОМ</button></div>';
  h+='<div class="card"><b>🌐 Англоязычные</b><div class="row" style="margin-top:10px;gap:8px"><button class="btn sec" onclick="searchGitHub()" style="flex:1">GitHub</button><button class="btn sec" onclick="searchHN()" style="flex:1">HN</button></div></div>';
  h+='<div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">'+(db.profile.specs||[]).map(sp=>'<button class="tag" onclick="quickSearch(\\''+esc(sp)+'\\')">'+esc(sp)+'</button>').join('')+'</div>';
  
  if(db.savedArticles&&db.savedArticles.length){
    h+='<div class="card"><b>📚 Сохранённые ('+db.savedArticles.length+')</b><button class="btn danger" style="margin-top:8px" onclick="clearSavedArticles()"> Очистить</button>';
    db.savedArticles.slice(0,15).forEach((a,idx)=>{
      const langChip=a.lang==='ru'?'<span class="chip ru">RU</span>':'<span class="chip en">EN</span>';
      const translateBtn=a.lang==='en'?'<a href="https://translate.google.com/translate?sl=en&tl=ru&u='+encodeURIComponent(a.url)+'" target="_blank" class="btn sec" style="text-decoration:none;padding:6px 10px;font-size:12px"> Перевести</a>':'';
      h+='<div class="card article-card" style="margin-top:10px"><div class="row spread"><b>'+(idx+1)+'. '+esc(a.title)+'</b>'+langChip+'</div>';
      if(a.description) h+='<div class="note" style="margin-top:8px">'+esc(a.description).substring(0,100)+'</div>';
      h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><a href="'+esc(a.url)+'" target="_blank" class="btn sec" style="text-decoration:none">🔗 Открыть</a>'+translateBtn+'<button class="btn danger" onclick="delSavedArticle('+idx+')">🗑</button></div>';
      if(a.note) h+='<div class="note" style="margin-top:8px"><b>📝 Заметка:</b> '+esc(a.note)+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  return h;
}

async function searchHabr(){const q=db.searchQuery||db.profile.specs[0]||'javascript';toast('📘 Habr...');try{const r=await fetch('https://habr.com/api/v1/articles/?q='+encodeURIComponent(q)+'&page=1&per_page=10');const data=await r.json();let added=0;(data.items||[]).forEach(a=>{if(!db.savedArticles.some(x=>x.url==='https://habr.com'+a.link)){db.savedArticles.push({id:uid(),source:'habr',title:a.title,author:a.author?a.author.login:'',url:'https://habr.com'+a.link,description:a.summary||'',stats:'👁 '+a.stats.views_count,date:today(),lang:'ru'});added++;}});save();render();toast('📘 +'+added);}catch(e){toast('Ошибка Habr');}}
async function searchVC(){const q=db.searchQuery||'разработка';toast('📰 VC.ru...');try{const r=await fetch('https://vc.ru/api/search?q='+encodeURIComponent(q)+'&type=post');const data=await r.json();let added=0;(data.items||[]).forEach(a=>{if(!db.savedArticles.some(x=>x.url===a.url)){db.savedArticles.push({id:uid(),source:'vc',title:a.title,author:a.author_name||'',url:a.url,description:a.description||'',stats:'👁 '+a.views_count,date:today(),lang:'ru'});added++;}});save();render();toast('📰 +'+added);}catch(e){toast('Ошибка VC.ru');}}
async function searchGitHub(){const q=db.searchQuery||'javascript';toast('🐙 GitHub...');try{const r=await fetch('https://api.github.com/search/repositories?q='+encodeURIComponent(q)+'&sort=stars&per_page=10');const data=await r.json();let added=0;(data.items||[]).forEach(repo=>{if(!db.savedArticles.some(x=>x.url===repo.html_url)){db.savedArticles.push({id:uid(),source:'github',title:repo.full_name,author:repo.owner?repo.owner.login:'',url:repo.html_url,description:repo.description||'',stats:'⭐ '+repo.stargazers_count,date:today(),lang:'en'});added++;}});save();render();toast('🐙 +'+added);}catch(e){toast('Ошибка GitHub');}}
async function searchHN(){const q=db.searchQuery||'programming';toast(' HN...');try{const r=await fetch('https://hn.algolia.com/api/v1/search?query='+encodeURIComponent(q)+'&tags=story&hitsPerPage=10');const data=await r.json();let added=0;(data.hits||[]).forEach(h=>{const url=h.url||'https://news.ycombinator.com/item?id='+h.object_id;if(!db.savedArticles.some(x=>x.url===url)){db.savedArticles.push({id:uid(),source:'hn',title:h.title,author:h.author||'',url:url,stats:'🔺 '+h.points,date:today(),lang:'en'});added++;}});save();render();toast('🔶 +'+added);}catch(e){toast('Ошибка HN');}}
async function searchAllRU(){db.searchQuery=document.getElementById('searchQuery').value.trim()||db.profile.specs[0]||'javascript';toast('🚀 Ищу...');await searchHabr();await new Promise(r=>setTimeout(r,500));await searchVC();toast('✅ Найдено: '+(db.savedArticles?db.savedArticles.length:0));}
function quickSearch(q){db.searchQuery=q;document.getElementById('searchQuery').value=q;searchAllRU();}
function delSavedArticle(idx){db.savedArticles.splice(idx,1);save();render();}
function clearSavedArticles(){if(confirm('Удалить все?')){db.savedArticles=[];save();render();}}

// ===== ОСТАЛЬНЫЕ ВКЛАДКИ =====
function rRadar(){let h='<div class="row spread"><h2>🎯 Радар</h2></div><div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>🇷🇺 Российские биржи</b><div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><a href="https://freelance.habr.com/tasks?q='+encodeURIComponent((db.profile.specs||[]).join(' '))+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Habr</a><a href="https://www.fl.ru/projects/?keyword='+encodeURIComponent((db.profile.specs||[]).join(' '))+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">FL.ru</a><a href="https://kwork.ru/projects?keyword='+encodeURIComponent((db.profile.specs||[]).join(' '))+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Kwork</a></div></div>';if(db.leads&&db.leads.length){h+='<div class="card"><b>🎯 Лиды: '+db.leads.length+'</b>';db.leads.slice(0,5).forEach((l,idx)=>{h+='<div class="card" style="margin-top:10px"><b>'+(idx+1)+'. '+esc(l.title)+'</b><div class="mut">'+esc(l.company||'')+'</div><div class="row" style="margin-top:10px;gap:8px"><button class="btn sec" onclick="leadToClient('+idx+')">👥</button><button class="btn danger" onclick="delLead('+idx+')">🗑</button></div></div>';});h+='</div>';}return h;}
function leadToClient(idx){const l=db.leads[idx];if(!l)return;db.clients.push({id:uid(),name:l.company||l.title,company:l.company||'',budget:0,cur:'RUB',status:'Новый',date:today()});save();render();toast('👥 Добавлен!');checkAchievements();}
function delLead(idx){db.leads.splice(idx,1);save();render();}
function rClients(){let h='<div class="row spread"><h2>👥 Клиенты</h2><button class="btn" onclick="addClient()">+ Лид</button></div>';db.clients.forEach(c=>{h+='<div class="card"><div class="row spread"><b>'+esc(c.name)+'</b><span class="chip on">'+c.status+'</span></div><div class="mut">'+esc(c.company)+' · '+c.budget+' '+c.cur+'</div></div>';});return h;}
function addClient(){const n=prompt('Имя:');if(!n)return;db.clients.push({id:uid(),name:n,company:prompt('Компания:')||'',budget:+prompt('Бюджет:')||0,cur:'RUB',status:'Новый',date:today()});save();render();checkAchievements();}
function rProjects(){let h='<div class="row spread"><h2>📁 Проекты</h2><button class="btn" onclick="addProject()">+ Проект</button></div>';db.projects.forEach(p=>{h+='<div class="card"><div class="row spread"><b>'+esc(p.name)+'</b><span class="chip on">'+STAGES[p.stage]+'</span></div><div class="mut">'+esc(p.client||'—')+' · '+p.budget+' '+p.cur+'</div></div>';});return h;}
function addProject(){const n=prompt('Название:');if(!n)return;db.projects.push({id:uid(),name:n,client:prompt('Клиент:')||'',budget:+prompt('Бюджет:')||0,cur:'RUB',stage:0,date:today(),tasks:[]});save();render();}
function rHabits(){let h='<div class="row spread"><h2>✅ Привычки</h2><button class="btn" onclick="addHabit()">+ Привычка</button></div>';const todayStr=today();db.habits.forEach(hab=>{const done=hab.history&&hab.history[todayStr];h+='<div class="card row spread"><div class="row" style="gap:10px"><span style="font-size:24px">'+hab.icon+'</span><span>'+esc(hab.name)+'</span><span class="mut">🔥'+hab.streak+'</span></div><button class="btn '+(done?'ok':'sec')+'" onclick="toggleHabit(\\''+hab.id+'\\')">'+(done?'✓':'Отметить')+'</button></div>';});return h;}
function addHabit(){const name=prompt('Название:');if(!name)return;db.habits.push({id:uid(),name:name,icon:'✅',streak:0,history:{}});save();render();}
function toggleHabit(id){const h=db.habits.find(x=>x.id===id);if(!h)return;if(!h.history)h.history={};const todayStr=today();if(h.history[todayStr]){delete h.history[todayStr];h.streak=Math.max(0,h.streak-1);}else{h.history[todayStr]=true;h.streak++;}save();render();checkAchievements();}
function rTime(){const mode=TIMER_MODES[db.timerMode||0];return '<div class="row spread"><h2>⏱ Время</h2></div><div class="card" style="text-align:center"><div style="font-size:48px;font-weight:bold;color:var(--acc)" id="timer">'+formatTime(mode.work*60)+'</div><div class="mut">'+mode.name+'</div><div class="row" style="justify-content:center;margin-top:15px;gap:8px"><button class="btn" onclick="startT()">▶ Старт</button><button class="btn sec" onclick="resetT()">Сброс</button></div></div><div class="card"><b>Режимы</b>'+TIMER_MODES.map((m,i)=>'<div class="row spread" style="margin:8px 0"><span>'+m.name+'</span><button class="btn '+(db.timerMode===i?'ai':'sec')+'" onclick="setTimerMode('+i+')">Выбрать</button></div>').join('')+'</div>';}
function formatTime(sec){const m=Math.floor(sec/60).toString().padStart(2,'0'),s=(sec%60).toString().padStart(2,'0');return m+':'+s;}
let tInt,tSec,tMode='focus';
function startT(){if(tInt)return;const mode=TIMER_MODES[db.timerMode||0];tSec=mode.work*60;tInt=setInterval(()=>{tSec--;const el=document.getElementById('timer');if(el)el.textContent=formatTime(tSec);if(tSec<=0){clearInterval(tInt);tInt=null;toast('Время вышло!');}},1000);}
function resetT(){clearInterval(tInt);tInt=null;const el=document.getElementById('timer');if(el)el.textContent=formatTime(TIMER_MODES[db.timerMode||0].work*60);}
function setTimerMode(i){db.timerMode=i;save();render();}
function rSettings(){
  const qrData='BEGIN:VCARD\\nVERSION:3.0\\nFN:'+db.profile.name+'\\nTITLE:'+db.profile.spec+'\\nTEL:'+db.profile.phone+'\\nEMAIL:'+db.profile.email+'\\nEND:VCARD';
  const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(qrData);
  return '<div class="row spread"><h2>️ Настройки</h2></div><div class="card"><b>👤 Профиль</b><label>Имя</label><input value="'+esc(db.profile.name)+'" onchange="db.profile.name=this.value;save()"><label>Специализация</label><input value="'+esc(db.profile.spec)+'" onchange="db.profile.spec=this.value;save()"><label>Телефон</label><input value="'+esc(db.profile.phone||'')+'" onchange="db.profile.phone=this.value;save()"><label>Email</label><input value="'+esc(db.profile.email||'')+'" onchange="db.profile.email=this.value;save()"></div><div class="card"><b>📱 QR-код визитки</b><img src="'+qrUrl+'" style="width:200px;height:200px;margin:10px auto;display:block;border-radius:10px"></div><div class="card"><b>🎨 Тема</b><button class="btn sec" onclick="document.body.classList.toggle(\\'light-theme\\');localStorage.setItem(\\'theme\\',document.body.classList.contains(\\'light-theme\\')?\\'light\\':\\'dark\\')" style="width:100%"> Переключить тему</button><label style="margin-top:10px;display:flex;align-items:center;gap:8px"><input type="checkbox" '+(db.autoTheme?'checked':'')+' onchange="db.autoTheme=this.checked;save()" style="margin:0"><span>🌙 Авто-тема по времени</span></label></div><div class="card"><b>🔔 Уведомления</b><button class="btn" onclick="requestNotifications()" style="width:100%">Разрешить уведомления</button></div><div class="card"><b>🔄 Сброс</b><button class="btn danger" onclick="hardReset()" style="width:100%">🔄 Сбросить кэш</button></div>';
}
function requestNotifications(){if('Notification' in window){Notification.requestPermission().then(p=>{if(p==='granted'){toast('✅ Уведомления разрешены!');new Notification('SoloDev',{body:'Уведомления работают!'});}else{toast('Уведомления запрещены');}});}else{toast('Браузер не поддерживает уведомления');}}
function hardReset(){if(confirm("⚠️ Удалить кэш?")){if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if("caches"in window)caches.keys().then(n=>n.forEach(k=>caches.delete(k)));window.location.href=window.location.pathname+"?v="+Date.now();}}

function render(){
  document.getElementById('date').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const app=document.getElementById('app');
  switch(tab){
    case 'home':app.innerHTML=rHome();break;case 'dashboard':app.innerHTML=rDashboard();break;case 'radar':app.innerHTML=rRadar();break;
    case 'clients':app.innerHTML=rClients();break;case 'projects':app.innerHTML=rProjects();break;case 'knowledge':app.innerHTML=rKnowledge();break;
    case 'achievements':app.innerHTML=rAchievements();break;case 'portfolio':app.innerHTML=rPortfolio();break;case 'mood':app.innerHTML=rMood();break;
    case 'habits':app.innerHTML=rHabits();break;case 'time':app.innerHTML=rTime();break;case 'settings':app.innerHTML=rSettings();break;
  }
}

window.onload=()=>{
  try{
    if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');
    applyAutoTheme();
    setTimeout(()=>{document.getElementById('splash').classList.add('hidden');setTimeout(()=>{document.getElementById('splash').style.display='none';},500);renderNav();render();checkAchievements();},1500);
  }catch(e){console.error('Ошибка:',e);document.getElementById('splash').classList.add('hidden');}
};
</script>
