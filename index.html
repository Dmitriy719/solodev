<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloDev v5.0</title>
<style>
body{background:#0e1116;color:#e8ecf3;font-family:system-ui,sans-serif;margin:0;padding:20px}
h1{color:#6c8cff}
.card{background:#171b22;border:1px solid #242b36;border-radius:12px;padding:15px;margin:10px 0}
.btn{background:#6c8cff;color:#fff;border:none;border-radius:8px;padding:10px 15px;width:100%;margin-top:10px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.small{width:auto;padding:8px 12px;font-size:14px}
.btn.active{background:#9d6cff}
.btn.ai{background:linear-gradient(90deg,#6c8cff,#9d6cff)}
.btn.ok{background:#3ecf8e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:#8b94a7;font-size:13px}
.stat{display:block;font-size:12px;color:#8b94a7}.stat b{font-size:20px}
.bar{height:6px;background:#1f2530;border-radius:3px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#6c8cff;border-radius:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.on{display:flex}
.modal-content{background:#171b22;width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
input,textarea{width:100%;background:#1f2530;border:1px solid #242b36;color:#e8ecf3;border-radius:8px;padding:10px;margin:8px 0}
.nav{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.info-row{display:flex;justify-content:space-between;margin:8px 0;padding:8px;background:#1f2530;border-radius:8px}
.estimate-box{background:#1f2530;border-radius:8px;padding:10px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.estimate-item div:first-child{font-size:11px;color:#8b94a7;margin-bottom:4px}
.estimate-item div:last-child{font-size:14px;font-weight:bold;color:#e8ecf3}
.source-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.source-item{background:#1f2530;padding:10px;border-radius:8px;text-align:center}
.source-item a{color:#6c8cff;text-decoration:none;font-weight:bold}
.source-item .mut{font-size:11px;margin-top:4px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filter-btn{background:#1f2530;color:#e8ecf3;border:1px solid #242b36;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.filter-btn.active{background:#6c8cff;border-color:#6c8cff}
.loading{text-align:center;padding:20px;color:#8b94a7}
.big-number{font-size:32px;font-weight:bold;color:#3ecf8e;text-align:center;margin:10px 0}
</style>
</head>
<body>
<h1>⚡ SoloDev v5.0</h1>
<div class="nav">
<button class="btn small active" id="btnHome" onclick="showHome()">🏠 Главная</button>
<button class="btn small" id="btnDashboard" onclick="showDashboard()">📊 Дашборд</button>
<button class="btn small" id="btnRadar" onclick="showRadar()">🎯 Радар</button>
<button class="btn small" id="btnProjects" onclick="showProjects()"> Проекты</button>
</div>
<div id="app"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-content" id="modalContent"></div></div>
<script>
var db={profile:{name:'Дмитрий',spec:'Fullstack разработчик',specs:['Фронтенд','Бэкенд','Боты']},clients:[],projects:[],finances:[],leads:[],pains:[],sources:[],templates:[],showAllTemplates:false,autoLeads:[]};
var currentView='home';
var TEMPLATES_LOADED=false;
var SOURCES_LOADED=false;

function save(){localStorage.setItem('solodev',JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function showHome(){currentView='home';updateNav();renderHome()}
function showDashboard(){currentView='dashboard';updateNav();renderDashboard()}
function showRadar(){currentView='radar';updateNav();renderRadar()}
function showProjects(){currentView='projects';updateNav();renderProjects()}
function updateNav(){document.getElementById('btnHome').classList.toggle('active',currentView==='home');document.getElementById('btnDashboard').classList.toggle('active',currentView==='dashboard');document.getElementById('btnRadar').classList.toggle('active',currentView==='radar');document.getElementById('btnProjects').classList.toggle('active',currentView==='projects')}

function renderHome(){
  var inc=0;db.finances.forEach(function(f){if(f.type==='in')inc+=f.amt});
  var h='<div class="card" style="background:linear-gradient(135deg,#6c8cff,#9d6cff);color:#fff"><h2 style="margin:0">Привет, '+esc(db.profile.name)+'! 👋</h2><p style="margin:5px 0 0 0;opacity:0.9">'+esc(db.profile.spec)+'</p></div>';
  h+='<div class="grid"><div class="card"><span class="stat">Доход</span><b style="font-size:20px;color:#3ecf8e">'+inc.toLocaleString()+' ₽</b></div><div class="card"><span class="stat">Клиентов</span><b style="font-size:20px">'+db.clients.length+'</b></div><div class="card"><span class="stat">Проектов</span><b style="font-size:20px">'+db.projects.length+'</b></div><div class="card"><span class="stat">Шаблонов</span><b style="font-size:20px">'+db.pains.length+'</b></div></div>';
  h+='<div class="card"><div class="mut">📚 База шаблонов</div><div class="big-number">'+db.templates.length+'</div><div class="mut"> Источников поиска</div><div class="big-number">'+db.sources.length+'</div><div class="mut">🤖 Авто-лидов сегодня</div><div class="big-number">'+db.autoLeads.length+'</div></div>';
  document.getElementById('app').innerHTML=h;
}

function renderDashboard(){
  var monthFin=db.finances.filter(function(f){return f.date&&f.date.startsWith(today().slice(0,7))});
  var monthInc=0;monthFin.forEach(function(f){if(f.type==='in')monthInc+=f.amt});
  var daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  var currentDay=new Date().getDate();
  var dailyAvg=currentDay>0?Math.round(monthInc/currentDay):0;
  var forecast=currentDay>0?Math.round(monthInc/currentDay*daysInMonth):0;
  var remaining=forecast-monthInc;
  var h='<h2>📊 Дашборд продуктивности</h2>';
  h+='<div class="grid"><div class="card"><span class="stat">Доход за месяц</span><b style="font-size:20px;color:#3ecf8e">'+monthInc.toLocaleString()+' ₽</b></div><div class="card"><span class="stat">Ср. в день</span><b style="font-size:20px">'+dailyAvg.toLocaleString()+' ₽</b></div></div>';
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><h3 style="margin-top:0;color:#fff">💰 Прогноз дохода на месяц</h3><div style="font-size:32px;text-align:center;margin:15px 0;color:#3ecf8e;font-weight:bold">'+forecast.toLocaleString()+' ₽</div>';
  h+='<div class="info-row"><span> Уже заработано:</span><b style="color:#3ecf8e">'+monthInc.toLocaleString()+' ₽</b></div>';
  h+='<div class="info-row"><span>📈 Осталось до прогноза:</span><b style="color:#9d6cff">'+remaining.toLocaleString()+' ₽</b></div>';
  h+='<div class="mut" style="text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid #242b36">При текущей скорости к '+daysInMonth+' числу</div></div>';
  document.getElementById('app').innerHTML=h;
}

function renderRadar(){
  var h='<h2>🎯 Радар v5.0</h2>';
  
  // Статистика базы
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><h3 style="margin-top:0;color:#fff">📊 Ваша база</h3>';
  h+='<div class="grid"><div style="text-align:center"><div class="mut">Шаблонов проектов</div><div class="big-number">'+db.templates.length+'</div></div><div style="text-align:center"><div class="mut">Источников поиска</div><div class="big-number">'+db.sources.length+'</div></div></div>';
  h+='</div>';
  
  // Автопоиск
  h+='<div class="card"><h3 style="margin-top:0">🤖 Автопополнение из HH.ru</h3>';
  h+='<p class="mut">Автоматически ищет свежие вакансии по вашим навыкам</p>';
  h+='<button class="btn ai" onclick="autoSearchHH()">🇷🇺 Найти вакансии на HH.ru</button>';
  if(db.autoLeads.length){
    h+='<div class="mut" style="margin-top:10px">Найдено сегодня: <b>'+db.autoLeads.length+'</b> вакансий</div>';
    db.autoLeads.slice(0,5).forEach(function(l,idx){
      h+='<div class="card" style="margin-top:8px;border-left:3px solid #d6001c;padding-left:12px"><b>'+esc(l.title)+'</b><div class="mut">'+esc(l.company||'')+'</div>';
      if(l.salary)h+='<div style="color:#3ecf8e;font-size:13px"> '+esc(l.salary)+'</div>';
      h+='<div style="display:flex;gap:8px;margin-top:8px"><button class="btn small" onclick="leadToClient(\'auto\','+idx+')">👥 В клиенты</button><button class="btn small" style="background:#1f2530" onclick="leadOutreach(\'auto\','+idx+')">✍️ Написать</button></div></div>';
    });
  }
  h+='</div>';
  
  // Источники
  h+='<div class="card"><h3 style="margin-top:0">🔍 Где искать клиентов ('+db.sources.length+' источников)</h3>';
  h+='<p class="mut">Биржи, Telegram, Reddit, форумы, прямые работодатели</p>';
  
  var categories={};
  db.sources.forEach(function(s){if(!categories[s.category])categories[s.category]=[];categories[s.category].push(s)});
  
  Object.keys(categories).forEach(function(cat){
    h+='<div style="margin-top:15px"><b style="color:#6c8cff">'+cat+' ('+categories[cat].length+')</b>';
    h+='<div class="source-grid">';
    categories[cat].forEach(function(s){
      h+='<div class="source-item"><a href="'+esc(s.url)+'" target="_blank">'+s.icon+' '+esc(s.name)+'</a><div class="mut">'+esc(s.description)+'</div></div>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  
  // Фильтр шаблонов
  h+='<div class="card"><h3 style="margin-top:0"> Шаблоны проектов ('+db.templates.length+' в базе)</h3>';
  h+='<div class="filter-row">';
  h+='<button class="filter-btn '+(db.showAllTemplates?'':'active')+'" onclick="toggleFilter()">Только мои навыки</button>';
  h+='<button class="filter-btn '+(db.showAllTemplates?'active':'')+'" onclick="toggleFilter()">Показать все</button>';
  h+='</div>';
  h+='<button class="btn ai" onclick="generatePains()">🎯 Сгенерировать из базы</button>';
  h+='<button class="btn small" style="background:transparent;color:#ff6b6b;border:1px solid #ff6b6b;margin-top:8px" onclick="clearPains()">🗑 Очистить мои шаблоны</button></div>';
  
  if(db.pains&&db.pains.length){
    h+='<div class="mut" style="margin:10px 0">Показано: '+db.pains.length+' шаблонов</div>';
    db.pains.forEach(function(p,idx){
      h+='<div class="card">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="background:#6c8cff;color:#fff;padding:2px 8px;border-radius:6px;font-size:11px">'+esc(p.spec)+'</span><b>'+esc(p.seg)+'</b></div>';
      h+='<div style="color:#ff6b6b;font-size:14px;margin-bottom:6px">❌ '+esc(p.pain)+'</div>';
      h+='<div style="color:#3ecf8e;font-size:14px;margin-bottom:10px">✅ '+esc(p.sol)+'</div>';
      h+='<div class="estimate-box">';
      h+='<div class="estimate-item"><div>Сложность</div><div>'+p.complexity+'</div></div>';
      h+='<div class="estimate-item"><div>Сроки</div><div>'+p.time+'</div></div>';
      h+='<div class="estimate-item"><div>Бюджет</div><div style="color:#3ecf8e">'+p.cost+'</div></div>';
      h+='</div>';
      h+='<div style="display:flex;gap:8px;margin-top:12px"><button class="btn small" onclick="genOutreach(\''+esc(p.seg)+'\',\''+esc(p.pain)+'\',\''+esc(p.sol)+'\',\''+p.time+'\',\''+p.cost+'\')">✍️ Скопировать письмо</button><button class="btn small" style="background:transparent;color:#ff6b6b;border:1px solid #ff6b6b" onclick="delPain(\''+p.id+'\')">🗑</button></div>';
      h+='</div>';
    });
  }
  document.getElementById('app').innerHTML=h;
}

function toggleFilter(){db.showAllTemplates=!db.showAllTemplates;save();renderRadar()}

function generatePains(){
  var added=0;
  var userSpecs = db.profile.specs || ['Фронтенд', 'Бэкенд', 'Боты'];
  db.templates.forEach(function(p){
    var shouldAdd = db.showAllTemplates || userSpecs.includes(p.spec);
    if(shouldAdd && !db.pains.some(function(x){return x.pain===p.pain && x.seg===p.seg})){
      db.pains.push({id:uid(), spec:p.spec, seg:p.seg, pain:p.pain, sol:p.sol, complexity:p.complexity, time:p.time, cost:p.cost, demand:p.demand||5, status:'Гипотеза'});
      added++;
    }
  });
  save(); renderRadar();
  alert(added>0 ? '✅ Добавлено '+added+' шаблонов из базы '+db.templates.length+'!' : '️ Все подходящие шаблоны уже в базе');
}

function clearPains(){if(confirm('Удалить все мои шаблоны?')){db.pains=[];save();renderRadar()}}
function delPain(id){if(confirm('Удалить этот шаблон?')){db.pains=db.pains.filter(function(p){return p.id!==id});save();renderRadar()}}

function genOutreach(seg, pain, sol, time, cost){
  var txt='Здравствуйте!\n\nМеня зовут '+db.profile.name+', я '+db.profile.spec+'.\n\nЗаметил, что для '+seg+' актуальна проблема: "'+pain+'".\n\nЯ решаю такие задачи следующим образом: '+sol+'.\n\nОбычно реализация занимает '+time+', а бюджет составляет '+cost+'.\n\nНайдётся 5-10 минут на этой неделе, чтобы обсудить детали?\n\nС уважением,\n'+db.profile.name;
  navigator.clipboard.writeText(txt).then(function(){alert('✉️ Письмо скопировано!')});
}

function autoSearchHH(){
  var specs=db.profile.specs||['разработчик'];
  var found=0;
  db.autoLeads=[];
  var promises=specs.map(function(q){
    return fetch('https://api.hh.ru/vacancies?text='+encodeURIComponent(q)+'&per_page=10&area=1').then(function(r){return r.json()}).then(function(data){
      (data.items||[]).forEach(function(v){
        var salary='';
        if(v.salary){if(v.salary.from)salary+=v.salary.from+' ';else if(v.salary.to)salary+=v.salary.to+' ';salary+=(v.salary.currency||'RUB')}
        db.autoLeads.push({id:uid(),title:v.name,company:v.employer?v.employer.name:'',salary:salary,url:v.alternate_url,date:today()});
        found++;
      });
    }).catch(function(){alert('⚠️ HH.ru недоступен (CORS). Попробуйте позже.')});
  });
  Promise.all(promises).then(function(){save();renderRadar();if(found>0)alert('🇷🇺 Найдено: '+found+' вакансий!')});
}

function leadToClient(type,idx){
  var list=type==='auto'?db.autoLeads:db.leads;
  var l=list[idx];if(!l)return;
  db.clients.push({id:uid(),name:l.company||l.title,company:l.company||'',budget:0,status:'Новый',date:today()});
  save();alert('👥 Добавлен в клиенты!');
}

function leadOutreach(type,idx){
  var list=type==='auto'?db.autoLeads:db.leads;
  var l=list[idx];if(!l)return;
  var txt='Здравствуйте!\n\nМеня зовут '+db.profile.name+', я '+db.profile.spec+'.\n\nУвидел вашу вакансию: "'+l.title+'".\n\nБуду рад обсудить детали.\n\nС уважением,\n'+db.profile.name;
  navigator.clipboard.writeText(txt).then(function(){alert('✉️ Письмо скопировано!')});
}

function renderProjects(){
  var h='<h2> Проекты</h2><button class="btn" onclick="addProject()">+ Проект</button>';
  db.projects.forEach(function(p){
    var doneTasks=p.tasks?p.tasks.filter(function(t){return t.done}).length:0;
    var totalTasks=p.tasks?p.tasks.length:0;
    var progress=totalTasks?Math.round(doneTasks/totalTasks*100):0;
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(p.name)+'</b><span style="padding:4px 12px;background:#6c8cff;border-radius:12px;font-size:12px">'+['Идея','В работе','Тестирование','Завершён'][p.stage]+'</span></div>';
    h+='<div class="mut">'+esc(p.client||'—')+' · '+p.budget.toLocaleString()+' ₽</div>';
    h+='<div class="bar"><i style="width:'+progress+'%"></i></div>';
    h+='<div class="mut">Задачи: '+doneTasks+'/'+totalTasks+'</div></div>';
  });
  document.getElementById('app').innerHTML=h;
}

function addProject(){var name=prompt('Название:');if(!name)return;db.projects.push({id:uid(),name:name,client:prompt('Клиент:')||'',budget:+prompt('Бюджет:')||0,stage:1,tasks:[]});save();renderProjects()}

function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}

// Загрузка JSON-файлов при старте
function loadExternalData(){
  fetch('templates.json?v='+Date.now()).then(function(r){return r.json()}).then(function(data){
    db.templates=data;
    TEMPLATES_LOADED=true;
    save();
    if(currentView==='home'||currentView==='radar')renderHome();
  }).catch(function(e){console.log('Templates load error:',e)});
  
  fetch('sources.json?v='+Date.now()).then(function(r){return r.json()}).then(function(data){
    db.sources=data;
    SOURCES_LOADED=true;
    save();
    if(currentView==='home'||currentView==='radar')renderHome();
  }).catch(function(e){console.log('Sources load error:',e)});
}

window.onload=function(){
  save();
  renderHome();
  loadExternalData();
};
</script>
</body>
</html>
