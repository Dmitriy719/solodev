<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SoloDev v0.9</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--acc2:#9d6cff;--ok:#3ecf8e;--warn:#ffb454;--bad:#ff6b6b;--line:#242b36}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(14,17,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}
header span{color:var(--mut);font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:var(--card);color:var(--mut);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff;border-color:transparent}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 10px}
h3{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}
.stat b{font-size:19px}
.mut{color:var(--mut);font-size:13px}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:8px;margin:6px 0;font-size:13px;color:var(--mut)}
.warn{background:#241d0e;border-color:#5a4a1e}
.ai{background:#1a2035;border-color:#3a4a7a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.row select,.row input,.row button{margin:0}
.row select{flex:1;max-width:180px;width:auto}
.row input{flex:1}
.row2{display:flex;gap:10px}.row2>*{flex:1}
label{font-size:12px;color:var(--mut);display:block;margin-top:4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:15px;margin:4px 0 10px;font-family:inherit}
input[type=checkbox],input[type=date],input[type=time],input[type=number]{width:auto}
textarea{resize:vertical}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:600}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);padding:10px 12px}
.btn.ai-btn{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.skill{margin:10px 0}
#tview{font-size:44px;font-weight:700;letter-spacing:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.cal-h{text-align:center;color:var(--mut);font-size:11px;padding:2px 0}
.cal-c{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:48px;padding:4px 2px;font-size:12px;text-align:center}
.cal-c.today{border-color:var(--acc);background:#1c2333}
.cal-c.over{border-color:var(--bad)}
details summary{font-weight:700;cursor:pointer}
.docprint{background:#fff;color:#000;border-radius:10px;padding:18px;white-space:pre-wrap;font-size:14px;line-height:1.55;min-height:200px;outline:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.m-card{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-size:13px;z-index:50}
.hello{color:var(--mut);margin:2px 0 12px}
@media print{body *{visibility:hidden}#printarea,#printarea *{visibility:visible}#printarea{position:fixed;left:0;top:0;width:100%;border-radius:0!important}}

/* ===== SPLASH SCREEN ===== */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.5s}
#splash.hidden{opacity:0;pointer-events:none}
#splash .logo{font-size:64px;margin-bottom:20px;animation:pulse 1.5s ease-in-out infinite}
#splash h1{font-size:28px;margin-bottom:10px;color:var(--acc)}
#splash .loader{width:200px;height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-top:20px}
#splash .loader-bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%;animation:loading 2s ease-in-out forwards}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes loading{0%{width:0%}100%{width:100%}}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="logo">⚡</div>
  <h1>SoloDev</h1>
  <p class="mut">Загрузка приложения...</p>
  <div class="loader"><div class="loader-bar"></div></div>
</div>

<header><b>⚡ SoloDev v0.9</b><div class="row" style="gap:10px"><span id="hdr"></span><button id="lockbtn" class="btn sec" style="display:none;padding:6px 10px" onclick="lockNow()">🔒</button></div></header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="m-card" id="mcard"></div></div>

<script>
/* ===== ДАННЫЕ ===== */
const KEY='solodev_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const loc=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>d?d.split('-').reverse().join('.'):'';
const CURS={RUB:'₽',BYN:'Br',CNY:'¥',USD:'$'};
const FLAG={ru:'🇷🇺',by:'🇧🇾',cn:'🇨🇳'};
const CNAME={ru:'Россия',by:'Беларусь',cn:'Китай'};
const MOOD_E={1:'😞',2:'😕',3:'😐',4:'🙂',5:'😄'};
const SOURCES=['Автопоиск (ИИ)','Холодный поиск','Telegram','Рекомендация','Хабр/VC','LinkedIn','WeChat','Радар (боли)','Другое'];
const CLIENT_ST=['Новый','Контакт','Переговоры','Оффер','Договор','В работе','Завершён','Отказ'];
const PROP_ST=['Черновик','Отправлен','Принят','Отклонён','Договор'];
const PROJ_ST=['Предоплата','Разработка','Тестирование','Сдача','Оплачен','Пауза'];
const PAIN_ST=['Гипотеза','Подтверждена','В работе','Пустая'];
const CH_ST=['Планируется','В работе','Работает','Пауза'];
const DOC_STATUS=['Черновик','Отправлен','Подписан'];
const LEVELS=['изучаю','новичок','уверенно','опытный','эксперт','ментор'];
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const DAYS_W=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const KB_ST=['Не начато','Изучаю','Практика','Освоено'];
const UNITS=['проект','час','месяц','шт'];
const ALL_SPECS=['Фронтенд','Бэкенд','Мобильная разработка','Боты и интеграции','DevOps и хостинг','Дизайн и UI','Данные и ML','Бизнес-навыки'];

const PAIN_DB={
 'Фронтенд':[{seg:'Владельцы интернет-магазинов',pain:'Сайт медленно загружается',sol:'Оптимизация скорости',demand:5},{seg:'Стартапы без сайта',pain:'Нет современного сайта',sol:'Лендинг за 1-2 недели',demand:4}],
 'Бэкенд':[{seg:'Стартапы',pain:'Нужен быстрый бэкенд',sol:'REST API за 1-2 недели',demand:5}],
 'Мобильная разработка':[{seg:'Владельцы доставки',pain:'Нет мобильного приложения',sol:'Приложение с push',demand:5}],
 'Боты и интеграции':[{seg:'Владельцы каналов',pain:'Много вопросов',sol:'Бот с FAQ',demand:5}],
 'DevOps':[{seg:'Стартапы',pain:'Сайт падает',sol:'CI/CD и мониторинг',demand:4}],
 'Дизайн':[{seg:'Стартапы',pain:'Непрофессиональный вид',sol:'UI-кит',demand:5}],
 'Данные':[{seg:'Компании',pain:'Решения без данных',sol:'Дашборды',demand:4}],
 'Бизнес':[{seg:'Фрилансеры',pain:'Не умеют оценивать',sol:'Консультации',demand:3}]};

const TIPS_POOL=['Начните с самой сложной задачи.','Перерыв каждые 2 часа.','Проверяйте почту в выделенное время.','Планируйте завтра вечером.','Один день в неделю — без работы.'];
const SKILL_DIR={'Фронтенд':['HTML/CSS','JavaScript','TypeScript','React','Vue','Next.js'],'Бэкенд':['Node.js','Python','PostgreSQL','Redis'],'Мобильная':['React Native','Flutter'],'Боты':['Telegram-боты','Платёжные интеграции'],'DevOps':['Git','Docker','CI/CD'],'Дизайн':['Figma','UI/UX'],'Данные':['SQL','Python для данных'],'Бизнес':['Оценка проектов','Переговоры']};
const DEF_TPL='09:00 | Глубокая работа\n12:00 | Обед\n14:00 | Коммуникации\n18:00 | Конец дня';
const DEF_FAM=['Время с семьёй','Спорт','Отдых'];

function seed(){return{
 profile:{name:'',spec:'Разработчик',country:'ru',currency:'RUB',rate:1500,rates:{BYN:30,CNY:11.5,USD:90},ratesUpdated:'',bank:{},specs:['Фронтенд'],accessPassword:''},
 clients:[],proposals:[],projects:[],fin:[],tasks:[],sessions:[],plan:[],blocks:[],invoices:[],docLog:[],partners:[],wellbeing:[],
 prices:[{id:uid(),name:'Лендинг',price:30000,cur:'RUB',unit:'проект'}],
 kb:[{id:uid(),dir:'Фронтенд',topic:'HTML',theory:'Основы',practice:'Сверстать страницу',time:'1 неделя',res:'',status:'Не начато'}],
 mails:0,pinHash:null,dayTpl:DEF_TPL,
 balance:{limitMin:360,items:[...DEF_FAM],checks:{}},
 tax:{regime:'ru_npdu',limit:2400000,calc:{ind:'',ent:''},useDeduct:false,byPensioner:false},
 pains:[],channels:[{name:'Telegram',action:'5 контактов в день',status:'В работе',leads:0}],
 avatar:{who:'',pain:'',fear:'',obj:'',trigger:'',where:''},
 skills:[{n:'HTML/CSS',l:4},{n:'JavaScript',l:3}],
 goals:[]};}

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let db=(()=>{const s=seed(),l=load();let d=l?{...s,...l,profile:{...s.profile,...(l.profile||{}),bank:{...((l.profile&&l.profile.bank)||{})},rates:{...s.profile.rates,...((l.profile&&l.profile.rates)||{})}},tax:{...s.tax,...(l.tax||{}),calc:{...((l.tax&&l.tax.calc)||{})}}}:s;
 ['pains','channels','tasks','sessions','plan','blocks','invoices','docLog','partners','wellbeing','prices','kb'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
 d.avatar={who:'',pain:'',fear:'',obj:'',trigger:'',where:'',...(d.avatar||{})};
 d.balance={limitMin:360,items:[...DEF_FAM],checks:{},...(d.balance||{})};
 if(!Array.isArray(d.balance.items)||!d.balance.items.length)d.balance.items=[...DEF_FAM];
 d.balance.checks=d.balance.checks||{};
 if(typeof d.mails!=='number')d.mails=0;
 d.pinHash=d.pinHash||null;
 if(!d.dayTpl)d.dayTpl=DEF_TPL;
 if(!Array.isArray(d.profile.specs)||!d.profile.specs.length)d.profile.specs=['Фронтенд'];
 if(typeof d.profile.accessPassword!=='string')d.profile.accessPassword='';
 if(typeof d.tax.useDeduct!=='boolean')d.tax.useDeduct=false;
 if(typeof d.tax.byPensioner!=='boolean')d.tax.byPensioner=false;
 d.kb.forEach(k=>{if(!k.time)k.time='';if(!k.res)k.res=''});
 return d})();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}

/* ===== АВТОКУРСЫ ===== */
async function fetchRates(){try{const r=await fetch('https://open.er-api.com/v6/latest/RUB');if(!r.ok)return false;const j=await r.json();if(j.rates){const byn=j.rates.BYN,cny=j.rates.CNY,usd=j.rates.USD;if(byn)db.profile.rates.BYN=Math.round(1/byn*100)/100;if(cny)db.profile.rates.CNY=Math.round(1/cny*100)/100;if(usd)db.profile.rates.USD=Math.round(1/usd*100)/100;db.profile.ratesUpdated=new Date().toLocaleString('ru-RU');save();return true}}catch(e){}return false}
async function updateRates(){toast('Обновляю курсы…');const ok=await fetchRates();toast(ok?'Курсы обновлены':'Нет интернета');if(tab==='set'||tab==='fin')render()}

/* ===== АВТОГЕНЕРАЦИЯ БОЛЕЙ ===== */
function generatePainsSilent(){let added=0;(db.profile.specs||[]).forEach(sp=>{(PAIN_DB[sp]||[]).forEach(p=>{if(!db.pains.some(x=>x.seg===p.seg&&x.pain===p.pain)){db.pains.unshift({id:uid(),seg:p.seg,pain:p.pain,demand:p.demand,src:'Автопоиск',sol:p.sol,status:'Гипотеза'});added++}})});return added}
function generatePains(){const specs=db.profile.specs||[];if(!specs.length){toast('Выберите специализации');go('set');return}const added=generatePainsSilent();save();render();toast(added?`Добавлено ${added} гипотез`:'Все уже в базе')}
function autoGenerateIfNeeded(){if(db.pains.length<=2&&(db.profile.specs||[]).length){const n=generatePainsSilent();if(n>0)save()}}

/* ===== УМНЫЕ ПОДСКАЗКИ ===== */
function smartInsights(){const tips=[];const lim=db.balance.limitMin,worked=workedOn(today());if(worked>lim)tips.push('🛑 Переработка!');const ds=db.projects.filter(p=>p.deadline&&p.deadline<=shiftDate(today(),2)&&!['Оплачен','Пауза'].includes(p.stage));if(ds.length)tips.push(`🔥 Дедлайн: ${ds.map(p=>p.name).join(', ')}`);const hp=db.pains.filter(p=>p.status==='Гипотеза'&&p.demand>=4).slice(0,2);hp.forEach(p=>{if(!db.proposals.some(o=>o.task===p.pain))tips.push(` Возможность: ${p.seg}`)});if(!tips.length)tips.push(TIPS_POOL[Math.floor(Math.random()*TIPS_POOL.length)]);return tips}

/* ===== PIN ===== */
let locked=!!db.pinHash,accessGranted=false;
async function hashPin(pin){const s='solodev:'+pin;if(window.crypto&&crypto.subtle){try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}}let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}return 'f'+h.toString(16);}
function checkAccess(){if(!db.profile.accessPassword||accessGranted)return true;openModal(`<div style="text-align:center;padding:20px 0"><div style="font-size:44px">🔐</div><h3>Доступ к SoloDev</h3><p class="mut">Введите пароль</p><input type="password" id="guestpass" style="text-align:center;font-size:20px" onkeydown="if(event.key==='Enter')submitGuestPass()"><button class="btn" style="width:100%;margin-top:10px" onclick="submitGuestPass()">Войти</button></div>`);return false}
function submitGuestPass(){const p=document.getElementById('guestpass').value;if(p===db.profile.accessPassword){accessGranted=true;closeModal();render();toast('Добро пожаловать!')}else toast('Неверный пароль')}
function rLock(){return `<div style="max-width:340px;margin:60px auto;text-align:center"><div style="font-size:44px">🔒</div><h3>SoloDev</h3><p class="mut">Введите PIN</p><input type="password" id="pinin" inputmode="numeric" maxlength="8" style="text-align:center;font-size:26px" onkeydown="if(event.key==='Enter')tryUnlock()"><button class="btn" style="width:100%" onclick="tryUnlock()">Войти</button></div>`}
async function tryUnlock(){const el=document.getElementById('pinin');const v=el.value;if(!v)return;const h=await hashPin(v);if(h===db.pinHash){locked=false;render();toast('С возвращением!')}else{toast('Неверный PIN');el.value=''}}
function lockNow(){locked=true;render()}
async function setPin(){const a=document.getElementById('pin1').value,b=document.getElementById('pin2').value;if(!/^\d{4,8}$/.test(a))return toast('PIN: 4–8 цифр');if(a!==b)return toast('Не совпадают');db.pinHash=await hashPin(a);save();render();toast('PIN установлен')}
function removePinFlow(){openModal(`<div style="text-align:center;padding:20px 0"><h3>Удаление PIN</h3><input type="password" id="pindel" inputmode="numeric" style="text-align:center;font-size:20px"><button class="btn danger" style="width:100%;margin-top:10px" onclick="confirmRemovePin()">Удалить</button></div>`)}
async function confirmRemovePin(){if(await hashPin(document.getElementById('pindel').value)===db.pinHash){db.pinHash=null;save();closeModal();render();toast('PIN удалён')}else toast('Неверный PIN')}
function changePinFlow(){openModal(`<div style="padding:10px 0"><h3>Смена PIN</h3><label>Текущий</label><input type="password" id="pinold" inputmode="numeric"><label>Новый</label><input type="password" id="pinnew1" inputmode="numeric"><label>Повторите</label><input type="password" id="pinnew2" inputmode="numeric"><button class="btn" style="width:100%;margin-top:10px" onclick="confirmChangePin()">Сменить</button></div>`)}
async function confirmChangePin(){const c=document.getElementById('pinold').value,a=document.getElementById('pinnew1').value,b=document.getElementById('pinnew2').value;if(await hashPin(c)!==db.pinHash)return toast('Неверный PIN');if(!/^\d{4,8}$/.test(a))return toast('4–8 цифр');if(a!==b)return toast('Не совпадают');db.pinHash=await hashPin(a);save();closeModal();toast('PIN изменён')}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&db.pinHash&&!locked){locked=true;render()}});

/* ===== УТИЛИТЫ ===== */
function toRub(a,c){return c==='RUB'?a:a*(db.profile.rates[c]||1)}
function fromRub(r,c){return c==='RUB'?r:r/(db.profile.rates[c]||1)}
function fmt(n,c){return (Math.round((n||0)*100)/100).toLocaleString('ru-RU')+' '+(CURS[c]||c)}
function money(rub){return fmt(fromRub(rub,db.profile.currency),db.profile.currency)}
function finMonth(){const m=today().slice(0,7);let i=0,e=0;db.fin.forEach(f=>{if(f.date.startsWith(m)){const r=toRub(f.amt,f.cur);f.type==='in'?i+=r:e+=r}});return{inc:i,exp:e}}
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return loc(x)}
function shiftDate(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return loc(x)}
function workedOn(d){return db.sessions.filter(s=>s.date===d).reduce((a,s)=>a+s.min,0)}
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const hm=m=>m>=60?`${Math.floor(m/60)} ч ${m%60} м`:`${m} м`;
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1900)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Скопировано')}
function openModal(h){document.getElementById('mcard').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
const empty=t=>`<div class="card mut">${t}</div>`;

/* ===== НАВИГАЦИЯ ===== */

function delBlock(id){db.blocks=db.blocks.filter(b=>b.id!==id);save();render()}
function toggleFam(i){const arr=db.balance.checks[planDate]||(db.balance.checks[planDate]=db.balance.items.map(()=>false));arr[i]=!arr[i];save();render()}
function rWeek(){const mon=monday(planDate+'T00:00:00');let h='';
 for(let i=0;i<7;i++){const d=shiftDate(mon,i),wd=workedOn(d),lim=db.balance.limitMin;

function rMonth(){const [y,m]=selMonth.split('-').map(Number);

 return h;
}
function shiftMonth(n){let [y,m]=selMonth.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}selMonth=`${y}-${String(m).padStart(2,'0')}`;render()}

/* ===== ВРЕМЯ ===== */
let timer={run:false,sec:25*60,mode:'focus',iv:null};
function rTime(){
 const wk=monday(new Date());let weekMin=0,todayMin=0;
 db.sessions.forEach(s=>{if(s.date===today())todayMin+=s.min;if(monday(s.date)===wk)weekMin+=s.min});
 const lim=db.balance.limitMin,over=todayMin>lim;
 let h=`<h2>Время</h2>
 <div class="card" style="text-align:center"><b id="tview">${mmss(timer.sec)}</b>
 <div class="mut" id="tmode">${timer.mode==='focus'?' Фокус':'☕ Перерыв'}</div>
 <div class="row" style="justify-content:center;margin-top:8px">
 <button class="btn" id="tbtn" onclick="tToggle()">${timer.run?'⏸':'▶'}</button>
 <button class="btn sec" onclick="tReset()">Сброс</button></div></div>
 <div class="grid">
  <div class="card stat"><span>Сегодня</span><b class="${over?'minus':''}">${hm(todayMin)} / ${hm(lim)}</b></div>
  <div class="card stat"><span>Неделя</span><b>${hm(weekMin)}</b></div>
 </div>`;
 return h;
}
function tRender(){const el=document.getElementById('tview');if(!el)return;el.textContent=mmss(timer.sec);const m=document.getElementById('tmode');if(m)m.textContent=timer.mode==='focus'?'🎯 Фокус':'☕ Перерыв';const b=document.getElementById('tbtn');if(b)b.textContent=timer.run?'⏸':'▶'}
function tToggle(){if(timer.run){clearInterval(timer.iv);timer.run=false}else{timer.run=true;timer.iv=setInterval(()=>{timer.sec--;if(timer.sec<=0){clearInterval(timer.iv);timer.run=false;toast(timer.mode==='focus'?'Фокус завершён':'Перерыв');timer.mode=timer.mode==='focus'?'break':'focus';timer.sec=timer.mode==='focus'?25*60:5*60}tRender()},1000)}tRender()}
function tReset(){clearInterval(timer.iv);timer.run=false;timer.sec=timer.mode==='focus'?25*60:5*60;tRender()}
function logSession(min,task=''){if(!min)return;db.sessions.unshift({id:uid(),date:today(),min,task});save();toast('Записано');if(tab==='time'||tab==='plan')render()}

function currencyConverter(){return `<div class="card"><b> Конвертер</b><div class="row2"><div><label>Сумма</label><input type="number" id="cc_amt" value="1000" oninput="convertCurrency()"></div><div><label>Из</label><select id="cc_from" onchange="convertCurrency()">${['RUB','BYN','CNY','USD'].map(c=>`<option ${c==='RUB'?'selected':''}>${c}</option>`).join('')}</select></div><div><label>В</label><select id="cc_to" onchange="convertCurrency()">${['RUB','BYN','CNY','USD'].map(c=>`<option ${c==='USD'?'selected':''}>${c}</option>`).join('')}</select></div></div><div id="cc_result"></div></div>`}
function convertCurrency(){const amt=+document.getElementById('cc_amt').value||0,from=document.getElementById('cc_from').value,to=document.getElementById('cc_to').value;const result=fromRub(toRub(amt,from),to);const el=document.getElementById('cc_result');if(el)el.innerHTML=`<div style="margin-top:8px;padding:10px;background:var(--card2);border-radius:8px"><b style="font-size:18px" class="plus">${fmt(result,to)}</b></div>`}

/* ===== НАЛОГИ ===== */
function calcChinaTax(inc){const t=Math.max(0,inc-5000);if(t<=0)return 0;const b=[{l:3000,r:.03,d:0},{l:12000,r:.10,d:210},{l:25000,r:.20,d:1410},{l:35000,r:.25,d:2660},{l:55000,r:.30,d:4410},{l:80000,r:.35,d:7160},{l:1/0,r:.45,d:15160}];for(const x of b)if(t<=x.l)return Math.max(0,Math.round(t*x.r-x.d));return 0}
function rTax(){
 const t=db.tax;
 const opts=[['ru_npdu','🇺 РФ (НПД)'],['by_npd','🇧🇾 РБ (НПД)'],['cn','🇨🇳 Китай (IIT)'],['compare',' Сравнение']];
 let h=`<h2>Налоги</h2><div class="card"><label>Режим</label><select onchange="db.tax.regime=this.value;save();render()">${opts.map(o=>`<option value="${o[0]}" ${t.regime===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
 if(t.regime==='ru_npdu'){h+=`<div class="card"><b>НПД РФ</b><label>От физлиц (4%)</label><input type="number" id="ti" value="${t.calc.ind}" oninput="db.tax.calc.ind=this.value;save();taxCalcNow()"><label>От юрлиц (6%)</label><input type="number" id="te" value="${t.calc.ent}" oninput="db.tax.calc.ent=this.value;save();taxCalcNow()"><div id="taxout"></div></div>`}
 else if(t.regime==='by_npd'){h+=`<div class="card"><b>НПД РБ</b><label>Доход (BYN)</label><input type="number" id="ti" value="${t.calc.ind}" oninput="db.tax.calc.ind=this.value;save();taxCalcNow()"><div id="taxout"></div></div>`}
 else if(t.regime==='cn'){h+=`<div class="card"><b>Китай IIT</b><p class="mut">Минимум 5000 ¥/мес не облагается</p><label>Доход (¥)</label><input type="number" id="ti" value="${t.calc.ind}" oninput="db.tax.calc.ind=this.value;save();taxCalcNow()"><div id="taxout"></div></div>`}
 else{h+=`<div class="card"><b>Сравнение</b><label>Доход (₽)</label><input type="number" id="ti" value="${t.calc.ind||100000}" oninput="db.tax.calc.ind=this.value;save();taxCalcNow()"><div id="taxout"></div></div>`}
 return h;
}
function taxCalcNow(){const ti=document.getElementById('ti'),te=document.getElementById('te');if(!ti)return;const r=db.tax.regime;let out='';
 if(r==='ru_npdu'){const i=+ti.value||0,e=+(te&&te.value)||0;out=`<div class="card" style="background:var(--card2)"><b>Налог: ${fmt(i*0.04+e*0.06,'RUB')}</b></div>`}
 else if(r==='by_npd'){const i=+ti.value||0;out=`<div class="card" style="background:var(--card2)"><b>Налог: ${fmt(i*0.1,'BYN')}</b></div>`}
 else if(r==='cn'){const i=+ti.value||0;const tax=calcChinaTax(i);out=`<div class="card" style="background:var(--card2)"><b>Налог: ${fmt(tax,'CNY')}</b></div>`}
 else{const amt=+ti.value||0;const cnTax=calcChinaTax(fromRub(amt,'CNY'));out=`<div class="card" style="background:var(--card2)"><b>🇷🇺 6%: ${fmt(amt*0.06,'RUB')}</b><br><b>🇾 10%: ${fmt(amt*0.10,'RUB')}</b><br><b>🇨🇳 IIT: ${fmt(cnTax,'CNY')}</b></div>`}
 document.getElementById('taxout').innerHTML=out}
function payTaxToFin(){const ti=document.getElementById('ti'),te=document.getElementById('te');let t=0,cur='RUB';
 if(db.tax.regime==='ru_npdu'){t=Math.round((+ti.value||0)*0.04+(+((te&&te.value)||0))*0.06)}
 else if(db.tax.regime==='by_npd'){t=Math.round((+ti.value||0)*0.1);cur='BYN'}
 else if(db.tax.regime==='cn'){t=calcChinaTax(+ti.value||0);cur='CNY'}
 else return;
 if(t<=0)return toast('Введите сумму');
 db.fin.unshift({id:uid(),date:today(),type:'out',amt:t,cur,cat:'Налоги'});save();toast('Записан');render()}
