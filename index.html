<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloDev v3.5</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--ok:#3ecf8e;--bad:#ff6b6b;--line:#242b36}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;z-index:10}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;padding:8px;overflow-x:auto;z-index:20}
.nav-btn{flex:1;min-width:60px;background:var(--card2);border:none;border-radius:10px;padding:8px 4px;color:var(--mut);font-size:11px;cursor:pointer}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-btn small{display:block;margin-top:2px;font-size:10px}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}.stat b{font-size:20px}
.mut{color:var(--mut);font-size:13px}.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:10px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.spread{justify-content:space-between}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;margin:4px 0 10px}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#splash.hidden{display:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:24px;font-size:14px;z-index:50}
</style>
</head>
<body>
<div id="splash"><h1 style="font-size:48px">⚡</h1><h1>SoloDev v3.5</h1><p class="mut">Загрузка...</p></div>
<header><b> SoloDev v3.5</b><span id="date"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY='solodev_v5';
const uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
const today=function(){return new Date().toISOString().slice(0,10)};
const esc=function(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

function seed(){return{profile:{name:'Дмитрий',spec:'Разработчик'},clients:[{id:uid(),name:'Алексей',company:'TechStart',budget:45000,status:'В работе'}],projects:[{id:uid(),name:'Интернет-магазин',client:'Алексей',budget:45000,stage:1}],finances:[{id:uid(),date:today(),type:'in',amt:30000,cat:'Проект'}]}}
var db;
try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){db=seed()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}

var TABS=[{id:'home',icon:'🏠',label:'Главная'},{id:'clients',icon:'',label:'Клиенты'},{id:'projects',icon:'📁',label:'Проекты'},{id:'finances',icon:'💰',label:'Финансы'},{id:'settings',icon:'️',label:'Настройки'}];
var tab='home';

function renderNav(){var h='';TABS.forEach(function(t){h+='<button class="nav-btn '+(t.id===tab?'active':'')+'" onclick="go(\\''+t.id+'\\')">'+t.icon+'<br><small>'+t.label+'</small></button>'});document.getElementById('nav').innerHTML=h}
function go(id){tab=id;renderNav();render()}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2000)}

function rHome(){var inc=0;db.finances.forEach(function(f){if(f.type==='in')inc+=f.amt});return '<div class="note" style="background:var(--acc);color:#fff;padding:20px;margin-bottom:20px"><div style="font-size:24px">Привет, '+esc(db.profile.name)+'! 👋</div></div><div class="grid"><div class="card stat"><span>Доход</span><b class="plus">'+inc.toLocaleString()+' ₽</b></div><div class="card stat"><span>Клиентов</span><b>'+db.clients.length+'</b></div><div class="card stat"><span>Проектов</span><b>'+db.projects.length+'</b></div><div class="card stat"><span>Финансов</span><b>'+db.finances.length+'</b></div></div>'}

function rClients(){var h='<div class="row spread"><h2>👥 Клиенты</h2><button class="btn" onclick="addClient()">+ Клиент</button></div>';db.clients.forEach(function(c){h+='<div class="card"><div class="row spread"><b>'+esc(c.name)+'</b><span class="chip on">'+c.status+'</span></div><div class="mut">'+esc(c.company)+' · '+c.budget+' ₽</div><button class="btn danger" onclick="delClient(\\''+c.id+'\\')">🗑 Удалить</button></div>'});return h}
function addClient(){var n=prompt('Имя:');if(!n)return;db.clients.push({id:uid(),name:n,company:prompt('Компания:')||'',budget:+prompt('Бюджет:')||0,status:'Новый'});save();render()}
function delClient(id){db.clients=db.clients.filter(function(c){return c.id!==id});save();render()}

function rProjects(){var h='<div class="row spread"><h2>📁 Проекты</h2><button class="btn" onclick="addProject()">+ Проект</button></div>';db.projects.forEach(function(p){h+='<div class="card"><div class="row spread"><b>'+esc(p.name)+'</b><span class="chip on">'+['Идея','В работе','Тестирование','Завершён'][p.stage]+'</span></div><div class="mut">'+esc(p.client||'—')+' · '+p.budget+' ₽</div><button class="btn danger" onclick="delProject(\\''+p.id+'\\')">🗑 Удалить</button></div>'});return h}
function addProject(){var n=prompt('Название:');if(!n)return;db.projects.push({id:uid(),name:n,client:prompt('Клиент:')||'',budget:+prompt('Бюджет:')||0,stage:1});save();render()}
function delProject(id){db.projects=db.projects.filter(function(p){return p.id!==id});save();render()}

function rFinances(){var h='<div class="row spread"><h2>💰 Финансы</h2><button class="btn" onclick="addFin()">+ Операция</button></div>';db.finances.forEach(function(f){h+='<div class="card"><b class="'+(f.type==='in'?'plus':'minus')+'">'+(f.type==='in'?'+':'-')+' '+f.amt+' ₽</b><div class="mut">'+f.date+' · '+f.cat+'</div></div>'});return h}
function addFin(){var a=+prompt('Сумма:');if(!a)return;db.finances.unshift({id:uid(),date:today(),type:prompt('Тип (in/out):','in'),amt:a,cat:'Проект'});save();render()}

function rSettings(){return '<div class="row spread"><h2>⚙️ Настройки</h2></div><div class="card"><b>👤 Профиль</b><label>Имя</label><input value="'+esc(db.profile.name)+'" onchange="db.profile.name=this.value;save()"><label>Специализация</label><input value="'+esc(db.profile.spec)+'" onchange="db.profile.spec=this.value;save()"></div><div class="card"><button class="btn danger" onclick="hardReset()" style="width:100%">🔄 Сбросить всё</button></div>'}
function hardReset(){if(confirm('Удалить все данные?')){localStorage.removeItem(KEY);location.reload()}}

function render(){
  document.getElementById('date').textContent=new Date().toLocaleDateString('ru-RU');
  var app=document.getElementById('app');
  if(tab==='home')app.innerHTML=rHome();
  else if(tab==='clients')app.innerHTML=rClients();
  else if(tab==='projects')app.innerHTML=rProjects();
  else if(tab==='finances')app.innerHTML=rFinances();
  else if(tab==='settings')app.innerHTML=rSettings();
}

window.onload=function(){setTimeout(function(){document.getElementById('splash').classList.add('hidden');renderNav();render()},500)};
</script>
</body>
</html>
