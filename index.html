<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloDev v2.5</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb454;--line:#242b36}
body.light-theme{--bg:#f4f6f8;--card:#fff;--card2:#e9ecef;--txt:#212529;--mut:#6c757d;--line:#dee2e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;z-index:10}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;padding:8px;overflow-x:auto;z-index:20}
nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:60px;background:var(--card2);border:none;border-radius:10px;padding:8px 4px;color:var(--mut);font-size:11px;cursor:pointer}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-btn small{display:block;margin-top:2px;font-size:10px}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}.stat b{font-size:20px}
.mut{color:var(--mut);font-size:13px}.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:10px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.spread{justify-content:space-between}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.ai{background:linear-gradient(90deg,var(--acc),#9d6cff)}
.btn.warn{background:var(--warn);color:#000}
.btn.ok{background:var(--ok)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;margin:4px 0 10px}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff}.chip.ok{background:var(--ok);color:#fff}.chip.warn{background:var(--warn);color:#000}.chip.ru{background:#d6001c;color:#fff}.chip.en{background:#0039a6;color:#fff}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#splash.hidden{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:24px;font-size:14px;z-index:50}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
#modal.on{display:flex}.m-card{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@keyframes load{0%{width:0%}100%{width:100%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes badge-pop{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.badge{display:inline-flex;flex-direction:column;align-items:center;padding:10px;background:var(--card2);border-radius:12px;margin:4px;min-width:80px}
.badge.earned{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000}
.badge .icon{font-size:28px}.badge .name{font-size:11px;margin-top:4px;text-align:center}
.mood-btn{font-size:32px;background:none;border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}
.mood-btn.selected{border-color:var(--acc);background:var(--card2)}
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:10px}
.chart-col{flex:1;background:var(--card2);border-radius:4px 4px 0 0;position:relative;min-height:4px}
.chart-col i{position:absolute;bottom:0;left:0;right:0;background:var(--acc);border-radius:4px 4px 0 0}
.chart-label{font-size:10px;color:var(--mut);text-align:center;margin-top:4px}
.article-card{border-left:3px solid var(--acc);padding-left:12px;margin:10px 0}
.tag{display:inline-block;background:var(--card2);padding:4px 10px;border-radius:12px;font-size:11px;margin:2px}
.stage{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px}
.stage-0{background:#3a4a7a;color:#fff}.stage-1{background:var(--acc);color:#fff}
.stage-2{background:var(--warn);color:#000}.stage-3{background:var(--ok);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-day{background:var(--card2);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;min-height:50px;position:relative}
.cal-day.today{border:2px solid var(--acc)}
.cal-day.has-deadline{background:#2a1040}
.cal-day .deadline-dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:6px;height:6px;background:var(--bad);border-radius:50%}
.cal-header{text-align:center;color:var(--mut);font-size:11px;padding:4px}
.habit-check{width:32px;height:32px;border-radius:8px;background:var(--card2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.habit-check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.voice-btn{width:80px;height:80px;border-radius:50%;background:var(--bad);border:none;color:#fff;font-size:32px;cursor:pointer;margin:20px auto;display:block}
.voice-btn.recording{animation:pulse 1s ease infinite}
</style>
</head>
<body>
<div id="splash">
  <h1 style="font-size:48px;margin-bottom:20px;animation:pulse 1.5s ease infinite"></h1>
  <h1>SoloDev v2.5</h1>
  <p class="mut">Загрузка приложения...</p>
  <div class="bar" style="width:200px;margin-top:20px"><i style="width:0%;animation:load 2s ease forwards"></i></div>
</div>
<header><b>⚡ SoloDev v2.5</b><span id="date"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="m-card" id="mcard"></div></div>
<script>
const KEY='solodev_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const STAGES=['Идея','В работе','Тестирование','Завершён'];
const TIMER_MODES=[{work:25,break:5,name:'25/5'},{work:50,break:10,name:'50/10'},{work:90,break:20,name:'90/20'}];
const MOODS=[{e:'😞',n:'Плохо'},{e:'😕',n:'Так себе'},{e:'😐',n:'Норм'},{e:'🙂',n:'Хорошо'},{e:'😄',n:'Отлично'}];
const ACHIEVEMENTS=[
  {id:'first_client',name:'Первый клиент',icon:'👥',desc:'Добавить первого клиента',check:d=>d.clients.length>=1},
  {id:'five_projects',name:'5 проектов',icon:'📁',desc:'Завершить 5 проектов',check:d=>d.projects.filter(p=>p.stage===3).length>=5},
  {id:'streak_7',name:'Неделя привычек',icon:'🔥',desc:'7 дней подряд отмечать привычки',check:d=>d.habits.some(h=>h.streak>=7)},
  {id:'earn_100k',name:'100K заработано',icon:'💰',desc:'Заработать 100 000 ₽',check:d=>d.finances.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0)>=100000},
  {id:'knowledge_10',name:'Учёный',icon:'🎓',desc:'Освоить 10 тем',check:d=>d.knowledge.filter(k=>k.status===3).length>=10},
  {id:'articles_20',name:'Читатель',icon:'📖',desc:'Сохранить 20 статей',check:d=>(d.savedArticles||[]).length>=20}
];
const EMAIL_TEMPLATES=[
  {id:'cold',name:'Холодное письмо',text:'Здравствуйте!\n\nМеня зовут {name}, я {spec}.\n\nПредлагаю услуги по {service}.\n\nБуду рад обсудить детали.\n\nС уважением,\n{name}\n{phone}\n{email}'},
  {id:'follow',name:'После встречи',text:'Здравствуйте, {client}!\n\nСпасибо за встречу. Как договаривались:\n\n• Задача: {task}\n• Срок: {deadline}\n• Бюджет: {budget}\n\nЖду вашего решения.\n\n{name}'},
  {id:'reminder',name:'Напоминание',text:'Здравствуйте, {client}!\n\nНапоминаю о проекте "{project}".\n\nГотовы двигаться дальше?\n\n{name}'},
  {id:'invoice',name:'Счёт на оплату',text:'Счёт №{num} от {date}\n\nИсполнитель: {name}\nЗаказчик: {client}\n\nУслуга: {service}\nСумма: {budget} {cur}\n\nРеквизиты: {bank}'},
  {id:'completed',name:'Проект завершён',text:'Здравствуйте, {client}!\n\nПроект "{project}" успешно завершён.\n\nВсе материалы отправлены.\nБуду рад сотрудничеству в будущем!\n\n{name}'}
];

function seed(){return{
  profile:{name:'Дмитрий',spec:'Fullstack разработчик',currency:'RUB',rates:{BYN:30,CNY:11.5,USD:90},specs:['Фронтенд','Бэкенд','Боты'],phone:'+79001234567',email:'dev@example.com',bank:'Тинькофф 2200...'},
  clients:[],projects:[],finances:[],pains:[],
  skills:[{n:'JavaScript',l:4},{n:'React',l:3}],
  goals:[],knowledge:[],prices:[],tasks:[],
  templates:EMAIL_TEMPLATES,outreachStats:{sent:0,replied:0,converted:0},
  timerMode:0,leads:[],diary:[],
  habits:[{id:uid(),name:'Код 2 часа',icon:'💻',streak:0,history:{}},{id:uid(),name:'Спорт',icon:'',streak:0,history:{}},{id:uid(),name:'Чтение',icon:'',streak:0,history:{}}],
  calendarView:'month',calendarDate:today(),
  savedArticles:[],searchQuery:'',
  moodHistory:[],
  partners:[],
  courses:[],
  githubUser:'',
  achievements:[],
  autoTheme:true
}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let db=(()=>{const s=seed(),l=load();return l?{...s,...l}:s})();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}

const TABS=[
  {id:'home',icon:'🏠',label:'Главная'},
  {id:'dashboard',icon:'📊',label:'Дашборд'},
  {id:'radar',icon:'🎯',label:'Радар'},
  {id:'clients',icon:'👥',label:'Клиенты'},
  {id:'projects',icon:'',label:'Проекты'},
  {id:'knowledge',icon:'📚',label:'База'},
  {id:'portfolio',icon:'💼',label:'Портфолио'},
  {id:'habits',icon:'✅',label:'Привычки'},
  {id:'time',icon:'⏱',label:'Время'},
  {id:'settings',icon:'️',label:'Настройки'}
];
let tab='home';

function renderNav(){document.getElementById('nav').innerHTML=TABS.map(t=>'<button class="nav-btn '+(t.id===tab?'active':'')+'" onclick="go(\\''+t.id+'\\')">'+t.icon+'<br><small>'+t.label+'</small></button>').join('');}
function go(id){tab=id;renderNav();render();window.scrollTo(0,0)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function openModal(h){document.getElementById('mcard').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('Скопировано!')).catch(()=>toast('Ошибка копирования'))}

function applyAutoTheme(){
  if(!db.autoTheme)return;
  const h=new Date().getHours();
  const isNight=h<7||h>=21;
  if(isNight&&localStorage.getItem('theme')!=='light'){document.body.classList.remove('light-theme');}
  else if(!isNight&&localStorage.getItem('theme')==='light'){document.body.classList.add('light-theme');}
}

// ===== ГЛАВНАЯ =====
function rHome(){
  const m=MONTHS[new Date().getMonth()];
  const inc=db.finances.filter(f=>f.type==='in'&&f.date.startsWith(today().slice(0,7))).reduce((s,f)=>s+f.amt,0);
  const activeProjects=db.projects.filter(p=>p.stage<3).length;
  const leadsCount=(db.leads?db.leads.length:0)+(db.pains?db.pains.length:0);
  const earnedBadges=(db.achievements||[]).length;
  const reminders=db.clients.filter(c=>c.remindDate&&c.remindDate<=today()).length;
  return '<div class="note" style="background:linear-gradient(135deg,var(--acc),#9d6cff);color:#fff;padding:20px;margin-bottom:20px"><div style="font-size:24px">Привет, '+esc(db.profile.name)+'! 👋</div><div style="opacity:.9">'+esc(db.profile.spec)+'</div></div><div class="grid"><div class="card stat"><span>Доход, '+m+'</span><b class="plus">'+inc.toLocaleString()+' ₽</b></div><div class="card stat"><span>Проектов</span><b>'+activeProjects+'</b></div><div class="card stat"><span>Лидов</span><b>'+leadsCount+'</b></div><div class="card stat"><span>Бейджей</span><b>🏆 '+earnedBadges+'</b></div></div>'+(reminders>0?'<div class="card" style="background:#241d0e;border-color:#5a4a1e"><b>🔔 Напоминания ('+reminders+')</b>'+db.clients.filter(c=>c.remindDate&&c.remindDate<=today()).map(c=>'<div class="row spread" style="margin-top:8px"><span>'+esc(c.name)+' — написать '+c.remindDate+'</span><button class="btn sec" onclick="setRemind(\\''+c.id+'\\',null)">✓</button></div>').join('')+'</div>':'')+'<div class="card"><b>⚡ Быстрые действия</b><div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn" onclick="go(\\'dashboard\\')">📊 Дашборд</button><button class="btn sec" onclick="go(\\'radar\\')">🎯 Клиенты</button><button class="btn sec" onclick="go(\\'knowledge\\')">📚 База</button><button class="btn sec" onclick="go(\\'portfolio\\')">💼 Портфолио</button></div></div>';
}

// ===== ДАШБОРД =====
function rDashboard(){
  const m=today().slice(0,7);
  const monthFin=db.finances.filter(f=>f.date.startsWith(m));
  const monthInc=monthFin.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0);
  const monthExp=monthFin.filter(f=>f.type==='out').reduce((s,f)=>s+f.amt,0);
  const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);
  const weekStr=weekAgo.toISOString().slice(0,10);
  const weekFin=db.finances.filter(f=>f.date>=weekStr);
  const weekInc=weekFin.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0);
  const completedProjects=db.projects.filter(p=>p.stage===3).length;
  const totalTasks=db.projects.reduce((s,p)=>s+(p.tasks?p.tasks.length:0),0);
  const doneTasks=db.projects.reduce((s,p)=>s+(p.tasks?p.tasks.filter(t=>t.done).length:0),0);
  const weekData=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);const dayInc=db.finances.filter(f=>f.date===ds&&f.type==='in').reduce((s,f)=>s+f.amt,0);weekData.push({day:d.getDate(),inc:dayInc});}
  const maxInc=Math.max(...weekData.map(d=>d.inc),1);
  const weekMoods=db.moodHistory.filter(m=>m.date>=weekStr);
  const avgMood=weekMoods.length?Math.round(weekMoods.reduce((s,m)=>s+m.value,0)/weekMoods.length):0;
  const daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  const currentDay=new Date().getDate();
  const forecast=currentDay>0?Math.round(monthInc/currentDay*daysInMonth):0;
  const earned=(db.achievements||[]).length;
  
  let h='<div class="row spread"><h2>📊 Дашборд</h2></div>';
  h+='<div class="grid"><div class="card stat"><span>Доход за неделю</span><b class="plus">'+weekInc.toLocaleString()+' ₽</b></div><div class="card stat"><span>Доход за месяц</span><b class="plus">'+monthInc.toLocaleString()+' ₽</b></div><div class="card stat"><span>Проектов завершено</span><b>'+completedProjects+'</b></div><div class="card stat"><span>Задач выполнено</span><b>'+doneTasks+'/'+totalTasks+'</b></div></div>';
  h+='<div class="card"><b> Доходы за 7 дней</b><div class="chart-bar">';
  weekData.forEach(d=>{const hPct=(d.inc/maxInc)*100;h+='<div style="flex:1;text-align:center"><div class="chart-col" style="height:100px"><i style="height:'+hPct+'%"></i></div><div class="chart-label">'+d.day+'</div></div>';});
  h+='</div></div>';
  h+='<div class="card"><b>😊 Настроение (среднее)</b><div style="font-size:48px;text-align:center;margin:10px 0">'+(avgMood>0?MOODS[avgMood-1].e:'')+'</div><div class="mut" style="text-align:center">'+(avgMood>0?MOODS[avgMood-1].n:'Нет данных')+' <button class="btn sec" style="margin-left:10px;padding:6px 10px" onclick="go(\\'mood\\')">Отметить</button></div></div>';
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>💰 Прогноз дохода на месяц</b><div style="font-size:32px;text-align:center;margin:10px 0;color:var(--ok)"><b>'+forecast.toLocaleString()+' ₽</b></div><div class="mut" style="text-align:center">На основе текущей динамики</div></div>';
  h+='<div class="card"><b>🏆 Достижения ('+earned+'/'+ACHIEVEMENTS.length+')</b><div class="row" style="flex-wrap:wrap">';
  ACHIEVEMENTS.forEach(a=>{const isEarned=(db.achievements||[]).includes(a.id);h+='<div class="badge '+(isEarned?'earned':'')+'" style="'+(isEarned?'':'opacity:.4')+'"><span class="icon">'+a.icon+'</span><span class="name">'+a.name+'</span></div>';});
  h+='</div><button class="btn ai" onclick="checkAchievements()" style="width:100%;margin-top:10px">🔄 Проверить достижения</button></div>';
  return h;
}

function checkAchievements(){
  let newBadges=0;
  if(!db.achievements)db.achievements=[];
  ACHIEVEMENTS.forEach(a=>{if(!db.achievements.includes(a.id)&&a.check(db)){db.achievements.push(a.id);newBadges++;setTimeout(()=>toast('🏆 '+a.name),500);}});
  save();render();
  if(newBadges===0)toast('Новых достижений нет');
}

// ===== РАДАР =====
function rRadar(){
  let h='<div class="row spread"><h2>🎯 Радар</h2></div>';
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>🇷🇺 Российские биржи</b><p class="mut">Поиск: '+(db.profile.specs||[]).join(', ')+'</p>';
  const q=encodeURIComponent((db.profile.specs||['разработчик']).join(' '));
  h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><a href="https://freelance.habr.com/tasks?q='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Habr</a><a href="https://www.fl.ru/projects/?keyword='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">FL.ru</a><a href="https://kwork.ru/projects?keyword='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Kwork</a></div></div>';
  if(db.leads&&db.leads.length){h+='<div class="card"><b>🎯 Лиды: '+db.leads.length+'</b><button class="btn danger" style="margin-top:8px" onclick="clearLeads()">🗑 Очистить</button>';db.leads.slice(0,10).forEach((l,idx)=>{h+='<div class="card article-card" style="margin-top:10px"><div class="row spread"><b>'+(idx+1)+'. '+esc(l.title)+'</b><span class="chip warn">'+(l.source==='hh'?'🇺 HH':l.source==='hn'?'🔶 HN':'🔴 Reddit')+'</span></div>';if(l.company) h+='<div class="mut">🏢 '+esc(l.company)+'</div>';if(l.salary) h+='<div class="plus">💰 '+esc(l.salary)+'</div>';h+='<div class="row" style="margin-top:10px;gap:8px"><button class="btn sec" onclick="leadToClient('+idx+')">👥 В клиенты</button><button class="btn sec" onclick="leadOutreach('+idx+')">️</button><button class="btn danger" onclick="delLead('+idx+')">🗑</button></div></div>';});h+='</div>';}

// ===== ПРОЕКТЫ С ЭТАПАМИ, ЗАДАЧАМИ, ROI, ОТЧЁТАМИ =====
function rProjects(){
  let h='<div class="row spread"><h2>📁 Проекты</h2><button class="btn" onclick="addProject()">+ Проект</button></div>';
  if(!db.projects.length) h+='<div class="card mut">Нет проектов</div>';
  db.projects.forEach(p=>{
    const doneTasks=p.tasks?p.tasks.filter(t=>t.done).length:0;
    const totalTasks=p.tasks?p.tasks.length:0;
    const progress=totalTasks?Math.round(doneTasks/totalTasks*100):0;
    const roi=p.estimatedHours&&p.estimatedHours>0?Math.round(p.budget/p.estimatedHours):0;
    h+='<div class="card"><div class="row spread"><b>'+esc(p.name)+'</b><span class="stage stage-'+p.stage+'">'+STAGES[p.stage]+'</span></div><div class="mut">'+esc(p.client||'—')+' · '+p.budget.toLocaleString()+' '+p.cur+'</div>';
    if(p.deadline) h+='<div class="mut"> Дедлайн: '+p.deadline+'</div>';
    if(roi) h+='<div class="plus">🧮 ROI: '+roi+' ₽/час</div>';
    h+='<div class="bar" style="margin:10px 0"><i style="width:'+progress+'%"></i></div><div class="mut">Задачи: '+doneTasks+'/'+totalTasks+' ('+progress+'%)</div>';
    h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
    if(p.stage<3) h+='<button class="btn sec" onclick="nextStage(\\''+p.id+'\\')">Этап →</button>';
    h+='<button class="btn sec" onclick="showProjectTasks(\\''+p.id+'\\')">📋 Задачи</button>';
    h+='<button class="btn sec" onclick="projectROI(\\''+p.id+'\\')">🧮 ROI</button>';
    h+='<button class="btn sec" onclick="projectReport(\\''+p.id+'\\')">📊 Отчёт</button>';
    h+='<button class="btn danger" onclick="delProject(\\''+p.id+'\\')">🗑</button>';
    h+='</div></div>';
  });
  if(db.projects.length>1){h+='<div class="card"><b>📈 Сравнение проектов</b>';db.projects.forEach(p=>{const roi=p.estimatedHours&&p.estimatedHours>0?Math.round(p.budget/p.estimatedHours):0;h+='<div class="row spread" style="margin:8px 0"><span>'+esc(p.name)+'</span><b class="plus">'+roi+' ₽/час</b></div>';});h+='</div>';}
  return h;
}
function addProject(){openModal('<h3>Новый проект</h3><label>Название</label><input id="pj_name"><label>Клиент</label><input id="pj_client"><label>Бюджет (₽)</label><input type="number" id="pj_budget" value="0"><label>Дедлайн</label><input type="date" id="pj_deadline"><label>Оценка часов</label><input type="number" id="pj_hours" value="40"><div class="row"><button class="btn" onclick="saveProject()">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button></div>');}

function showProjectTasks(id){const p=db.projects.find(x=>x.id===id);if(!p)return;let h='<h3>Задачи: '+esc(p.name)+'</h3>';if(p.tasks&&p.tasks.length){p.tasks.forEach(t=>{h+='<div class="row" style="margin:8px 0"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleProjTask(\\''+id+'\\',\\''+t.id+'\\')"><span style="flex:1;'+(t.done?'text-decoration:line-through;color:var(--mut)':'')+'">'+esc(t.text)+'</span><button class="btn danger" onclick="delProjTask(\\''+id+'\\',\\''+t.id+'\\')">✕</button></div>';});}else{h+='<div class="mut">Нет задач</div>';}h+='<div class="row" style="margin-top:10px"><input id="newTask" placeholder="Задача"><button class="btn" onclick="addProjTask(\\''+id+'\\')">+</button></div>';openModal(h);}

function rHabits(){
  const todayStr=today();
  let h='<div class="row spread"><h2>✅ Трекер привычек</h2><button class="btn" onclick="addHabit()">+ Привычка</button></div>';

  h+='</div>';
  h+='<div class="card"><b>📊 Статистика</b>';

function addHabit(){const name=prompt('Название привычки:');if(!name)return;const icon=prompt('Иконка (эмодзи):','✅');db.habits.push({id:uid(),name:name,icon:icon,streak:0,history:{}});save();render();}
function toggleHabit(id){const h=db.habits.find(x=>x.id===id);if(!h)return;if(!h.history)h.history={};const todayStr=today();if(h.history[todayStr]){delete h.history[todayStr];h.streak=Math.max(0,h.streak-1);}else{h.history[todayStr]=true;h.streak++;}save();render();checkAchievements();}

function rTime(){
  const mode=TIMER_MODES[db.timerMode||0];
  return '<div class="row spread"><h2> Время</h2></div><div class="card" style="text-align:center"><div style="font-size:48px;font-weight:bold;color:var(--acc)" id="timer">'+formatTime(mode.work*60)+'</div><div class="mut" id="timerMode" style="margin:10px 0">🎯 Режим: Фокус</div><div class="mut" style="margin-bottom:10px">'+mode.name+'</div><div class="row" style="justify-content:center;margin-top:15px;gap:8px"><button class="btn" onclick="startT()">▶ Старт</button><button class="btn sec" onclick="resetT()">Сброс</button></div></div><div class="card"><b>⚙️ Режимы таймера</b>'+TIMER_MODES.map((m,i)=>'<div class="row spread" style="margin:8px 0"><span>'+m.name+' ('+m.work+'мин / '+m.break+'мин)</span><button class="btn '+(db.timerMode===i?'ai':'sec')+'" onclick="setTimerMode('+i+')">Выбрать</button></div>').join('')+'</div>';
}
function formatTime(sec){const m=Math.floor(sec/60).toString().padStart(2,'0'),s=(sec%60).toString().padStart(2,'0');return m+':'+s;}
let tInt,tSec,tMode='focus';
function getTimerSec(){const mode=TIMER_MODES[db.timerMode||0];return tMode==='focus'?mode.work*60:mode.break*60;}
function startT(){if(tInt)return;tSec=getTimerSec();tInt=setInterval(()=>{tSec--;const el=document.getElementById('timer'),modeEl=document.getElementById('timerMode');if(el)el.textContent=formatTime(tSec);if(modeEl)modeEl.textContent=tMode==='focus'?'🎯 Фокус':'☕ Перерыв';if(tSec<=0){clearInterval(tInt);tInt=null;if(tMode==='focus'){toast(' Перерыв!');tMode='break';}else{toast('🎯 Работаем!');tMode='focus';}startT();}},1000);}
function resetT(){clearInterval(tInt);tInt=null;tMode='focus';const el=document.getElementById('timer'),modeEl=document.getElementById('timerMode');if(el)el.textContent=formatTime(TIMER_MODES[db.timerMode||0].work*60);if(modeEl)modeEl.textContent='🎯 Фокус';}
function setTimerMode(i){db.timerMode=i;save();render();toast('Режим: '+TIMER_MODES[i].name);}

function useDocTpl(type){const t={dogovor:'ДОГОВОР ВОЗМЕЗДНОГО ОКАЗАНИЯ УСЛУГ\n\nг. _________ «___» _________ 20__ г.\n\nЗаказчик: _________\nИсполнитель: '+db.profile.name+'\n\n1. ПРЕДМЕТ\nИсполнитель оказывает услуги по: _________\n\n2. СТОИМОСТЬ\n_________ рублей\n\n3. СРОКИ\nНачало: «___» _________ 20__ г.\nОкончание: «___» _________ 20__ г.\n\nПодписи:\nЗаказчик: _________\nИсполнитель: _________',act:'АКТ ВЫПОЛНЕННЫХ РАБОТ №___\n\nк договору от «___» _________ 20__ г.\n\nИсполнитель: '+db.profile.name+'\n\nВыполнено:\n- _________\n- _________\n\nСтоимость: _________ рублей\n\nЗаказчик претензий не имеет.\n\nПодписи:\nЗаказчик: _________\nИсполнитель: _________',nda:'СОГЛАШЕНИЕ О НЕРАЗГЛАШЕНИИ\n\nСтороны обязуются не разглашать конфиденциальную информацию, полученную в ходе сотрудничества.\n\nСрок действия: _________ лет\n\nПодписи:\nСторона 1: _________\nСторона 2: _________'};openModal('<h3> '+{dogovor:'Договор',act:'Акт',nda:'NDA'}[type]+'</h3><textarea id="docText" rows="15" style="width:100%;font-family:monospace;font-size:13px">'+esc(t[type])+'</textarea><div class="row" style="margin-top:10px;gap:8px"><button class="btn" onclick="copyText(document.getElementById(\\'docText\\').value)">📋 Копировать</button><button class="btn sec" onclick="printDoc()">🖨 Печать/PDF</button></div>');}
function printDoc(){const text=document.getElementById('docText').value;const w=window.open('','_blank');w.document.write('<html><head><title>Документ</title><style>body{font-family:monospace;padding:20px;white-space:pre-wrap}</style></head><body>'+esc(text)+'</body></html>');w.document.close();w.print();}
function addPriceItem(){openModal('<h3>Новая услуга</h3><label>Название *</label><input id="pr_name"><label>Цена</label><input type="number" id="pr_price" value="0"><label>Валюта</label><select id="pr_cur"><option>RUB</option><option>USD</option></select><label>Единица</label><select id="pr_unit"><option>проект</option><option>час</option><option>месяц</option></select><div class="row"><button class="btn" onclick="savePriceItem()">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button></div>');}
function savePriceItem(){const name=document.getElementById('pr_name').value.trim();if(!name){toast('Название?');return;}db.prices.push({id:uid(),name:name,price:+document.getElementById('pr_price').value||0,cur:document.getElementById('pr_cur').value,unit:document.getElementById('pr_unit').value});save();closeModal();render();toast('Услуга добавлена');}
function delPriceItem(i){if(confirm('Удалить услугу?')){db.prices.splice(i,1);save();render();}}
function exportCSV(){let csv='Тип,Имя,Сумма,Статус\n';db.clients.forEach(c=>{csv+='Клиент,'+c.name+','+c.budget+','+c.status+'\n';});db.projects.forEach(p=>{csv+='Проект,'+p.name+','+p.budget+','+STAGES[p.stage]+'\n';});db.finances.forEach(f=>{csv+='Финансы,'+f.cat+','+f.amt+','+f.type+'\n';});const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='SoloDev_'+today()+'.csv';link.click();toast('✅ Экспорт завершён!');}
function hardReset(){if(confirm("⚠️ Удалить кэш? Данные сохранятся.")){if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if("caches"in window)caches.keys().then(n=>n.forEach(k=>caches.delete(k)));window.location.href=window.location.pathname+"?v="+Date.now();}}

function render(){
  document.getElementById('date').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const app=document.getElementById('app');
  switch(tab){
    case 'home':app.innerHTML=rHome();break;case 'dashboard':app.innerHTML=rDashboard();break;case 'radar':app.innerHTML=rRadar();break;
    case 'clients':app.innerHTML=rClients();break;case 'projects':app.innerHTML=rProjects();break;case 'knowledge':app.innerHTML=rKnowledge();break;
    case 'portfolio':app.innerHTML=rPortfolio();break;case 'habits':app.innerHTML=rHabits();break;case 'time':app.innerHTML=rTime();break;
    case 'settings':app.innerHTML=rSettings();break;
  }
}

window.onload=()=>{
  try{
    if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');
    applyAutoTheme();
    setTimeout(()=>{document.getElementById('splash').classList.add('hidden');setTimeout(()=>{document.getElementById('splash').style.display='none';},500);renderNav();render();checkAchievements();},1500);
  }catch(e){console.error('Ошибка:',e);document.getElementById('splash').classList.add('hidden');}
};
