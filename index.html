<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--acc2:#9d6cff;--ok:#3ecf8e;--warn:#ffb454;--bad:#ff6b6b;--line:#242b36}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(14,17,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}
header span{color:var(--mut);font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:var(--card);color:var(--mut);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff;border-color:transparent}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 10px}
h3{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}
.stat b{font-size:19px}
.mut{color:var(--mut);font-size:13px}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:8px;margin:6px 0;font-size:13px;color:var(--mut)}
.warn{background:#241d0e;border-color:#5a4a1e}
.ai{background:#1a2035;border-color:#3a4a7a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.row select,.row input,.row button{margin:0}
.row select{flex:1;max-width:180px;width:auto}
.row input{flex:1}
.row2{display:flex;gap:10px}.row2>*{flex:1}
label{font-size:12px;color:var(--mut);display:block;margin-top:4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:15px;margin:4px 0 10px;font-family:inherit}
input[type=checkbox],input[type=date],input[type=time],input[type=number]{width:auto}
textarea{resize:vertical}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:600}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);padding:10px 12px}
.btn.ai-btn{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.skill{margin:10px 0}
#tview{font-size:44px;font-weight:700;letter-spacing:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.cal-h{text-align:center;color:var(--mut);font-size:11px;padding:2px 0}
.cal-c{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:48px;padding:4px 2px;font-size:12px;text-align:center}
.cal-c.today{border-color:var(--acc);background:#1c2333}
.cal-c.over{border-color:var(--bad)}
details summary{font-weight:700;cursor:pointer}
.docprint{background:#fff;color:#000;border-radius:10px;padding:18px;white-space:pre-wrap;font-size:14px;line-height:1.55;min-height:200px;outline:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.m-card{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-size:13px;z-index:50}
.hello{color:var(--mut);margin:2px 0 12px}
@media print{body *{visibility:hidden}#printarea,#printarea *{visibility:visible}#printarea{position:fixed;left:0;top:0;width:100%;border-radius:0!important}}
</style>
</head>

async function hashPin(pin){const s='solodev:'+pin;if(window.crypto&&crypto.subtle){try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}}let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}return 'f'+h.toString(16);}

let timer={run:false,sec:25*60,mode:'focus',iv:null};
function rTime(){
 const wk=monday(new Date());let weekMin=0,todayMin=0;
 db.sessions.forEach(s=>{if(s.date===today())todayMin+=s.min;if(monday(s.date)===wk)weekMin+=s.min});
 const lim=db.balance.limitMin,over=todayMin>lim;
 let h=`<h2>Тайм-менеджмент</h2>
 <div class="card" style="text-align:center"><b id="tview">${mmss(timer.sec)}</b>

 <div class="row" style="justify-content:center;margin-top:8px">
 <button class="btn" id="tbtn" onclick="tToggle()">${timer.run?'⏸':'▶'}</button>
 <button class="btn sec" onclick="tReset()">Сброс</button>
 <button class="btn sec" onclick="tSwitch()">Переключить</button></div></div>
 <div class="grid">
  <div class="card stat"><span>Сегодня / норма</span><b class="${over?'minus':''}">${hm(todayMin)} / ${hm(lim)}</b></div>
  <div class="card stat"><span>Неделя</span><b>${hm(weekMin)}</b></div>
 </div>
 <div class="card"><b>Журнал времени</b>
 ${db.sessions.slice(0,20).map(s=>`<div class="row spread" style="margin:6px 0"><span>${s.date} · <b>${hm(s.min)}</b>${s.task?` · ${esc(s.task)}`:''}</span><button class="btn danger" onclick="delSession('${s.id}')">✕</button></div>`).join('')||'<div class="mut">Пусто.</div>'}</div>`;
 return h;
}
function tRender(){const el=document.getElementById('tview');if(!el)return;
 el.textContent=mmss(timer.sec);
 const m=document.getElementById('tmode');if(m)m.textContent=timer.mode==='focus'?'🎯 Фокус':'☕ Перерыв';
 const b=document.getElementById('tbtn');if(b)b.textContent=timer.run?'⏸':'▶'}
function tToggle(){
 if(timer.run){clearInterval(timer.iv);timer.run=false}
 else{timer.run=true;timer.iv=setInterval(()=>{timer.sec--;
  if(timer.sec<=0){clearInterval(timer.iv);timer.run=false;
   toast(timer.mode==='focus'?'Фокус завершён':'Перерыв окончен');
   timer.mode=timer.mode==='focus'?'break':'focus';timer.sec=timer.mode==='focus'?25*60:5*60}
  tRender()},1000)}
 tRender()}
function tReset(){clearInterval(timer.iv);timer.run=false;timer.sec=timer.mode==='focus'?25*60:5*60;tRender()}
function tSwitch(){timer.mode=timer.mode==='focus'?'break':'focus';timer.sec=timer.mode==='focus'?25*60:5*60;tRender()}

/* ===== НАЛОГИ: РФ + РБ + КИТАЙ + СРАВНЕНИЕ ===== */
function calcChinaTax(inc){const t=Math.max(0,inc-5000);if(t<=0)return 0;const b=[{l:3000,r:.03,d:0},{l:12000,r:.10,d:210},{l:25000,r:.20,d:1410},{l:35000,r:.25,d:2660},{l:55000,r:.30,d:4410},{l:80000,r:.35,d:7160},{l:1/0,r:.45,d:15160}];for(const x of b)if(t<=x.l)return Math.max(0,Math.round(t*x.r-x.d));return 0}
function rTax(){
 const t=db.tax;
 const opts=[['ru_npdu','🇷🇺 Самозанятость (НПД, РФ)'],['by_npd','🇧🇾 НПД, Беларусь'],['cn','🇨🇳 Работа с Китаем (IIT)'],['compare',' Сравнение стран']];
 let h=`<h2>Налоги</h2><div class="card"><label>Режим</label><select onchange="db.tax.regime=this.value;save();render()">${opts.map(o=>`<option value="${o[0]}" ${t.regime===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
 if(t.regime==='ru_npdu'){
  const year=today().slice(0,4);let yi=0;db.fin.forEach(f=>{if(f.type==='in'&&f.date.startsWith(year))yi+=toRub(f.amt,f.cur)});
  h+=`<div class="card"><b>Калькулятор НПД</b>
  <label>Доход от физлиц, ₽ — 4%</label><input type="number" id="ti" value="${t.calc.ind}" oninput="db.tax.calc.ind=this.value;save();taxCalcNow()">
  <label>Доход от организаций, ₽ — 6%</label><input type="number" id="te" value="${t.calc.ent}" oninput="db.tax.calc.ent=this.value;save();taxCalcNow()">
  <label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" ${t.useDeduct?'checked':''} onchange="db.tax.useDeduct=this.checked;save();taxCalcNow()" style="margin:0"><span>Вычет для новых (3%/4%)</span></label>
  <div id="taxout"></div>
  <p class="mut">Чек — в «Мой налог». Уплата — до 28-го числа. Лимит — ${t.limit.toLocaleString('ru-RU')} ₽/год.</p>
  <label>Доход за ${year}: ${fmt(yi,'RUB')} из ${fmt(t.limit,'RUB')}</label>
  <div class="bar"><i style="width:${Math.min(100,yi/t.limit*100)}%"></i></div></div>`;
 }else if(t.regime==='by_npd'){
  h+=`<div class="card"><b>Калькулятор НПД (РБ)</b>
  <label>Доход за месяц, BYN</label><input type="number" id="ti" value="${t.calc.ind}" oninput="db.tax.calc.ind=this.value;save();taxCalcNow()">
  <label style="display:flex;align-items:center;gap:8px;margin-top:8px"><input type="checkbox" ${t.byPensioner?'checked':''} onchange="db.tax.byPensioner=this.checked;save();taxCalcNow()" style="margin:0"><span>Я пенсионер (4%)</span></label>
  <div id="taxout"></div></div>`;
 }else if(t.regime==='cn'){
  h+=`<div class="card"><b>Калькулятор налога Китая (IIT)</b>
  <p class="mut">Прогрессивная шкала. Необлагаемый минимум — 5 000 ¥/мес.</p>
  <label>Доход за месяц, ¥</label><input type="number" id="ti" value="${t.calc.ind}" oninput="db.tax.calc.ind=this.value;save();taxCalcNow()">
  <div id="taxout"></div>
  <div class="note"><b>Шкала IIT:</b><br>до 3 000 ¥ — 3% · 3 000–12 000 — 10% · 12 000–25 000 — 20% · 25 000–35 000 — 25% · 35 000–55 000 — 30% · 55 000–80 000 — 35% · свыше 80 000 — 45%</div></div>`;
 }else{
  h+=`<div class="card"><b>Сравнение налогов по странам</b>
  <label>Доход за месяц, ₽</label><input type="number" id="ti" value="${t.calc.ind||100000}" oninput="db.tax.calc.ind=this.value;save();taxCalcNow()">
  <div id="taxout"></div></div>`;
 }
 return h;
}
function taxCalcNow(){
 const ti=document.getElementById('ti'),te=document.getElementById('te');if(!ti)return;
 const r=db.tax.regime;let out='';
 if(r==='ru_npdu'){const i=+ti.value||0,e=+(te&&te.value)||0,d=db.tax.useDeduct;
  const rI=d?0.03:0.04,rE=d?0.04:0.06;const taxI=i*rI,taxE=e*rE,total=taxI+taxE;
  out=`<div class="card" style="background:var(--card2)"><div class="row spread"><span class="mut">Налог:</span><b class="plus" style="font-size:22px">${fmt(total,'RUB')}</b></div><div class="mut">Физлица (${d?'3':'4'}%): ${fmt(taxI,'RUB')} · Организации (${d?'4':'6'}%): ${fmt(taxE,'RUB')}</div></div>`}
 else if(r==='by_npd'){const i=+ti.value||0;const rate=db.tax.byPensioner?0.04:0.10;const tax=i*rate;
  out=`<div class="card" style="background:var(--card2)"><div class="row spread"><span class="mut">Налог (${Math.round(rate*100)}%):</span><b class="plus" style="font-size:22px">${fmt(tax,'BYN')}</b></div></div>`}
 else if(r==='cn'){const i=+ti.value||0;const tax=calcChinaTax(i);
  out=`<div class="card" style="background:var(--card2)"><div class="row spread"><span class="mut">Налог (IIT):</span><b class="plus" style="font-size:22px">${fmt(tax,'CNY')}</b></div><div class="mut">Эффективная ставка: ${i>0?(tax/i*100).toFixed(1):0}%</div></div>`}
 else{const amt=+ti.value||0;const cnTax=calcChinaTax(fromRub(amt,'CNY'));
  out=`<div class="card" style="background:var(--card2)"><b>Сравнение для ${fmt(amt,'RUB')}</b><div class="mut" style="margin-top:6px">🇷 РФ НПД от юрлиц (6%): <b>${fmt(amt*0.06,'RUB')}</b></div><div class="mut">🇷🇺 РФ НПД от физлиц (4%): <b>${fmt(amt*0.04,'RUB')}</b></div><div class="mut">🇧🇾 РБ НПД (10%): <b>${fmt(amt*0.10,'RUB')}</b></div><div class="mut">🇨 Китай IIT: <b>${fmt(cnTax,'CNY')}</b> ≈ ${fmt(toRub(cnTax,'CNY'),'RUB')}</div></div>`}
 document.getElementById('taxout').innerHTML=out}
function payTaxToFin(){
 const ti=document.getElementById('ti'),te=document.getElementById('te');let t=0,cur='RUB';
 if(db.tax.regime==='ru_npdu'){const d=db.tax.useDeduct;t=Math.round((+ti.value||0)*(d?0.03:0.04)+(+((te&&te.value)||0))*(d?0.04:0.06))}
 else if(db.tax.regime==='by_npd'){const rate=db.tax.byPensioner?0.04:0.10;t=Math.round((+ti.value||0)*rate);cur='BYN'}
 else if(db.tax.regime==='cn'){t=calcChinaTax(+ti.value||0);cur='CNY'}
 else return toast('Введите сумму');
 if(t<=0)return toast('Введите сумму');
 db.fin.unshift({id:uid(),date:today(),type:'out',amt:t,cur,cat:'Налоги'});
 save();toast('Налог записан');render()}

function genDoc(type,o){
 const moneyStr=o.amt?fmt(o.amt,o.cur):'[сумма]';
 const req=`Банк: ${o.mybank||'[банк]'} · БИК: ${o.mybik||'—'} · Счёт: ${o.myacc||'—'}`;
 if(type==='dogovor')return `ДОГОВОР № ${o.num} от ${fmtDate(o.date)}\n\nЗаказчик: ${o.client||'[заказчик]'}${o.inn?`, ИНН ${o.inn}`:''}\nИсполнитель: ${o.fio||'[исполнитель]'}${o.myinn?`, ИНН ${o.myinn}`:''}\n\n1. ПРЕДМЕТ\nИсполнитель оказывает услуги: ${o.item||'[предмет]'}. Срок: ${o.dead?'до '+fmtDate(o.dead):'[срок]'}.\n\n2. СТОИМОСТЬ\n${moneyStr}. Предоплата ${o.prepay}%, остаток после Акта.\n\n3. ПРИЁМКА\nАкт в течение 5 дней. Молчание = принятие.\n\n4. ОТВЕТСТВЕННОСТЬ\nПени 0,1% в день, не более 10%.\n\nПОДПИСИ\nЗаказчик: ${o.client||''}          Исполнитель: ${o.fio||''}\n${o.mybank?req:''}`;
 if(type==='act')return `АКТ № ${o.num} от ${fmtDate(o.date)}\n\nЗаказчик: ${o.client}\nИсполнитель: ${o.fio}\n\nВыполнено: ${o.item||'[работы]'}\nСтоимость: ${moneyStr}\n\nПОДПИСИ\nЗаказчик: ______________          Исполнитель: ______________ / ${o.fio||''} /`;
 if(type==='nda')return `NDA № ${o.num} от ${fmtDate(o.date)}\n\nСтороны: ${o.client} и ${o.fio}\n\n1. Конфиденциальная информация — любые сведения по проекту.\n2. Не разглашать 3 года.\n3. За нарушение — возмещение убытков.\n\nПОДПИСИ\n${o.client}: ______________          ${o.fio}: ______________`;
 if(type==='tz')return `ТЗ № ${o.num} от ${fmtDate(o.date)}\n\nЗаказчик: ${o.client}\nИсполнитель: ${o.fio}\n\n1. ЦЕЛЬ\n[бизнес-результат]\n\n2. СОСТАВ РАБОТ\n${o.item||'[работы]'}\n\n3. СРОКИ\n${o.dead?'до '+fmtDate(o.dead):'[сроки]'}\n\n4. СТОИМОСТЬ\n${moneyStr}, предоплата ${o.prepay}%`;
 return `ПРЕТЕНЗИЯ\n\nКому: ${o.client}\nОт: ${o.fio}\n\nЗадолженность: ${moneyStr}.\nТребую оплатить в течение 10 дней.\n\n«${fmtDate(o.date)}»          Подпись: ______________ / ${o.fio||''} /`}

 <div class="bar"><i style="width:${total?done/total*100:0}%"></i></div>
 <div class="mut">Освоено: ${done} из ${total}</div></div>
 <div class="chips">${dirs.map(d=>`<button class="chip ${kbFilter===d?'on':''}" onclick="kbFilter='${d}';render()">${esc(d)}</button>`).join('')}</div>
 <div class="row" style="margin-bottom:10px"><input placeholder="Поиск…" value="${esc(kbQ)}" oninput="kbQ=this.value;render()" style="margin:0"><button class="btn" onclick="openKbModal()">+ Тема</button></div>`;
 const list=db.kb.filter(k=>(kbFilter==='Все'||k.dir===kbFilter)&&(!kbQ||(k.topic+' '+k.dir).toLowerCase().includes(kbQ.toLowerCase())));
 if(!list.length)h+=empty('Пусто.');
 list.forEach(k=>{h+=`<div class="card">
  <div class="row spread"><b>${esc(k.topic)}</b><span class="chip">${esc(k.dir)}</span></div>
  ${k.time?`<div class="mut">⏱ ${esc(k.time)}</div>`:''}
  <div class="mut" style="margin-top:6px">📖 Теория</div><div class="note">${esc(k.theory)}</div>
  <div class="mut">🛠 Практика</div><div class="note">${esc(k.practice)}</div>
  ${k.res?`<div class="mut">🔗 Ресурсы</div><div class="note">${esc(k.res)}</div>`:''}
  <div class="row" style="margin-top:6px">
   <select onchange="setKbStatus('${k.id}',this.value)">${KB_ST.map(s=>`<option ${s===k.status?'selected':''}>${s}</option>`).join('')}</select>
   <button class="btn danger" onclick="delKb('${k.id}')">✕</button>
  </div></div>`});
 return h;
}
function openKbModal(id){const k=id?db.kb.find(x=>x.id===id):{dir:'',topic:'',theory:'',practice:'',res:'',time:'',status:'Не начато'};
 openModal(`<h3>${id?'Тема':'Новая тема'}</h3>
<label>Направление</label><input id="kb_dir" value="${esc(k.dir)}">
<label>Тема</label><input id="kb_topic" value="${esc(k.topic)}">
<label>⏱ Время</label><input id="kb_time" value="${esc(k.time||'')}" placeholder="2 недели по 1 часу в день">
<label>📖 Теория</label><textarea id="kb_theory" rows="4">${esc(k.theory)}</textarea>
<label> Практика</label><textarea id="kb_practice" rows="3">${esc(k.practice)}</textarea>
<label>🔗 Ресурсы</label><textarea id="kb_res" rows="2">${esc(k.res||'')}</textarea>
<label>Статус</label><select id="kb_status">${KB_ST.map(s=>`<option ${k.status===s?'selected':''}>${s}</option>`).join('')}</select>
<div class="row"><button class="btn" onclick="saveKb('${id||''}')">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button></div>`)}
function saveKb(id){const t=document.getElementById('kb_topic').value.trim();if(!t)return toast('Укажите тему');
 const o={dir:document.getElementById('kb_dir').value.trim()||'Разное',topic:t,theory:document.getElementById('kb_theory').value.trim(),practice:document.getElementById('kb_practice').value.trim(),res:document.getElementById('kb_res').value.trim(),time:document.getElementById('kb_time').value.trim(),status:document.getElementById('kb_status').value};
 if(id){Object.assign(db.kb.find(x=>x.id===id)||{},o)}else db.kb.unshift({id:uid(),...o});
 save();closeModal();render();toast('Сохранено')}
function setKbStatus(id,s){const k=db.kb.find(x=>x.id===id);if(k){k.status=s;save();render()}}
function delKb(id){if(confirm('Удалить?')){db.kb=db.kb.filter(k=>k.id!==id);save();render()}}

/* ===== НАСТРОЙКИ ===== */
function toggleSpec(sp){const i=db.profile.specs.indexOf(sp);if(i>=0)db.profile.specs.splice(i,1);else db.profile.specs.push(sp);save();const added=generatePainsSilent();save();render();if(added>0)toast(`Добавлено ${added} гипотез`)}
function rSet(){const p=db.profile;return `<h2>Настройки</h2>
<div class="card"><b>Профиль</b>
<label>Имя</label><input value="${esc(p.name)}" oninput="db.profile.name=this.value;save()">
<label>Специализация</label><input value="${esc(p.spec)}" oninput="db.profile.spec=this.value;save()">
<label>Страна</label><select onchange="db.profile.country=this.value;save()">${['ru','by','cn'].map(c=>`<option value="${c}" ${p.country===c?'selected':''}>${CNAME[c]}</option>`).join('')}</select>
<label>Часовая ставка</label><div class="row2"><div><input type="number" value="${p.rate}" oninput="db.profile.rate=+this.value||0;save()"></div>
<div><select onchange="db.profile.currency=this.value;save();render()">${['RUB','BYN','CNY','USD'].map(c=>`<option ${p.currency===c?'selected':''}>${c}</option>`).join('')}</select></div></div></div>
<div class="card"><b>🎯 Мои специализации</b>
<p class="mut" style="margin:6px 0">Отметьте направления. Влияет на генерацию клиентов.</p>
${ALL_SPECS.map(sp=>`<label style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" ${p.specs.includes(sp)?'checked':''} onchange="toggleSpec('${sp}')" style="margin:0"><span>${sp}</span></label>`).join('')}
<div class="mut" style="margin-top:8px">Выбрано: ${p.specs.length} из ${ALL_SPECS.length}</div></div>
<div class="card"><b>🔒 PIN-код</b>
${db.pinHash?`<div class="mut">PIN установлен.</div>
<div class="row" style="margin-top:8px"><button class="btn sec" onclick="changePinFlow()">Сменить</button><button class="btn danger" onclick="removePinFlow()">Удалить</button></div>`
:`<div class="row2" style="margin-top:8px"><div><label>Новый PIN (4–8 цифр)</label><input type="password" id="pin1" inputmode="numeric"></div>
<div><label>Повторите</label><input type="password" id="pin2" inputmode="numeric"></div></div>
<div class="row"><button class="btn" onclick="setPin()">Установить</button></div>`}</div>
<div class="card"><b>🔐 Пароль для гостей</b>
<p class="mut" style="margin:6px 0">Оставьте пустым, если доступ без пароля.</p>
<input type="password" value="${esc(p.accessPassword||'')}" onchange="db.profile.accessPassword=this.value;save();toast('Сохранено')" placeholder="Пусто = без пароля"></div>
<div class="card"><b>💱 Курсы валют</b>
<div class="mut">1 BYN = ${p.rates.BYN} ₽ · 1 CNY = ${p.rates.CNY} ₽ · 1 USD = ${p.rates.USD} ₽</div>
<div class="mut">Обновлены: ${p.ratesUpdated||'никогда'}</div>
<div class="row" style="margin-top:8px"><button class="btn" onclick="updateRates()">🔄 Обновить курсы</button></div></div>
<div class="card"><b>Данные</b>
<div class="row" style="margin-top:8px"><button class="btn" onclick="exportData()">⬇ Экспорт</button>
<button class="btn sec" onclick="document.getElementById('impf').click()">⬆ Импорт</button>
<input type="file" id="impf" accept=".json" style="display:none" onchange="importData(this)">
<button class="btn danger" onclick="if(confirm('Удалить ВСЕ данные?')){localStorage.removeItem(KEY);location.reload()}">Сброс</button></div></div>`}
function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='solodev-backup-'+today()+'.json';a.click()}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{db=JSON.parse(e.target.result);save();locked=!!db.pinHash;accessGranted=!db.profile.accessPassword;render();toast('Импортировано')}catch(err){toast('Ошибка')}};r.readAsText(f)}

/* ===== РЕНДЕР ===== */
const VIEW={dash:rDash,radar:rPains,clients:rClients,props:rProps,price:rPrices,proj:rProj,plan:rPlan,time:rTime,fin:rFin,tax:rTax,law:rLaw,dev:rDev,set:rSet};
function render(){
 document.getElementById('tabs').style.display=locked?'none':'flex';
 document.getElementById('lockbtn').style.display=(db.pinHash&&!locked)?'':'none';
 if(!accessGranted&&!checkAccess()){document.getElementById('view').innerHTML='<div style="text-align:center;padding:60px 20px"><div style="font-size:64px">🔐</div><h3>Доступ ограничен</h3><p class="mut">Обратитесь к владельцу.</p></div>';return}
 if(locked){document.getElementById('modal').classList.remove('on');document.getElementById('view').innerHTML=rLock();return}
 document.getElementById('view').innerHTML=VIEW[tab]();if(tab==='tax')taxCalcNow();if(tab==='fin')setTimeout(convertCurrency,100);
 document.getElementById('hdr').textContent=new Date().toLocaleDateString('ru-RU')}

/* ===== АВТОМАТИЗАЦИЯ ПРИ ЗАПУСКЕ ===== */
autoGenerateIfNeeded();
fetchRates();
rTabs();render();

/* ===== SW С ПРИНУДИТЕЛЬНЫМ ОБНОВЛЕНИЕМ ===== */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
 navigator.serviceWorker.register('sw.js?v=09').then(reg=>{
  if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');
  reg.addEventListener('updatefound',()=>{
   const nw=reg.installing;
   nw.addEventListener('statechange',()=>{
    if(nw.state==='installed'&&navigator.serviceWorker.controller){
     toast('Доступно обновление! Перезагрузите страницу.');
    }
   });
  });
 }).catch(()=>{});
}
</script>
</body>
 </html>
