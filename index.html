<!DOCTYPE html>

<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

<script>
// Принудительная регистрация всех Service Workers и их немедленное удаление
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
            registration.unregister();
            console.log('Service Worker убит:', registration.scope);
        }
    });
}
// Дополнительная защита от кэша

</script>
</head>
<body>
<h1>⚡ SoloDev v7.4.1</h1>
<div class="nav" id="nav"></div>
<div id="app"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-content" id="modalContent"></div></div>

  
  

    
    
    <!-- Всплывающее меню (скрыто по умолчанию) -->
    

    <!-- ЕДИНАЯ КНОПКА МЕНЮ -->
    <button id="mainMenuBtn" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg,#9d6cff,#c084ff); color: white; border: 4px solid #fff; font-size: 32px; box-shadow: 0 6px 24px rgba(157,108,255,0.7); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s;" onmousedown="this.style.transform='scale(0.9)'" onmouseup="this.style.transform='scale(1)'" onclick="toggleMainMenu()">💡</button>
    
    <div id="mainMenuPopup" style="position: fixed; bottom: 95px; right: 20px; z-index: 9998; display: none; flex-direction: column; gap: 12px; background: rgba(31,37,48,0.95); padding: 15px; border-radius: 16px; border: 2px solid #9d6cff; box-shadow: 0 8px 32px rgba(0,0,0,0.5); backdrop-filter: blur(10px);">
        <button onclick="toggleNavBar(); closeModal()" style="width: 50px; height: 50px; border-radius: 50%; background: #6c8cff; color: white; border: 2px solid #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" title="Свернуть панель">⬇️</button>
        <button onclick="openProAssistant(); toggleMainMenu()" style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg,#ff6b6b,#ee5a6f); color: white; border: 2px solid #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" title="Профессиональный помощник">🤖</button>
        <button onclick="openSmartAssistant(); toggleMainMenu()" style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg,#6c8cff,#9d6cff); color: white; border: 2px solid #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" title="Умный помощник">💡</button>
        <button onclick="scrollToTop(); closeModal()" style="width: 50px; height: 50px; border-radius: 50%; background: #3ecf8e; color: white; border: 2px solid #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" title="Наверх">⬆️</button>
    </div>

<script>
window.closeModal = function() {
    const modal = document.getElementById('modal');
    if (modal) modal.style.display = 'none';
};
function toggleMainMenu() {
    const popup = document.getElementById('mainMenuPopup');
    const btn = document.getElementById('mainMenuBtn');
    if (popup && btn) {
        if (popup.style.display === 'flex') {
            popup.style.display = 'none';
            btn.innerHTML = '💡';
        } else {
            popup.style.display = 'flex';
            btn.innerHTML = '❌';
        }
    }
}

</script>

<script>
function hardResetCache() {
    if (confirm('⚠️ Это полностью очистит кэш браузера и локальные данные приложения. Страница будет перезагружена. Продолжить?')) {
        // 1. Очищаем Service Workers (если есть)
        if ('caches' in window) {
            caches.keys().then(names => {
                for (let name of names) caches.delete(name);
            });
        }
        // 2. Очищаем LocalStorage и SessionStorage
        localStorage.clear();
        sessionStorage.clear();
        // 3. Принудительная перезагрузка с уникальным параметром (убивает HTTP-кэш)
        const url = new URL(window.location.href);
        url.searchParams.set('killcache', Date.now());
        window.location.href = url.toString();
    }
}
</script>
