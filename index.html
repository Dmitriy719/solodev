<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloDev v2.1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb454;--line:#242b36}
body.light-theme{--bg:#f4f6f8;--card:#fff;--card2:#e9ecef;--txt:#212529;--mut:#6c757d;--line:#dee2e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;z-index:10}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;padding:8px;overflow-x:auto;z-index:20}
nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:60px;background:var(--card2);border:none;border-radius:10px;padding:8px 4px;color:var(--mut);font-size:11px;cursor:pointer}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-btn small{display:block;margin-top:2px;font-size:10px}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}.stat b{font-size:20px}
.mut{color:var(--mut);font-size:13px}.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:10px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.spread{justify-content:space-between}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.ai{background:linear-gradient(90deg,var(--acc),#9d6cff)}
.btn.warn{background:var(--warn);color:#000}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;margin:4px 0 10px}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff}.chip.ok{background:var(--ok);color:#fff}.chip.warn{background:var(--warn);color:#000}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#splash.hidden{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:24px;font-size:14px;z-index:50}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
#modal.on{display:flex}.m-card{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@keyframes load{0%{width:0%}100%{width:100%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal-day{background:var(--card2);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;min-height:50px;position:relative}
.cal-day.today{border:2px solid var(--acc)}
.cal-day.has-deadline{background:#2a1040}
.cal-day .deadline-dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:6px;height:6px;background:var(--bad);border-radius:50%}
.cal-header{text-align:center;color:var(--mut);font-size:11px;padding:4px}
.habit-check{width:24px;height:24px;border-radius:6px;background:var(--card2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.habit-check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.lead-card{border-left:3px solid var(--acc);padding-left:12px}
.lead-card.hh{border-left-color:#d6001c}.lead-card.hn{border-left-color:#ff6600}.lead-card.reddit{border-left-color:#ff4500}
.voice-btn{width:80px;height:80px;border-radius:50%;background:var(--bad);border:none;color:#fff;font-size:32px;cursor:pointer;margin:20px auto;display:block}
.voice-btn.recording{animation:pulse 1s ease infinite}
@media print{body *{visibility:hidden}#print-area,#print-area *{visibility:visible}#print-area{position:fixed;left:0;top:0;width:100%;padding:20px;background:#fff;color:#000}}
</style>
</head>
<body>
<div id="splash">
  <h1 style="font-size:48px;margin-bottom:20px;animation:pulse 1.5s ease infinite">⚡</h1>
  <h1>SoloDev v2.1</h1>
  <p class="mut">Загрузка приложения...</p>
  <div class="bar" style="width:200px;margin-top:20px"><i style="width:0%;animation:load 2s ease forwards"></i></div>
</div>
<header><b>⚡ SoloDev v2.1</b><span id="date"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="m-card" id="mcard"></div></div>
<div id="print-area" style="display:none"></div>
<script>
const KEY='solodev_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const STAGES=['Идея','В работе','Тестирование','Завершён'];
const TIMER_MODES=[{work:25,break:5,name:'25/5 Классика'},{work:50,break:10,name:'50/10 Глубокая'},{work:90,break:20,name:'90/20 Ультрадиан'}];

const PAIN_DB={'Фронтенд':[{seg:'Владельцы магазинов',pain:'Сайт медленно грузится',sol:'Оптимизация скорости',demand:5},{seg:'Стартапы',pain:'Нет сайта',sol:'Лендинг за 1-2 недели',demand:4}],'Бэкенд':[{seg:'Стартапы',pain:'Нужен API',sol:'REST API на Node.js',demand:5}],'Боты':[{seg:'Владельцы каналов',pain:'Много вопросов',sol:'Бот с FAQ',demand:5}]};

function seed(){return{profile:{name:'Дмитрий',spec:'Fullstack разработчик',currency:'RUB',rates:{BYN:30,CNY:11.5,USD:90},specs:['Фронтенд','Бэкенд','Боты'],phone:'+79001234567',email:'dev@example.com'},clients:[{id:uid(),name:'Алексей',company:'TechStart',budget:45000,cur:'RUB',status:'В работе',date:today(),remindDate:null}],projects:[{id:uid(),name:'Интернет-магазин',client:'Алексей',budget:45000,cur:'RUB',stage:1,deadline:'2026-09-01',estimatedHours:40,spentHours:15,tasks:[{id:uid(),text:'Сверстать главную',done:false}],date:today()}],finances:[{id:uid(),date:today(),type:'in',amt:30000,cur:'RUB',cat:'Проект'}],pains:[],skills:[{n:'JavaScript',l:4}],goals:[{t:'Изучить TypeScript',done:false}],knowledge:[{id:uid(),dir:'Фронтенд',topic:'React Hooks',theory:'useEffect, useState',practice:'Создать хук',status:1}],prices:[{id:uid(),name:'Лендинг',price:25000,cur:'RUB',unit:'проект'}],tasks:[],templates:[],outreachStats:{sent:0,replied:0,converted:0},timerMode:0,leads:[],diary:[],habits:[{id:uid(),name:'Код 2 часа',icon:'💻',streak:0,history:{}},{id:uid(),name:'Спорт',icon:'🏃',streak:0,history:{}},{id:uid(),name:'Чтение',icon:'📚',streak:0,history:{}}],calendarView:'month',calendarDate:today()}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let db=(()=>{const s=seed(),l=load();return l?{...s,...l}:s})();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}

const TABS=[{id:'home',icon:'🏠',label:'Главная'},{id:'radar',icon:'🎯',label:'Радар'},{id:'clients',icon:'👥',label:'Клиенты'},{id:'projects',icon:'📁',label:'Проекты'},{id:'calendar',icon:'📅',label:'Календарь'},{id:'diary',icon:'📝',label:'Дневник'},{id:'habits',icon:'✅',label:'Привычки'},{id:'finances',icon:'💰',label:'Финансы'},{id:'time',icon:'⏱',label:'Время'},{id:'growth',icon:'',label:'Рост'},{id:'settings',icon:'⚙️',label:'Настройки'}];
let tab='home';

function renderNav(){document.getElementById('nav').innerHTML=TABS.map(t=>'<button class="nav-btn '+(t.id===tab?'active':'')+'" onclick="go(\''+t.id+'\')">'+t.icon+'<br><small>'+t.label+'</small></button>').join('');}
function go(id){tab=id;renderNav();render();window.scrollTo(0,0)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function openModal(h){document.getElementById('mcard').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('Скопировано!')).catch(()=>toast('Ошибка копирования'))}

// ===== ГЛАВНАЯ =====
function rHome(){
  const m=MONTHS[new Date().getMonth()];
  const inc=db.finances.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0);
  const activeProjects=db.projects.filter(p=>p.stage<3).length;
  const leadsCount=(db.leads?db.leads.length:0)+(db.pains?db.pains.length:0);
  const reminders=db.clients.filter(c=>c.remindDate&&c.remindDate<=today()).length;
  return '<div class="note" style="background:linear-gradient(135deg,var(--acc),#9d6cff);color:#fff;padding:20px;margin-bottom:20px"><div style="font-size:24px">Привет, '+esc(db.profile.name)+'! 👋</div><div style="opacity:.9">'+esc(db.profile.spec)+'</div></div><div class="grid"><div class="card stat"><span>Доход, '+m+'</span><b class="plus">'+inc.toLocaleString()+' ₽</b></div><div class="card stat"><span>Проектов</span><b>'+activeProjects+'</b></div><div class="card stat"><span>Лидов</span><b>'+leadsCount+'</b></div><div class="card stat"><span>Напоминаний</span><b class="'+(reminders>0?'minus':'')+'">'+reminders+'</b></div></div><div class="card"><b>⚡ Быстрые действия</b><div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn" onclick="go(\'radar\')">🎯 Найти клиентов</button><button class="btn sec" onclick="go(\'projects\')">📁 Проекты</button><button class="btn sec" onclick="go(\'calendar\')">📅 Календарь</button><button class="btn sec" onclick="go(\'diary\')">📝 Дневник</button></div></div>';
}

// ===== РАДАР С БИРЖАМИ =====
function rRadar(){
  let h='<div class="row spread"><h2> Радар</h2></div>';
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>🌐 АВТОПОИСК в интернете</b>';
  h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn ai" onclick="searchHH()" style="flex:1">🇺 HH.ru</button><button class="btn warn" onclick="searchHN()" style="flex:1">🔶 Hacker News</button><button class="btn sec" onclick="searchReddit()" style="flex:1">🔴 Reddit</button></div>';
  h+='<button class="btn" onclick="searchAll()" style="width:100%;margin-top:8px">🚀 Искать ВЕЗДЕ</button></div>';
  
  h+='<div class="card"><b>💼 Биржи фриланса</b><p class="mut">Быстрый поиск по вашим навыкам</p>';
  const q=encodeURIComponent(db.profile.specs.join(' '));
  h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
  h+='<a href="https://www.upwork.com/nx/search/jobs/?q='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Upwork</a>';
  h+='<a href="https://freelance.ru/projects/?search='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Freelance.ru</a>';
  h+='<a href="https://kwork.ru/projects?keyword='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Kwork</a>';
  h+='</div></div>';
  
  if(db.leads&&db.leads.length){
    h+='<div class="card"><b> Найдено лидов: '+db.leads.length+'</b><button class="btn danger" style="margin-top:8px" onclick="clearLeads()">🗑 Очистить</button>';
    db.leads.slice(0,10).forEach((l,idx)=>{
      const srcClass=l.source==='hh'?'hh':l.source==='hn'?'hn':'reddit';
      h+='<div class="card lead-card '+srcClass+'" style="margin-top:10px"><div class="row spread"><b>'+(idx+1)+'. '+esc(l.title)+'</b></div>';
      if(l.company) h+='<div class="mut">🏢 '+esc(l.company)+'</div>';
      if(l.salary) h+='<div class="plus">💰 '+esc(l.salary)+'</div>';
      h+='<div class="row" style="margin-top:10px;gap:8px"><button class="btn sec" onclick="leadToClient('+idx+')">👥 В клиенты</button><button class="btn sec" onclick="leadOutreach('+idx+')">✍️</button><button class="btn danger" onclick="delLead('+idx+')">🗑</button></div></div>';
    });
    h+='</div>';
  }
  
  h+='<div class="card" style="background:#1a2035;border-color:#3a4a7a"><b>🤖 Шаблоны болей</b><p class="mut">Найдено: <b>'+db.pains.length+'</b></p>';
  h+='<button class="btn ai" onclick="generatePains()" style="width:100%;margin-bottom:8px">🎯 Сгенерировать</button>';
  h+='<button class="btn sec" onclick="generateAllPains()" style="width:100%"> АВТОПОИСК по всем</button></div>';
  
  if(db.pains&&db.pains.length){
    db.pains.slice(0,5).forEach((p,idx)=>{
      h+='<div class="card"><div class="row spread"><b>'+(idx+1)+'. '+esc(p.seg)+'</b><span class="chip on">'+'★'.repeat(p.demand)+'</span></div>';
      h+='<div class="mut">'+esc(p.pain)+'</div><div class="note">💡 '+esc(p.sol)+'</div>';
      h+='<div class="row" style="margin-top:10px;gap:8px"><button class="btn sec" onclick="genOutreach(\''+esc(p.pain)+'\',\''+esc(p.sol)+'\',\''+esc(p.seg)+'\')">️</button><button class="btn danger" onclick="delPain(\''+p.id+'\')">🗑</button></div></div>';
    });
  }
  return h;
}

async function searchHH(){toast(' HH.ru...');const queries=db.profile.specs.length?db.profile.specs:['разработчик'];let found=0;for(const q of queries){try{const r=await fetch('https://api.hh.ru/vacancies?text='+encodeURIComponent(q)+'&per_page=5&area=1');if(!r.ok)continue;const data=await r.json();(data.items||[]).forEach(v=>{if(!db.leads.some(l=>l.url===v.alternate_url)){db.leads.push({id:uid(),source:'hh',title:v.name,company:v.employer?v.employer.name:'',salary:v.salary?(v.salary.from?v.salary.from+'':v.salary.to?v.salary.to+'':'')+' '+(v.salary.currency||'RUB'):'',description:v.snippet?v.snippet.requirement||'':'',url:v.alternate_url,date:today()});found++;}});}catch(e){}}save();render();toast('🇷🇺 HH: '+found+' вакансий');}
async function searchHN(){toast('🔍 Hacker News...');let found=0;try{const r=await fetch('https://hn.algolia.com/api/v1/search?query=hiring+developer&tags=story&hitsPerPage=10');const data=await r.json();(data.hits||[]).forEach(h=>{if(!db.leads.some(l=>l.title===h.title)){db.leads.push({id:uid(),source:'hn',title:h.title,company:h.author||'',salary:'',description:'',url:h.url||'https://news.ycombinator.com/item?id='+h.object_id,date:today()});found++;}});}catch(e){}save();render();toast('🔶 HN: '+found+' постов');}
async function searchReddit(){toast('🔍 Reddit...');let found=0;const subs=['forhire','freelance_forhire'];for(const s of subs){try{const r=await fetch('https://www.reddit.com/r/'+s+'/hot.json?limit=5');const data=await r.json();(data.data?data.data.children||[]:[]).forEach(p=>{const post=p.data;if(!db.leads.some(l=>l.url==='https://reddit.com'+post.permalink)){db.leads.push({id:uid(),source:'reddit',title:post.title,company:'r/'+s,salary:'',description:post.selftext?post.selftext.substring(0,200):'',url:'https://reddit.com'+post.permalink,date:today()});found++;}});}catch(e){}}save();render();toast(' Reddit: '+found+' постов');}
async function searchAll(){toast('🚀 Ищу везде...');await searchHH();await new Promise(r=>setTimeout(r,500));await searchHN();await new Promise(r=>setTimeout(r,500));await searchReddit();toast('✅ Найдено: '+db.leads.length+' лидов');}
function leadToClient(idx){const l=db.leads[idx];if(!l)return;db.clients.push({id:uid(),name:l.company||l.title,company:l.company||'',budget:0,cur:'RUB',status:'Новый',date:today(),source:l.source,url:l.url});db.outreachStats=db.outreachStats||{sent:0,replied:0,converted:0};db.outreachStats.converted++;save();render();toast('👥 Добавлен!');}
function leadOutreach(idx){const l=db.leads[idx];if(!l)return;const txt='Здравствуйте!\n\nМеня зовут '+db.profile.name+', я '+db.profile.spec+'.\n\nУвидел ваш запрос: "'+l.title+'".\n\nБуду рад обсудить детали.\n\nС уважением,\n'+db.profile.name;copyText(txt);db.outreachStats=db.outreachStats||{sent:0,replied:0,converted:0};db.outreachStats.sent++;save();openModal('<h3>✉️ Письмо скопировано!</h3><textarea id="outText" rows="10" style="width:100%">'+esc(txt)+'</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="copyText(document.getElementById(\'outText\').value);closeModal()"> Копировать</button>');}
function delLead(idx){db.leads.splice(idx,1);save();render();}
function clearLeads(){if(confirm('Удалить все лиды?')){db.leads=[];save();render();}}
function generatePains(){let added=0;(db.profile.specs||[]).forEach(sp=>{(PAIN_DB[sp]||[]).forEach(p=>{if(!db.pains.some(x=>x.pain===p.pain)){db.pains.push({id:uid(),...p,status:'Гипотеза'});added++;}});});save();render();toast(added>0?'✅ +'+added:'⚠️ Все в базе');}
function generateAllPains(){let added=0;Object.keys(PAIN_DB).forEach(sp=>{PAIN_DB[sp].forEach(p=>{if(!db.pains.some(x=>x.pain===p.pain)){db.pains.push({id:uid(),...p,status:'Гипотеза'});added++;}});});save();render();toast('🚀 +'+added);}
function delPain(id){if(confirm('Удалить?')){db.pains=db.pains.filter(p=>p.id!==id);save();render();}}
function genOutreach(pain,sol,seg){const txt='Здравствуйте!\n\nМеня зовут '+db.profile.name+', я '+db.profile.spec+'.\n\nВижу, что для "'+seg+'" актуально: "'+pain+'".\nЯ решаю: '+sol+'.\n\nНайдётся 5 минут?\n\n'+db.profile.name;copyText(txt);db.outreachStats=db.outreachStats||{sent:0,replied:0,converted:0};db.outreachStats.sent++;save();openModal('<h3>✉️ Скопировано!</h3><textarea id="outText" rows="10" style="width:100%">'+esc(txt)+'</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="copyText(document.getElementById(\'outText\').value);closeModal()">📋 Копировать</button>');}

// ===== КЛИЕНТЫ С НАПОМИНАНИЯМИ =====
function rClients(){
  const reminders=db.clients.filter(c=>c.remindDate&&c.remindDate<=today());
  let h='<div class="row spread"><h2>👥 Клиенты</h2><button class="btn" onclick="addClient()">+ Лид</button></div>';
  if(reminders.length){h+='<div class="card" style="background:#241d0e;border-color:#5a4a1e"><b>🔔 Напоминания ('+reminders.length+')</b>';reminders.forEach(c=>{h+='<div class="row spread" style="margin-top:8px"><span>'+esc(c.name)+' — написать '+c.remindDate+'</span><button class="btn sec" onclick="setRemind(\''+c.id+'\',null)">✓</button></div>';});h+='</div>';}
  db.clients.forEach(c=>{
    h+='<div class="card"><div class="row spread"><b>'+esc(c.name)+'</b><span class="chip on">'+c.status+'</span></div>';
    h+='<div class="mut">'+esc(c.company)+' · '+c.budget+' '+c.cur+'</div>';
    h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
    h+='<button class="btn sec" onclick="setRemind(\''+c.id+'\')">🔔 Напомнить</button>';
    h+='<button class="btn danger" onclick="delClient(\''+c.id+'\')">🗑</button>';
    h+='</div></div>';
  });
  return h;
}

// ===== КАЛЕНДАРЬ =====
function rCalendar(){
  const [year,month]=db.calendarDate.split('-').map(Number);
  const firstDay=new Date(year,month-1,1);
  const lastDay=new Date(year,month,0);
  const startWeekday=(firstDay.getDay()+6)%7;
  const daysInMonth=lastDay.getDate();
  const todayStr=today();
  const deadlines=db.projects.filter(p=>p.deadline&&p.deadline.startsWith(db.calendarDate.slice(0,7))).map(p=>({date:p.deadline,name:p.name}));
  
  let h='<div class="row spread"><h2> Календарь</h2></div>';
  h+='<div class="card"><div class="row spread"><button class="btn sec" onclick="changeMonth(-1)">←</button><b>'+MONTHS[month-1]+' '+year+'</b><button class="btn sec" onclick="changeMonth(1)">→</button></div>';
  h+='<div class="cal-grid">';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d=>{h+='<div class="cal-header">'+d+'</div>';});
  for(let i=0;i<startWeekday;i++){h+='<div class="cal-day"></div>';}
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=year+'-'+String(month).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=dateStr===todayStr;
    const hasDeadline=deadlines.some(dl=>dl.date===dateStr);
    h+='<div class="cal-day'+(isToday?' today':'')+(hasDeadline?' has-deadline':'')+'"><b>'+d+'</b>';
    if(hasDeadline) h+='<div class="deadline-dot"></div>';
    h+='</div>';
  }
  h+='</div></div>';
  
  if(deadlines.length){
    h+='<div class="card"><b>🎯 Дедлайны в '+MONTHS[month-1]+'</b>';
    deadlines.forEach(dl=>{h+='<div class="row spread" style="margin:8px 0"><span>'+dl.date.slice(8)+' · '+esc(dl.name)+'</span><span class="chip warn">Дедлайн</span></div>';});
    h+='</div>';
  }
  return h;
}
function changeMonth(n){const [y,m]=db.calendarDate.split('-').map(Number);let nm=m+n,ny=y;if(nm<1){nm=12;ny--;}if(nm>12){nm=1;ny++;}db.calendarDate=ny+'-'+String(nm).padStart(2,'0')+'-01';save();render();}

let recognition=null,isRecording=false;
function toggleVoice(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){toast('Голосовой ввод не поддерживается');return;}
  if(isRecording){recognition.stop();isRecording=false;document.getElementById('voiceBtn').classList.remove('recording');document.getElementById('voiceStatus').textContent='';return;}
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SpeechRecognition();
  recognition.lang='ru-RU';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.onstart=()=>{isRecording=true;document.getElementById('voiceBtn').classList.add('recording');document.getElementById('voiceStatus').textContent='🎤 Слушаю...';};
  recognition.onresult=(e)=>{const text=e.results[0][0].transcript;db.diary.push({id:uid(),date:today(),time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),text:text});save();render();toast('Голосовая заметка добавлена');};
  recognition.onerror=()=>{toast('Ошибка распознавания');isRecording=false;document.getElementById('voiceBtn').classList.remove('recording');};
  recognition.onend=()=>{isRecording=false;document.getElementById('voiceBtn').classList.remove('recording');document.getElementById('voiceStatus').textContent='';};
  recognition.start();
}

  const qrData='BEGIN:VCARD\nVERSION:3.0\nFN:'+db.profile.name+'\nTITLE:'+db.profile.spec+'\nTEL:'+db.profile.phone+'\nEMAIL:'+db.profile.email+'\nEND:VCARD';
  const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(qrData);
  return '<div class="row spread"><h2>⚙️ Настройки</h2></div><div class="card"><b> Профиль</b><label>Имя</label><input value="'+esc(db.profile.name)+'" onchange="db.profile.name=this.value;save()"><label>Специализация</label><input value="'+esc(db.profile.spec)+'" onchange="db.profile.spec=this.value;save()"><label>Телефон</label><input value="'+esc(db.profile.phone||'')+'" onchange="db.profile.phone=this.value;save()"><label>Email</label><input value="'+esc(db.profile.email||'')+'" onchange="db.profile.email=this.value;save()"></div><div class="card"><b>📱 QR-код визитки</b><p class="mut">Отсканируйте чтобы добавить контакт</p><img src="'+qrUrl+'" style="width:200px;height:200px;margin:10px auto;display:block;border-radius:10px"></div><div class="card"><b>🎨 Тема</b><button class="btn sec" onclick="document.body.classList.toggle(\'light-theme\');localStorage.setItem(\'theme\',document.body.classList.contains(\'light-theme\')?\'light\':\'dark\')" style="width:100%">🌓 Переключить тему</button></div><div class="card"><b>📊 Экспорт</b><button class="btn" onclick="exportCSV()" style="width:100%">📥 Скачать Excel (CSV)</button></div><div class="card"><b>🔄 Сброс</b><button class="btn danger" onclick="hardReset()" style="width:100%">🔄 Сбросить кэш</button></div>';
}

function exportCSV(){let csv='Тип,Имя,Сумма\n';db.clients.forEach(c=>{csv+='Клиент,'+c.name+','+c.budget+'\n';});db.projects.forEach(p=>{csv+='Проект,'+p.name+','+p.budget+'\n';});const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='SoloDev_'+today()+'.csv';link.click();toast('✅ Экспорт завершён!');}
function hardReset(){if(confirm("⚠️ Удалить кэш? Данные сохранятся.")){if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if("caches"in window)caches.keys().then(n=>n.forEach(k=>caches.delete(k)));window.location.href=window.location.pathname+"?v="+Date.now();}}

function render(){
  document.getElementById('date').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const app=document.getElementById('app');
  switch(tab){
    case 'home':app.innerHTML=rHome();break;case 'radar':app.innerHTML=rRadar();break;case 'clients':app.innerHTML=rClients();break;
    case 'projects':app.innerHTML=rProjects();break;case 'calendar':app.innerHTML=rCalendar();break;case 'diary':app.innerHTML=rDiary();break;
    case 'habits':app.innerHTML=rHabits();break;case 'finances':app.innerHTML=rFinances();break;case 'time':app.innerHTML=rTime();break;
    case 'growth':app.innerHTML=rGrowth();break;case 'settings':app.innerHTML=rSettings();break;
  }
}
function rFinances(){return '<div class="row spread"><h2>💰 Финансы</h2><button class="btn" onclick="addFin()">+ Операция</button></div>'+db.finances.map(f=>'<div class="card row spread"><div><b class="'+(f.type==='in'?'plus':'minus')+'">'+(f.type==='in'?'+':'-')+' '+f.amt+' '+f.cur+'</b><div class="mut">'+f.cat+'</div></div></div>').join('');}
function addFin(){const a=+prompt('Сумма:');if(!a)return;db.finances.unshift({id:uid(),date:today(),type:prompt('Тип (in/out):','in'),amt:a,cur:'RUB',cat:'Проект'});save();render();}

window.onload=()=>{
  try{
    if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');
    setTimeout(()=>{document.getElementById('splash').classList.add('hidden');setTimeout(()=>{document.getElementById('splash').style.display='none';},500);renderNav();render();},1500);
  }catch(e){console.error('Ошибка:',e);document.getElementById('splash').classList.add('hidden');}
};
</script>
</body>
</html>
