<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>SoloDev — кабинет фрилансера</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--acc2:#9d6cff;--ok:#3ecf8e;--warn:#ffb454;--bad:#ff6b6b;--line:#242b36}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(14,17,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}
header span{color:var(--mut);font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:var(--card);color:var(--mut);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff;border-color:transparent}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 10px}
h3{margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}
.stat b{font-size:19px}
.mut{color:var(--mut);font-size:13px}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:8px;margin:6px 0;font-size:13px;color:var(--mut)}
.warn{background:#241d0e;border-color:#5a4a1e}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.row select,.row input,.row button{margin:0}
.row select{flex:1;max-width:180px;width:auto}
.row input{flex:1}
.row2{display:flex;gap:10px}.row2>*{flex:1}
label{font-size:12px;color:var(--mut);display:block;margin-top:4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:15px;margin:4px 0 10px;font-family:inherit}
input[type=checkbox],input[type=date],input[type=time],input[type=number]{width:auto}
textarea{resize:vertical}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:600}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);padding:10px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.skill{margin:10px 0}
#tview{font-size:44px;font-weight:700;letter-spacing:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.cal-h{text-align:center;color:var(--mut);font-size:11px;padding:2px 0}
.cal-c{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:48px;padding:4px 2px;font-size:12px;text-align:center}
.cal-c.today{border-color:var(--acc);background:#1c2333}
.cal-c.over{border-color:var(--bad)}
details summary{font-weight:700;cursor:pointer}
.docprint{background:#fff;color:#000;border-radius:10px;padding:18px;white-space:pre-wrap;font-size:14px;line-height:1.55;min-height:200px;outline:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.m-card{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-size:13px;z-index:50}
.hello{color:var(--mut);margin:2px 0 12px}
@media print{
 body *{visibility:hidden}
 #printarea,#printarea *{visibility:visible}
 #printarea{position:fixed;left:0;top:0;width:100%;border-radius:0!important}
}
</style>
</head>

function seed(){return{
 profile:{name:'',spec:'Frontend / веб-разработка',country:'ru',currency:'RUB',rate:1500,rates:{BYN:30,CNY:11.5,USD:90},bank:{}},
 clients:[],proposals:[],projects:[],fin:[],tasks:[],sessions:[],plan:[],blocks:[],invoices:[],docLog:[],partners:[],wellbeing:[],
 prices:[
  {id:uid(),name:'Лендинг под ключ',desc:'Адаптивная вёрстка по макету, форма заявки, публикация',price:30000,cur:'RUB',unit:'проект'},
  {id:uid(),name:'Многостраничный сайт (до 10 стр.)',desc:'Вёрстка, базовая CMS или статическая генерация',price:80000,cur:'RUB',unit:'проект'},
  {id:uid(),name:'Вёрстка одной страницы',desc:'HTML/CSS по макету Figma, адаптив',price:8000,cur:'RUB',unit:'шт'},

  {id:uid(),name:'Telegram-бот',desc:'Бот с меню, базой заявок, уведомлениями',price:25000,cur:'RUB',unit:'проект'},
  {id:uid(),name:'Поддержка сайта',desc:'Мелкие доработки, обновления, мониторинг',price:15000,cur:'RUB',unit:'месяц'},
  {id:uid(),name:'Консультация / аудит',desc:'Разбор задачи, оценка, рекомендации',price:5000,cur:'RUB',unit:'час'}],
 kb:[
  {id:uid(),dir:'Фронтенд',topic:'Семантическая HTML-разметка',theory:'Теги header, nav, main, section, article, aside, footer описывают смысл блоков. Это улучшает SEO, доступность (скринридеры) и читаемость кода. Проверка: validator.w3.org.',practice:'Возьмите свою вёрстку на div и замените блоки на семантические теги. Прогоните через W3C-валидатор и исправьте все ошибки.',status:'Не начато'},
  {id:uid(),dir:'Фронтенд',topic:'Flexbox и Grid',theory:'Flexbox — одномерные раскладки (ряд/колонка), Grid — двумерные сетки. Ключевое: justify-content, align-items, gap, grid-template-columns, repeat/auto-fit.',practice:'Сверстайте галерею карточек: 3 колонки на десктопе (Grid, auto-fit), 1 на мобильном. Шапка: логотип слева, меню справа (Flexbox).',status:'Не начато'},
  {id:uid(),dir:'Фронтенд',topic:'JavaScript: DOM и события',theory:'document.querySelector, addEventListener, создание/удаление элементов. События всплывают: делегирование — один обработчик на контейнер вместо десятков.',practice:'Список задач без фреймворка: добавление, отметка выполнения, удаление, сохранение в localStorage.',status:'Не начато'},
  {id:uid(),dir:'Фронтенд',topic:'Асинхронность: fetch и async/await',theory:'Promise, then/catch, async/await, try/catch. fetch возвращает промис ответа, данные — await res.json(). Всегда обрабатывайте ошибки сети.',practice:'Мини-приложение: по кнопке загружать пользователя с https://randomuser.me/api, показывать фото и имя. Добавьте спиннер и обработку ошибки.',status:'Не начато'},
  {id:uid(),dir:'Фронтенд',topic:'TypeScript: основы',theory:'Типы переменных и функций, интерфейсы, union-типы, дженерики. TS ловит ошибки до запуска и служит живой документацией кода.',practice:'Переведите свой список задач с JS на TS: опишите интерфейс Task, типизируйте функции добавления/удаления.',status:'Не начато'},
  {id:uid(),dir:'Фронтенд',topic:'React: компоненты и состояние',theory:'Компонент = функция, возвращающая JSX. useState — локальное состояние, props — входные данные, ключи в списках, useEffect — побочные эффекты.',practice:'Счётчик + список заметок на useState. Затем вынесите заметки в отдельный компонент и передайте данные через props.',status:'Не начато'},
  {id:uid(),dir:'Фронтенд',topic:'Vue 3: реактивность',theory:'ref/reactive, v-bind, v-model, v-for, computed, Composition API. Реактивность: изменили ref — интерфейс обновился сам.',practice:'Форма обратной связи с валидацией на v-model + computed-флаг «можно отправлять».',status:'Не начато'},
  {id:uid(),dir:'Бэкенд',topic:'REST API на Node.js + Express',theory:'Маршруты GET/POST/PUT/DELETE, коды ответов 200/201/400/404, JSON-тело, middleware. Схема: клиент → запрос → обработчик → ответ.',practice:'CRUD API для задач (список/создание/изменение/удаление) с хранением в JSON-файле. Проверьте запросы через браузер или curl.',status:'Не начато'},
  {id:uid(),dir:'DevOps и хостинг',topic:'Git: рабочий процесс',theory:'commit, branch, merge, конфликты и их решение. Правила: одна задача — одна ветка, понятные сообщения коммитов, частые пуши.',practice:'Создайте репозиторий, сделайте ветку, 5 осмысленных коммитов, смёрджте в main, специально создайте конфликт и решите его.',status:'Не начато'},
  {id:uid(),dir:'Бизнес-навыки',topic:'Оценка проектов и ставка',theory:'Формула: (часы × ставка) + риски 20–30%. Типичные ошибки: назвать цену до вопросов, не учесть правки и коммуникацию (это ещё +20% времени).',practice:'Оцените 3 реальных запроса по формуле. После выполнения сравните оценку с фактом из журнала времени и скорректируйте ставку.',status:'Не начато'}],
 mails:0,pinHash:null,dayTpl:DEF_TPL,
 balance:{limitMin:360,items:[...DEF_FAM],checks:{}},
 tax:{regime:'ru_npdu',limit:2400000,calc:{ind:'',ent:''}},
 pains:[{id:uid(),seg:'Малый бизнес: доставка еды',pain:'Сайт медленный, заказы теряются на мобильных',demand:4,src:'Чат предпринимателей в Telegram',sol:'Лёгкий лендинг + форма заказа, ускорение загрузки',status:'Гипотеза',note:''}],
 channels:[{name:'Telegram-чаты ниши',action:'5 полезных контактов в день',status:'В работе',leads:0},{name:'Холодные письма',action:'10 писем в неделю с кейсом',status:'Планируется',leads:0}],
 avatar:{who:'',pain:'',fear:'',obj:'',trigger:'',where:''},
 skills:[{n:'HTML/CSS',l:4},{n:'JavaScript',l:3},{n:'TypeScript',l:2},{n:'React',l:3},{n:'Vue',l:2},{n:'Node.js',l:2},{n:'Figma → вёрстка',l:3}],
 goals:[]};}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let db=(()=>{const s=seed(),l=load();let d=l?{...s,...l,profile:{...s.profile,...(l.profile||{}),bank:{...((l.profile&&l.profile.bank)||{})}},tax:{...s.tax,...(l.tax||{}),calc:{...((l.tax&&l.tax.calc)||{})}}}:s;
 ['pains','channels','tasks','sessions','plan','blocks','invoices','docLog','partners','wellbeing','prices','kb'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
 d.avatar={who:'',pain:'',fear:'',obj:'',trigger:'',where:'',...(d.avatar||{})};
 d.balance={limitMin:360,items:[...DEF_FAM],checks:{},...(d.balance||{})};
 if(!Array.isArray(d.balance.items)||!d.balance.items.length)d.balance.items=[...DEF_FAM];
 d.balance.checks=d.balance.checks||{};

function save(){localStorage.setItem(KEY,JSON.stringify(db))}

/* ================= PIN-ЗАМОК ================= */
let locked=!!db.pinHash;
async function hashPin(pin){
 const s='solodev:'+pin;
 if(window.crypto&&crypto.subtle){
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
   return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}
 }
 let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}
 return 'f'+h.toString(16);
}
function rLock(){return `<div style="max-width:340px;margin:60px auto;text-align:center">
 <div style="font-size:44px">🔒</div><h3>SoloDev</h3>
 <p class="mut">Введите PIN-код</p>
 <input type="password" id="pinin" inputmode="numeric" autocomplete="off" maxlength="8"
  style="text-align:center;font-size:26px;letter-spacing:10px"
  onkeydown="if(event.key==='Enter')tryUnlock()">
 <button class="btn" style="width:100%" onclick="tryUnlock()">Войти</button>
 <p class="mut" style="margin-top:12px">Забыли PIN? Доступ вернёт только сброс данных браузера (данные будут утеряны).</p></div>`}
async function tryUnlock(){const el=document.getElementById('pinin');const v=el.value;
 if(!v)return;
 const h=await hashPin(v);
 if(h===db.pinHash){locked=false;render();toast('С возвращением!')}
 else{toast('Неверный PIN');el.value='';el.focus()}}
function lockNow(){locked=true;render()}
async function setPin(){const a=document.getElementById('pin1').value,b=document.getElementById('pin2').value;
 if(!/^\d{4,8}$/.test(a))return toast('PIN: от 4 до 8 цифр');
 if(a!==b)return toast('PIN-коды не совпадают');
 db.pinHash=await hashPin(a);save();render();toast('PIN установлен')}
async function removePinFlow(){const v=prompt('Введите текущий PIN');if(v===null)return;
 if(await hashPin(v)===db.pinHash){db.pinHash=null;save();render();toast('PIN удалён')}
 else toast('Неверный PIN')}
async function changePinFlow(){const cur=prompt('Текущий PIN');if(cur===null)return;
 if(await hashPin(cur)!==db.pinHash)return toast('Неверный PIN');
 const a=prompt('Новый PIN (4–8 цифр)');if(!a)return;
 if(!/^\d{4,8}$/.test(a))return toast('PIN: от 4 до 8 цифр');
 const b=prompt('Повторите новый PIN');if(a!==b)return toast('PIN-коды не совпадают');
 db.pinHash=await hashPin(a);save();toast('ПIN изменён')}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&db.pinHash&&!locked){locked=true;render()}});

/* ================= УТИЛИТЫ ================= */
function toRub(a,c){return c==='RUB'?a:a*(db.profile.rates[c]||1)}
function fromRub(r,c){return c==='RUB'?r:r/(db.profile.rates[c]||1)}
function fmt(n,c){return (Math.round((n||0)*100)/100).toLocaleString('ru-RU')+' '+(CURS[c]||c)}
function money(rub){return fmt(fromRub(rub,db.profile.currency),db.profile.currency)}
function finMonth(){const m=today().slice(0,7);let i=0,e=0;db.fin.forEach(f=>{if(f.date.startsWith(m)){const r=toRub(f.amt,f.cur);f.type==='in'?i+=r:e+=r}});return{inc:i,exp:e}}
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return loc(x)}
function shiftDate(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return loc(x)}
function workedOn(d){return db.sessions.filter(s=>s.date===d).reduce((a,s)=>a+s.min,0)}
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

 <div class="card mut">Ваша витрина цен для ответов клиентам и офферов. Обновляйте цены по мере роста: +20–30% каждые 3–5 успешных проектов.</div>`;
 if(!db.prices.length)h+=empty('Добавьте первую услугу.');
 db.prices.forEach(p=>{h+=`<div class="card">
  <div class="row spread"><b>${esc(p.name)}</b><b class="plus">${fmt(p.price,p.cur)}${unitLbl(p.unit)}</b></div>
  ${p.desc?`<div class="mut">${esc(p.desc)}</div>`:''}

}
function openPriceModal(id){const p=id?db.prices.find(x=>x.id===id):{name:'',desc:'',price:'',cur:db.profile.currency,unit:'проект'};
 openModal(`<h3>${id?'Услуга':'Новая услуга'}</h3>
<label>Название</label><input id="pr_name" value="${esc(p.name)}" placeholder="Например: Лендинг под ключ">
<label>Описание (что входит)</label><textarea id="pr_desc" rows="2">${esc(p.desc)}</textarea>
<div class="row2"><div><label>Цена</label><input type="number" id="pr_price" value="${p.price}"></div>
<div><label>Валюта</label><select id="pr_cur">${['RUB','BYN','CNY','USD'].map(c=>`<option ${p.cur===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div><label>Единица</label><select id="pr_unit">${UNITS.map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select></div></div>
<div class="row"><button class="btn" onclick="savePrice('${id||''}')">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button></div>`)}
function savePrice(id){const n=document.getElementById('pr_name').value.trim();if(!n)return toast('Укажите название');
 const o={name:n,desc:document.getElementById('pr_desc').value.trim(),price:+document.getElementById('pr_price').value||0,cur:document.getElementById('pr_cur').value,unit:document.getElementById('pr_unit').value};
 if(id){Object.assign(db.prices.find(x=>x.id===id)||{},o)}else db.prices.push({id:uid(),...o});
 save();closeModal();render();toast('Сохранено')}
function delPrice(id){if(confirm('Удалить услугу?')){db.prices=db.prices.filter(p=>p.id!==id);save();render()}}
function copyPrice(id){const p=db.prices.find(x=>x.id===id);if(p)copyText(`${p.name} — ${fmt(p.price,p.cur)}${unitLbl(p.unit)}${p.desc?` (${p.desc})`:''}`)}
function copyAllPrices(){copyText(db.prices.map(p=>`• ${p.name} — ${fmt(p.price,p.cur)}${unitLbl(p.unit)}${p.desc?` — ${p.desc}`:''}`).join('\n'))}

/* ================= ПРОЕКТЫ + ЗАДАЧИ ================= */
let curProj=null;
function rProj(){
 let h=`<div class="row spread"><h2>Проекты</h2><button class="btn" onclick="openProjModal()">+ Проект</button></div>`;
 if(!db.projects.length)h+=empty('Пока нет проектов.');
 db.projects.forEach(p=>{
  const i=Math.max(0,PROJ_ST.indexOf(p.stage));
  const ts=db.tasks.filter(t=>t.proj===p.id),td=ts.filter(t=>t.done).length;
  const over=p.deadline&&p.deadline<today()&&!['Оплачен','Пауза'].includes(p.stage);
  h+=`<div class="card"><div class="row spread"><b>${esc(p.name)}</b><span class="mut">${fmt(p.budget,p.cur)}</span></div>
  <div class="mut">${esc(p.client||'—')} · дедлайн: ${over?`<b class="minus">🔥 ${p.deadline}</b>`:(p.deadline||'—')} · ${p.stage}</div>
  <div class="bar"><i style="width:${i/(PROJ_ST.length-1)*100}%"></i></div>
  <div class="row">
   <select onchange="setProj('${p.id}',this.value)">${PROJ_ST.map(s=>`<option ${s===p.stage?'selected':''}>${s}</option>`).join('')}</select>
   <button class="btn sec" onclick="projTasks('${p.id}')">🗒 ${td}/${ts.length}</button>
   ${i<PROJ_ST.length-1?`<button class="btn sec" onclick="nextProj('${p.id}')">→</button>`:''}
   <button class="btn danger" onclick="delProj('${p.id}')">✕</button>
  </div></div>`});
 return h;
}
function openProjModal(){openModal(`<h3>Новый проект</h3>
<label>Название</label><input id="j_name">
<label>Клиент</label><input id="j_client">
<div class="row2"><div><label>Бюджет</label><input type="number" id="j_budget"></div>
<div><label>Валюта</label><select id="j_cur">${['RUB','BYN','CNY','USD'].map(c=>`<option ${c===db.profile.currency?'selected':''}>${c}</option>`).join('')}</select></div></div>
<label>Дедлайн</label><input type="date" id="j_dead">
<label>Этап</label><select id="j_stage">${PROJ_ST.map(s=>`<option>${s}</option>`).join('')}</select>
<div class="row"><button class="btn" onclick="addProj()">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button></div>`)}
function addProj(){const n=document.getElementById('j_name').value.trim();if(!n)return toast('Укажите название');
 db.projects.unshift({id:uid(),name:n,client:document.getElementById('j_client').value.trim(),budget:+document.getElementById('j_budget').value||0,cur:document.getElementById('j_cur').value,deadline:document.getElementById('j_dead').value,stage:document.getElementById('j_stage').value});
 save();closeModal();render();toast('Проект добавлен')}
function setProj(id,s){const p=db.projects.find(x=>x.id===id);if(p){p.stage=s;save()}}
function nextProj(id){const p=db.projects.find(x=>x.id===id);if(p){const i=PROJ_ST.indexOf(p.stage);if(i>-1&&i<PROJ_ST.length-1){p.stage=PROJ_ST[i+1];save();render()}}}
function delProj(id){if(confirm('Удалить проект и его задачи?')){db.projects=db.projects.filter(p=>p.id!==id);db.tasks=db.tasks.filter(t=>t.proj!==id);save();render()}}
function projTasks(pid){curProj=pid;const p=db.projects.find(x=>x.id===pid);if(!p)return;
 const list=db.tasks.filter(t=>t.proj===pid),done=list.filter(t=>t.done).length;
 openModal(`<h3>🗒 Задачи: ${esc(p.name)}</h3>
 <div class="bar"><i style="width:${list.length?done/list.length*100:0}%"></i></div>
 <div class="mut">${done}/${list.length} выполнено</div>
 ${list.map(t=>`<div class="row" style="margin:8px 0">
  <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')">
  <span style="flex:1;${t.done?'text-decoration:line-through;color:var(--mut)':''}">${esc(t.text)}${t.est?` <span class="mut">≈${t.est}м</span>`:''}</span>
  <button class="btn sec" onclick="logTask('${t.id}')">⏱</button>
  <button class="btn danger" onclick="delTask('${t.id}')">✕</button></div>`).join('')||'<div class="mut" style="margin:10px 0">Задач нет — добавьте первую.</div>'}
 <div class="row" style="margin-top:8px"><input id="nt_task" placeholder="Новая задача"><input id="nt_est" type="number" placeholder="Мин" style="width:80px;flex:0 0 80px"><button class="btn" onclick="addTask('${pid}')">+</button></div>
 <div class="row" style="margin-top:10px"><button class="btn sec" onclick="closeModal()">Закрыть</button></div>`)}
function addTask(pid){const t=document.getElementById('nt_task').value.trim();if(!t)return;
 db.tasks.push({id:uid(),proj:pid,text:t,est:+document.getElementById('nt_est').value||0,done:false,date:today()});
 save();projTasks(pid);render()}
function toggleTask(id){const t=db.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();if(curProj)projTasks(curProj);render()}
function delTask(id){db.tasks=db.tasks.filter(t=>t.id!==id);save();if(curProj)projTasks(curProj);render()}
function logTask(id){const t=db.tasks.find(x=>x.id===id);if(t)logSession(t.est||25,t.text)}

/* ================= ПЛАН ================= */
let planView='day',planDate=today(),selMonth=today().slice(0,7);
function rPlan(){
 let h=`<h2>План и расписание</h2>
 <div class="chips">${[['day','День'],['week','Неделя'],['month','Месяц']].map(([v,l])=>`<button class="chip ${planView===v?'on':''}" onclick="planView='${v}';render()">${l}</button>`).join('')}</div>
 <div class="card mut">Принципы: работать не больше нормы · перерыв каждые 90–120 минут · 🔒 конец рабочего дня по расписанию · вечер — семье и дому · 1 день в неделю без работы · сон 7–8 часов.</div>`;
 return h+(planView==='day'?rDay():planView==='week'?rWeek():rMonth());
}
function setWb(k,v){let w=db.wellbeing.find(x=>x.date===planDate);
 if(!w){w={id:uid(),date:planDate,sleep:0,energy:3,mood:3,note:''};db.wellbeing.push(w)}
 w[k]=v;save()}
function taskRow(t){return `<div class="row" style="margin:8px 0"><input type="checkbox" ${t.done?'checked':''} onchange="togglePlan('${t.id}')"><span style="flex:1;${t.done?'text-decoration:line-through;color:var(--mut)':''}">${t.main?'⭐ ':''}${esc(t.text)}</span><button class="btn danger" onclick="delPlan('${t.id}')">✕</button></div>`}
function rDay(){
 const items=db.plan.filter(t=>t.date===planDate);
 const mains=items.filter(t=>t.main),others=items.filter(t=>!t.main);
 const blocks=[...db.blocks.filter(b=>b.date===planDate)].sort((a,b)=>a.time.localeCompare(b.time));
 const worked=workedOn(planDate),lim=db.balance.limitMin,overW=worked>lim;
 const checks=db.balance.checks[planDate]||[];
 const famDone=checks.filter(Boolean).length;
 const wb=db.wellbeing.find(w=>w.date===planDate)||{sleep:0,energy:3,mood:3,note:''};
 let h=`<div class="card"><div class="row spread">
 <button class="btn sec" onclick="planDate=shiftDate(planDate,-1);render()">←</button>
 <input type="date" value="${planDate}" onchange="planDate=this.value||today();render()" style="flex:1;text-align:center">
 <button class="btn sec" onclick="planDate=shiftDate(planDate,1);render()">→</button></div>
 ${planDate!==today()?`<div class="row" style="justify-content:center;margin-top:6px"><button class="btn sec" onclick="planDate=today();render()">К сегодня</button></div>`:''}</div>
 <div class="card ${overW?'warn':''}"><b>⚖️ Баланс труда и отдыха</b>
 <label>Работа (журнал времени): ${hm(worked)} / норма ${hm(lim)}</label>
 <div class="bar"><i style="width:${Math.min(100,worked/lim*100)}%;${overW?'background:var(--bad)':''}"></i></div>
 ${overW?`<div class="mut minus">🛑 Переработка! Остановитесь: семья, отдых, сон важнее ещё одного часа работы.</div>`:`<div class="mut">Можно работать ещё: ${hm(Math.max(0,lim-worked))}</div>`}
 <b style="display:block;margin-top:8px">🏠 Семья и дом</b>
 ${db.balance.items.map((it,i)=>`<div class="row" style="margin:6px 0"><input type="checkbox" ${checks[i]?'checked':''} onchange="toggleFam(${i})"><span>${esc(it)}</span></div>`).join('')}
 <div class="mut">Выполнено: ${famDone}/${db.balance.items.length}</div></div>
 <div class="card"><b>🙂 Самочувствие</b>
 <div class="row2"><div><label>Сон, часов</label><input type="number" step="0.5" min="0" max="14" value="${wb.sleep||0}" onchange="setWb('sleep',+this.value)"></div>
 <div><label>Энергия</label><select onchange="setWb('energy',+this.value)">${[1,2,3,4,5].map(n=>`<option ${wb.energy===n?'selected':''} value="${n}">${n} из 5</option>`).join('')}</select></div></div>
 <div class="row2"><div><label>Настроение</label><select onchange="setWb('mood',+this.value)">${[1,2,3,4,5].map(n=>`<option ${wb.mood===n?'selected':''} value="${n}">${MOOD_E[n]} ${n}</option>`).join('')}</select></div>
 <div><label>Заметка</label><input value="${esc(wb.note||'')}" placeholder="Как день?" onchange="setWb('note',this.value)"></div></div>
 <div class="mut">Заполняйте вечером — через месяц увидите связь сна и продуктивности.</div></div>
 <div class="card"><b>🎯 3 главные задачи</b>
 ${mains.map(taskRow).join('')||'<div class="mut">Выберите до 3 задач, которые реально двигают доход или проект.</div>'}
 <b style="display:block;margin-top:10px">Остальные</b>
 ${others.map(taskRow).join('')||'<div class="mut">—</div>'}
 <div class="row" style="margin-top:8px"><input id="pt_text" placeholder="Новая задача"><label style="display:flex;align-items:center;gap:4px;margin:0"><input type="checkbox" id="pt_main" style="margin:0">главная</label><button class="btn" onclick="addPlanTask()">+</button></div>
 ${items.some(t=>!t.done)?`<div class="row" style="margin-top:8px"><button class="btn sec" onclick="carryOver()">⏭ Перенести невыполненное на завтра</button></div>`:''}</div>
 <div class="card"><b>🕘 Расписание дня (блоки времени)</b>
 ${blocks.map(b=>`<div class="row spread" style="margin:6px 0"><span><b>${b.time}</b> · ${esc(b.text)}</span><button class="btn danger" onclick="delBlock('${b.id}')">✕</button></div>`).join('')||'<div class="mut">Пусто — добавьте блоки или примените шаблон труда и отдыха.</div>'}
 <div class="row" style="margin-top:8px"><input type="time" id="b_time" value="10:00" style="flex:0 0 110px"><input id="b_text" placeholder="Блок (например, прогулка с семьёй)"><button class="btn" onclick="addBlock()">+</button></div>
 <div class="row" style="margin-top:6px"><button class="btn sec" onclick="applyTpl()">📋 Применить шаблон дня</button></div></div>
 <details class="card"><summary>Шаблон дня (редактировать)</summary>
 <textarea id="tpl" rows="10" style="margin-top:8px" oninput="db.dayTpl=this.value;save()">${esc(db.dayTpl)}</textarea>
 <div class="row"><button class="btn sec" onclick="db.dayTpl=DEF_TPL;save();render();toast('Загружен шаблон труда и отдыха')">Загрузить шаблон «труд и отдых»</button></div>
 <p class="mut">Формат строки: ЧЧ:ММ | занятие. Кнопка «Применить» заменяет блоки выбранного дня.</p></details>
 <details class="card"><summary>⚙️ Нормы и пункты «Семья и дом»</summary>
 <label>Норма работы в день, минут</label><input type="number" value="${db.balance.limitMin}" onchange="db.balance.limitMin=Math.max(60,+this.value||360);save();render()">
 <label>Пункты чек-листа (по одному в строке)</label><textarea id="famitems" rows="5">${esc(db.balance.items.join('\n'))}</textarea>
 <button class="btn sec" onclick="applyFamItems()">Сохранить пункты</button></details>`;
 return h;
}
function addPlanTask(){const t=document.getElementById('pt_text').value.trim();if(!t)return;
 const main=document.getElementById('pt_main').checked;
 if(main&&db.plan.filter(x=>x.date===planDate&&x.main).length>=3)return toast('Главных задач — максимум 3');
 db.plan.push({id:uid(),date:planDate,text:t,main,done:false});save();render()}
function togglePlan(id){const t=db.plan.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}
function delPlan(id){db.plan=db.plan.filter(t=>t.id!==id);save();render()}
function carryOver(){const next=shiftDate(planDate,1);let moved=0;
 db.plan.forEach(t=>{if(t.date===planDate&&!t.done){if(!db.plan.some(x=>x.date===next&&x.text===t.text)){t.date=next;moved++}}});
 save();toast(moved?`Перенесено на завтра: ${moved}`:'Нет невыполненных');render()}
function addBlock(){const t=document.getElementById('b_text').value.trim();if(!t)return;
 db.blocks.push({id:uid(),date:planDate,time:document.getElementById('b_time').value||'09:00',text:t});save();render()}
function delBlock(id){db.blocks=db.blocks.filter(b=>b.id!==id);save();render()}
function applyTpl(){const bs=db.blocks.filter(b=>b.date===planDate);
 if(bs.length&&!confirm('Заменить текущие блоки дня шаблоном?'))return;
 db.blocks=db.blocks.filter(b=>b.date!==planDate);
 db.dayTpl.split('\n').forEach(l=>{const i=l.indexOf('|');if(i<0)return;
  const time=l.slice(0,i).trim(),text=l.slice(i+1).trim();
  if(time&&text)db.blocks.push({id:uid(),date:planDate,time,text})});
 save();render();toast('Шаблон применён')}
function toggleFam(i){const arr=db.balance.checks[planDate]||(db.balance.checks[planDate]=db.balance.items.map(()=>false));
 arr[i]=!arr[i];save();render()}
function applyFamItems(){db.balance.items=document.getElementById('famitems').value.split('\n').map(s=>s.trim()).filter(Boolean);
 if(!db.balance.items.length)db.balance.items=[...DEF_FAM];
 db.balance.checks={};save();render();toast('Пункты сохранены')}
function rWeek(){const mon=monday(planDate+'T00:00:00');let h='',totW=0,overD=0,famD=0,sleepSum=0,enSum=0,wbN=0;
 for(let i=0;i<7;i++){const d=shiftDate(mon,i);
  const items=db.plan.filter(t=>t.date===d),mains=items.filter(t=>t.main);
  const dl=db.projects.filter(p=>p.deadline===d&&!['Оплачен','Пауза'].includes(p.stage));
  const inv=db.invoices.filter(v=>v.due===d&&v.status==='Выставлен');
  const w=db.wellbeing.find(x=>x.date===d);
  const wd=workedOn(d),lim=db.balance.limitMin,isOver=wd>lim;
  const fc=(db.balance.checks[d]||[]).filter(Boolean).length;
  totW+=wd;if(isOver)overD++;if(fc>=db.balance.items.length&&db.balance.items.length)famD++;
  if(w){wbN++;sleepSum+=+w.sleep||0;enSum+=+w.energy||3}
  h+=`<div class="card" style="padding:10px 12px"><div class="row spread">
  <b class="${d===today()?'plus':''}">${w?MOOD_E[w.mood]||'':''} ${DAYS_W[i]}, ${d.slice(8)}.${d.slice(5,7)}</b>
  <button class="btn sec" style="padding:6px 10px" onclick="planDate='${d}';planView='day';render()">Открыть</button></div>
  <div class="mut">⏱ Работа: ${hm(wd)} / ${hm(lim)} ${isOver?'<span class="minus">· 🛑 переработка</span>':''} · 🏠 ${fc}/${db.balance.items.length}${w?` · 😴 ${w.sleep}ч`:''}</div>
  ${mains.map(t=>`<div class="mut">${t.done?'✅':'⬜'} ${esc(t.text)}</div>`).join('')||'<div class="mut">Главные задачи не заданы</div>'}
  ${dl.map(p=>`<div class="mut">📁 Дедлайн: ${esc(p.name)}</div>`).join('')}
  ${inv.map(v=>`<div class="mut">💰 Оплата счёта №${esc(v.num)} (${fmt(v.amt,v.cur)})</div>`).join('')}
  </div>`}
 h+=`<div class="card"><b>Итог недели</b>
 <div class="mut">Работа: ${hm(totW)} · дней с переработкой: ${overD} · дней с полным «семья/дом»: ${famD}/7</div>
 ${wbN?`<div class="mut">Средний сон: ${(sleepSum/wbN).toFixed(1)} ч · средняя энергия: ${(enSum/wbN).toFixed(1)}/5</div>`:'<div class="mut">Заполняйте «🙂 Самочувствие» — здесь появится статистика сна и энергии.</div>'}
 <div class="mut" style="margin-top:4px">Правило: минимум один день в неделе — без работы. Запланируйте его заранее.</div></div>`;
 const hi=db.wellbeing.filter(w=>+w.energy>=4),lo=db.wellbeing.filter(w=>+w.energy<=2);
 if(hi.length>=2&&lo.length>=2){
  const avg=a=>Math.round(a.reduce((s,w)=>s+workedOn(w.date),0)/a.length);
  h+=`<div class="card"><b>💡 Инсайт: энергия и работа</b><div class="mut">В дни с энергией 4–5 вы работаете в среднем ${hm(avg(hi))}, а в дни с энергией 1–2 — ${hm(avg(lo))}. ${avg(hi)>avg(lo)?'Отдых и сон напрямую повышают вашу продуктивность.':'Следите за сном и нагрузкой.'}</div></div>`}
 return h;
}
function monthGrid(ym){const [y,m]=ym.split('-').map(Number);
 const start=(new Date(y,m-1,1).getDay()+6)%7;const days=new Date(y,m,0).getDate();
 const cells=[];for(let i=0;i<start;i++)cells.push('');
 for(let d=1;d<=days;d++)cells.push(`${ym}-${String(d).padStart(2,'0')}`);
 while(cells.length%7)cells.push('');return cells}
function rMonth(){const [y,m]=selMonth.split('-').map(Number);
 let h=`<div class="row spread"><button class="btn sec" onclick="shiftMonth(-1)">←</button><b>${MONTHS[m-1]} ${y}</b><button class="btn sec" onclick="shiftMonth(1)">→</button></div>
 <div class="cal">${DAYS_W.map(d=>`<div class="cal-h">${d}</div>`).join('')}`;
 monthGrid(selMonth).forEach(c=>{if(!c){h+='<div></div>';return}
  const n=db.plan.filter(t=>t.date===c).length;
  const dl=db.projects.some(p=>p.deadline===c&&!['Оплачен','Пауза'].includes(p.stage));
  const inv=db.invoices.some(v=>v.due===c&&v.status==='Выставлен');
  const w=db.wellbeing.find(x=>x.date===c);
  const isOver=workedOn(c)>db.balance.limitMin;

function makeDoc(){const g=id=>document.getElementById(id).value;

 const bank={fio:g('dw_fio').trim(),inn:g('dw_myinn').trim(),addr:g('dw_addr').trim(),bank:g('dw_bank').trim(),bik:g('dw_bik').trim(),acc:g('dw_acc').trim()};
 db.profile.bank=bank;
 if(document.getElementById('dw_savep').checked&&!db.partners.some(p=>p.name===client))
  db.partners.push({name:client,inn:g('dw_inn').trim()});
 const o={num:g('dw_num').trim()||nextDocNum(),date:g('dw_date').value||today(),client,inn:g('dw_inn').trim(),contract:g('dw_contract').trim(),item:g('dw_item').value.trim(),amt,cur:g('dw_cur').value,prepay:g('dw_prepay').value||50,dead:g('dw_dead').value,fio:bank.fio||db.profile.name,myinn:bank.inn,myaddr:bank.addr,mybank:bank.bank,mybik:bank.bik,myacc:bank.acc};

 if(id){Object.assign(db.kb.find(x=>x.id===id)||{},o)}else db.kb.unshift({id:uid(),...o});
 save();closeModal();render();toast('Сохранено')}
function setKbStatus(id,s){const k=db.kb.find(x=>x.id===id);if(k){k.status=s;save();render()}}
function delKb(id){if(confirm('Удалить тему?')){db.kb=db.kb.filter(k=>k.id!==id);save();render()}}
function kbToGoal(id){const k=db.kb.find(x=>x.id===id);if(!k)return;
 db.goals.push({t:'Освоить: '+k.topic,d:'',done:false});save();toast('Добавлено в цели')}

/* ================= НАСТРОЙКИ ================= */
function rSet(){const p=db.profile;return `<h2>Настройки</h2>
<div class="card"><b>Профиль</b>
<label>Имя (как в письмах клиентам)</label><input value="${esc(p.name)}" oninput="db.profile.name=this.value;save()">
<label>Специализация</label><input value="${esc(p.spec)}" oninput="db.profile.spec=this.value;save()">
<label>Страна налогового резидентства</label><select onchange="db.profile.country=this.value;save()">${['ru','by','cn'].map(c=>`<option value="${c}" ${p.country===c?'selected':''}>${CNAME[c]}</option>`).join('')}</select>
<label>Часовая ставка (для оценок)</label><div class="row2"><div><input type="number" value="${p.rate}" oninput="db.profile.rate=+this.value||0;save()"></div>
<div><select onchange="db.profile.currency=this.value;save();render()">${['RUB','BYN','CNY','USD'].map(c=>`<option ${p.currency===c?'selected':''}>${c}</option>`).join('')}</select></div></div></div>
<div class="card"><b>🔒 PIN-код</b>
${db.pinHash?`<div class="mut">PIN установлен. Приложение блокируется при открытии и при сворачивании.</div>
<div class="row" style="margin-top:8px"><button class="btn sec" onclick="changePinFlow()">Сменить PIN</button><button class="btn danger" onclick="removePinFlow()">Удалить PIN</button></div>`
:`<div class="mut">Защитите клиентов, финансы и документы от посторонних глаз.</div>
<div class="row2" style="margin-top:8px"><div><label>Новый PIN (4–8 цифр)</label><input type="password" id="pin1" inputmode="numeric"></div>
<div><label>Повторите PIN</label><input type="password" id="pin2" inputmode="numeric"></div></div>
<div class="row"><button class="btn" onclick="setPin()">Установить PIN</button></div>`}
<p class="mut" style="margin-top:8px">⚠️ Забыли PIN — доступ вернёт только сброс данных браузера (все данные пропадут). Делайте бэкапы!</p></div>
<div class="card"><b>Курсы валют (обновляйте вручную)</b>
<label>1 BYN = … RUB</label><input type="number" step="0.01" value="${p.rates.BYN}" oninput="db.profile.rates.BYN=+this.value||1;save()">
<label>1 CNY = … RUB</label><input type="number" step="0.01" value="${p.rates.CNY}" oninput="db.profile.rates.CNY=+this.value||1;save()">
<label>1 USD = … RUB</label><input type="number" step="0.01" value="${p.rates.USD}" oninput="db.profile.rates.USD=+this.value||1;save()"></div>
<div class="card"><b>Данные</b><p class="mut">Всё хранится локально в браузере. Регулярно делайте резервную копию!</p>
<div class="row" style="margin-top:8px"><button class="btn" onclick="exportData()">⬇ Экспорт JSON</button>
<button class="btn sec" onclick="document.getElementById('impf').click()">⬆ Импорт</button>
<input type="file" id="impf" accept=".json,application/json" style="display:none" onchange="importData(this)">
<button class="btn danger" onclick="if(confirm('Удалить ВСЕ данные?')){localStorage.removeItem(KEY);location.reload()}">Сброс</button></div></div>`}
function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='solodev-backup-'+today()+'.json';a.click()}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{db=JSON.parse(e.target.result);save();locked=!!db.pinHash;render();toast('Импортировано')}catch(err){toast('Ошибка файла')}};r.readAsText(f)}

/* ================= РЕНДЕР + PWA ================= */
const VIEW={dash:rDash,radar:rPains,clients:rClients,props:rProps,price:rPrices,proj:rProj,plan:rPlan,time:rTime,fin:rFin,tax:rTax,law:rLaw,dev:rDev,set:rSet};
function render(){
 document.getElementById('tabs').style.display=locked?'none':'flex';
 document.getElementById('lockbtn').style.display=(db.pinHash&&!locked)?'':'none';
 if(locked){document.getElementById('modal').classList.remove('on');document.getElementById('view').innerHTML=rLock();return}
 document.getElementById('view').innerHTML=VIEW[tab]();if(tab==='tax')taxCalcNow();
 document.getElementById('hdr').textContent=new Date().toLocaleDateString('ru-RU')}
rTabs();render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
 navigator.serviceWorker.register('sw.js').catch(()=>{});
}
