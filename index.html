<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloDev v2.3</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb454;--line:#242b36}
body.light-theme{--bg:#f4f6f8;--card:#fff;--card2:#e9ecef;--txt:#212529;--mut:#6c757d;--line:#dee2e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;z-index:10}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;padding:8px;overflow-x:auto;z-index:20}
nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:60px;background:var(--card2);border:none;border-radius:10px;padding:8px 4px;color:var(--mut);font-size:11px;cursor:pointer}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-btn small{display:block;margin-top:2px;font-size:10px}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}.stat b{font-size:20px}
.mut{color:var(--mut);font-size:13px}.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:10px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.spread{justify-content:space-between}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.ai{background:linear-gradient(90deg,var(--acc),#9d6cff)}
.btn.warn{background:var(--warn);color:#000}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;margin:4px 0 10px}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff}.chip.ok{background:var(--ok);color:#fff}.chip.warn{background:var(--warn);color:#000}.chip.ru{background:#d6001c;color:#fff}.chip.en{background:#0039a6;color:#fff}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#splash.hidden{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:24px;font-size:14px;z-index:50}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
#modal.on{display:flex}.m-card{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@keyframes load{0%{width:0%}100%{width:100%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.article-card{border-left:3px solid var(--acc);padding-left:12px;margin:10px 0}
.article-card.habr{border-left-color:#77a2b6}.article-card.vc{border-left-color:#4a90e2}
.article-card.devto{border-left-color:#0a0a0a}.article-card.github{border-left-color:#6e5494}.article-card.hn{border-left-color:#ff6600}
.tag{display:inline-block;background:var(--card2);padding:4px 10px;border-radius:12px;font-size:11px;margin:2px}
.translate-link{color:var(--acc);text-decoration:none;font-size:12px}
</style>
</head>
<body>
<div id="splash">
  <h1 style="font-size:48px;margin-bottom:20px;animation:pulse 1.5s ease infinite"></h1>
  <h1>SoloDev v2.3</h1>
  <p class="mut">Загрузка приложения...</p>
  <div class="bar" style="width:200px;margin-top:20px"><i style="width:0%;animation:load 2s ease forwards"></i></div>
</div>
<header><b>⚡ SoloDev v2.3</b><span id="date"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="m-card" id="mcard"></div></div>
<script>
const KEY='solodev_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const STAGES=['Идея','В работе','Тестирование','Завершён'];
const TIMER_MODES=[{work:25,break:5,name:'25/5 Классика'},{work:50,break:10,name:'50/10 Глубокая'},{work:90,break:20,name:'90/20 Ультрадиан'}];

const PAIN_DB={'Фронтенд':[{seg:'Владельцы магазинов',pain:'Сайт медленно грузится',sol:'Оптимизация скорости',demand:5}],'Бэкенд':[{seg:'Стартапы',pain:'Нужен API',sol:'REST API',demand:5}],'Боты':[{seg:'Владельцы каналов',pain:'Много вопросов',sol:'Бот с FAQ',demand:5}]};

function seed(){return{profile:{name:'Дмитрий',spec:'Fullstack разработчик',currency:'RUB',rates:{BYN:30,CNY:11.5,USD:90},specs:['Фронтенд','Бэкенд','Боты'],phone:'+79001234567',email:'dev@example.com'},clients:[],projects:[],finances:[],pains:[],skills:[{n:'JavaScript',l:4}],goals:[],knowledge:[],prices:[],tasks:[],templates:[],outreachStats:{sent:0,replied:0,converted:0},timerMode:0,leads:[],diary:[],habits:[{id:uid(),name:'Код 2 часа',icon:'💻',streak:0,history:{}},{id:uid(),name:'Спорт',icon:'🏃',streak:0,history:{}},{id:uid(),name:'Чтение',icon:'📚',streak:0,history:{}}],calendarView:'month',calendarDate:today(),savedArticles:[],searchQuery:''}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let db=(()=>{const s=seed(),l=load();return l?{...s,...l}:s})();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}

const TABS=[{id:'home',icon:'🏠',label:'Главная'},{id:'radar',icon:'🎯',label:'Радар'},{id:'clients',icon:'👥',label:'Клиенты'},{id:'projects',icon:'',label:'Проекты'},{id:'calendar',icon:'📅',label:'Календарь'},{id:'diary',icon:'',label:'Дневник'},{id:'habits',icon:'✅',label:'Привычки'},{id:'finances',icon:'💰',label:'Финансы'},{id:'time',icon:'⏱',label:'Время'},{id:'growth',icon:'🎯',label:'Рост'},{id:'knowledge',icon:'',label:'База'},{id:'settings',icon:'⚙️',label:'Настройки'}];
let tab='home';

function renderNav(){document.getElementById('nav').innerHTML=TABS.map(t=>'<button class="nav-btn '+(t.id===tab?'active':'')+'" onclick="go(\''+t.id+'\')">'+t.icon+'<br><small>'+t.label+'</small></button>').join('');}
function go(id){tab=id;renderNav();render();window.scrollTo(0,0)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function openModal(h){document.getElementById('mcard').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('Скопировано!')).catch(()=>toast('Ошибка копирования'))}

// ===== ГЛАВНАЯ =====
function rHome(){
  const m=MONTHS[new Date().getMonth()];
  const inc=db.finances.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0);
  const activeProjects=db.projects.filter(p=>p.stage<3).length;
  const leadsCount=(db.leads?db.leads.length:0)+(db.pains?db.pains.length:0);
  return '<div class="note" style="background:linear-gradient(135deg,var(--acc),#9d6cff);color:#fff;padding:20px;margin-bottom:20px"><div style="font-size:24px">Привет, '+esc(db.profile.name)+'! 👋</div><div style="opacity:.9">'+esc(db.profile.spec)+'</div></div><div class="grid"><div class="card stat"><span>Доход, '+m+'</span><b class="plus">'+inc.toLocaleString()+' ₽</b></div><div class="card stat"><span>Проектов</span><b>'+activeProjects+'</b></div><div class="card stat"><span>Лидов</span><b>'+leadsCount+'</b></div><div class="card stat"><span>Статей</span><b>'+(db.savedArticles?db.savedArticles.length:0)+'</b></div></div><div class="card"><b> Быстрые действия</b><div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn" onclick="go(\'radar\')">🎯 Найти клиентов</button><button class="btn sec" onclick="go(\'knowledge\')"> База знаний</button><button class="btn sec" onclick="go(\'projects\')"> Проекты</button></div></div>';
}

// ===== РАДАР С РОССИЙСКИМИ БИРЖАМИ =====
function rRadar(){
  let h='<div class="row spread"><h2>🎯 Радар</h2></div>';
  
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b> АВТОПОИСК клиентов</b>';
  h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
  h+='<button class="btn ai" onclick="searchHH()" style="flex:1">🇷🇺 HH.ru</button>';
  h+='<button class="btn warn" onclick="searchHNLeads()" style="flex:1">🔶 HN</button>';
  h+='<button class="btn sec" onclick="searchReddit()" style="flex:1">🔴 Reddit</button>';
  h+='</div>';
  h+='<button class="btn" onclick="searchAllLeads()" style="width:100%;margin-top:8px">🚀 Искать ВЕЗДЕ</button></div>';
  
  h+='<div class="card"><b>🇷🇺 Российские биржи фриланса</b><p class="mut">Поиск по вашим навыкам: '+(db.profile.specs||[]).join(', ')+'</p>';
  const q=encodeURIComponent((db.profile.specs||['разработчик']).join(' '));
  h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
  h+='<a href="https://freelance.habr.com/tasks?q='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Habr Freelance</a>';
  h+='<a href="https://www.fl.ru/projects/?keyword='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">FL.ru</a>';
  h+='<a href="https://freelance.ru/projects/?search='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Freelance.ru</a>';
  h+='<a href="https://kwork.ru/projects?keyword='+q+'" target="_blank" class="btn sec" style="flex:1;text-align:center;text-decoration:none">Kwork</a>';
  h+='</div></div>';
  
  if(db.leads&&db.leads.length){
    h+='<div class="card"><b> Найдено лидов: '+db.leads.length+'</b><button class="btn danger" style="margin-top:8px" onclick="clearLeads()">🗑 Очистить</button>';
    db.leads.slice(0,10).forEach((l,idx)=>{
      const srcClass=l.source==='hh'?'hh':l.source==='hn'?'hn':'reddit';
      const srcName=l.source==='hh'?'🇷🇺 HH.ru':l.source==='hn'?'🔶 HN':' Reddit';
      h+='<div class="card article-card '+srcClass+'" style="margin-top:10px"><div class="row spread"><b>'+(idx+1)+'. '+esc(l.title)+'</b><span class="chip warn">'+srcName+'</span></div>';
      if(l.company) h+='<div class="mut"> '+esc(l.company)+'</div>';
      if(l.salary) h+='<div class="plus"> '+esc(l.salary)+'</div>';
      h+='<div class="row" style="margin-top:10px;gap:8px"><button class="btn sec" onclick="leadToClient('+idx+')">👥 В клиенты</button><button class="btn sec" onclick="leadOutreach('+idx+')">✍️</button><button class="btn danger" onclick="delLead('+idx+')"></button></div></div>';
    });
    h+='</div>';
  }
  
  h+='<div class="card" style="background:#1a2035;border-color:#3a4a7a"><b>🤖 Шаблоны болей</b><button class="btn ai" onclick="generatePains()" style="width:100%">🎯 Сгенерировать</button></div>';
  if(db.pains&&db.pains.length){db.pains.slice(0,3).forEach((p,idx)=>{h+='<div class="card"><b>'+(idx+1)+'. '+esc(p.seg)+'</b><div class="mut">'+esc(p.pain)+'</div><div class="note">💡 '+esc(p.sol)+'</div></div>';});}
  return h;
}

async function searchHH(){toast('🇷 HH.ru...');const q=db.profile.specs[0]||'разработчик';try{const r=await fetch('https://api.hh.ru/vacancies?text='+encodeURIComponent(q)+'&per_page=5&area=1');const data=await r.json();let added=0;(data.items||[]).forEach(v=>{if(!db.leads.some(l=>l.url===v.alternate_url)){db.leads.push({id:uid(),source:'hh',title:v.name,company:v.employer?v.employer.name:'',salary:v.salary?(v.salary.from?v.salary.from+'':v.salary.to?v.salary.to+'':'')+' '+(v.salary.currency||'RUB'):'',url:v.alternate_url,date:today(),lang:'ru'});added++;}});save();render();toast('🇷🇺 +'+added);}catch(e){toast('Ошибка HH');}}
async function searchHNLeads(){toast('🔶 HN...');try{const r=await fetch('https://hn.algolia.com/api/v1/search?query=hiring+developer&tags=story&hitsPerPage=5');const data=await r.json();let added=0;(data.hits||[]).forEach(h=>{if(!db.leads.some(l=>l.title===h.title)){db.leads.push({id:uid(),source:'hn',title:h.title,author:h.author||'',url:h.url||'https://news.ycombinator.com/item?id='+h.object_id,date:today(),lang:'en'});added++;}});save();render();toast('🔶 +'+added);}catch(e){toast('Ошибка HN');}}
async function searchReddit(){toast('🔴 Reddit...');let added=0;try{const r=await fetch('https://www.reddit.com/r/forhire/hot.json?limit=5');const data=await r.json();(data.data?data.data.children||[]:[]).forEach(p=>{const post=p.data;if(!db.leads.some(l=>l.url==='https://reddit.com'+post.permalink)){db.leads.push({id:uid(),source:'reddit',title:post.title,company:'r/forhire',url:'https://reddit.com'+post.permalink,date:today(),lang:'en'});added++;}});save();render();toast(' +'+added);}catch(e){toast('Ошибка Reddit');}}
async function searchAllLeads(){toast('🚀 Ищу...');await searchHH();await new Promise(r=>setTimeout(r,500));await searchHNLeads();await new Promise(r=>setTimeout(r,500));await searchReddit();toast('✅ Найдено: '+db.leads.length);}
function leadToClient(idx){const l=db.leads[idx];if(!l)return;db.clients.push({id:uid(),name:l.company||l.title,company:l.company||'',budget:0,cur:'RUB',status:'Новый',date:today()});save();render();toast('👥 Добавлен!');}
function leadOutreach(idx){const l=db.leads[idx];if(!l)return;const txt='Здравствуйте!\n\nМеня зовут '+db.profile.name+', я '+db.profile.spec+'.\n\nУвидел ваш запрос: "'+l.title+'".\n\nБуду рад обсудить.\n\nС уважением,\n'+db.profile.name;copyText(txt);openModal('<h3>✉️ Скопировано!</h3><textarea rows="8" style="width:100%">'+esc(txt)+'</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="closeModal()">Закрыть</button>');}
function delLead(idx){db.leads.splice(idx,1);save();render();}
function clearLeads(){if(confirm('Удалить все лиды?')){db.leads=[];save();render();}}
function generatePains(){let added=0;(db.profile.specs||[]).forEach(sp=>{(PAIN_DB[sp]||[]).forEach(p=>{if(!db.pains.some(x=>x.pain===p.pain)){db.pains.push({id:uid(),...p,status:'Гипотеза'});added++;}});});save();render();toast(added>0?'✅ +'+added:'⚠️ Все в базе');}

// ===== БАЗА ЗНАНИЙ С РУССКИМИ ИСТОЧНИКАМИ =====
function rKnowledge(){
  let h='<div class="row spread"><h2>📚 База знаний</h2></div>';
  
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>🇷 Русскоязычные источники</b>';
  h+='<input id="searchQuery" placeholder="Поиск: react, node.js, python..." value="'+esc(db.searchQuery||'')+'" style="margin-top:10px">';
  h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
  h+='<button class="btn ai" onclick="searchHabr()" style="flex:1"> Habr</button>';
  h+='<button class="btn warn" onclick="searchVC()" style="flex:1">📰 VC.ru</button>';
  h+='<button class="btn sec" onclick="searchDevToRu()" style="flex:1">📝 Dev.to RU</button>';
  h+='</div>';
  h+='<button class="btn" onclick="searchAllRU()" style="width:100%;margin-top:8px">🚀 Искать на РУССКОМ</button>';
  h+='</div>';
  
  h+='<div class="card"><b>🌐 Англоязычные источники</b>';
  h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
  h+='<button class="btn sec" onclick="searchGitHub()" style="flex:1">🐙 GitHub</button>';
  h+='<button class="btn sec" onclick="searchHN()" style="flex:1"> Hacker News</button>';
  h+='</div>';
  h+='<p class="mut" style="margin-top:8px">💡 Для английских статей есть кнопка "Перевести"</p>';
  h+='</div>';
  
  h+='<div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">';
  (db.profile.specs||[]).forEach(sp=>{h+='<button class="tag" onclick="quickSearch(\''+esc(sp)+'\')">'+esc(sp)+'</button>';});
  h+='</div>';
  
  if(db.savedArticles&&db.savedArticles.length){
    h+='<div class="card"><b>📚 Сохранённые материалы ('+db.savedArticles.length+')</b>';
    h+='<button class="btn danger" style="margin-top:8px" onclick="clearSavedArticles()">🗑 Очистить</button>';
    db.savedArticles.slice(0,20).forEach((a,idx)=>{
      const srcClass=a.source==='habr'?'habr':a.source==='vc'?'vc':a.source==='devto'?'devto':a.source==='github'?'github':'hn';
      const srcName=a.source==='habr'?'📘 Habr':a.source==='vc'?'📰 VC.ru':a.source==='devto'?'📝 Dev.to':a.source==='github'?'🐙 GitHub':'🔶 HN';
      const langChip=a.lang==='ru'?'<span class="chip ru">RU</span>':'<span class="chip en">EN</span>';
      const translateBtn=a.lang==='en'?'<a href="https://translate.google.com/translate?sl=en&tl=ru&u='+encodeURIComponent(a.url)+'" target="_blank" class="translate-link">🌐 Перевести</a>':'';
      h+='<div class="card article-card '+srcClass+'" style="margin-top:10px">';
      h+='<div class="row spread"><b>'+(idx+1)+'. '+esc(a.title)+'</b><div>'+langChip+' <span class="chip warn">'+srcName+'</span></div></div>';
      if(a.author) h+='<div class="mut">👤 '+esc(a.author)+'</div>';
      if(a.stats) h+='<div class="mut">'+esc(a.stats)+'</div>';
      if(a.description) h+='<div class="note" style="margin-top:8px">'+esc(a.description).substring(0,150)+'...</div>';
      h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
      h+='<a href="'+esc(a.url)+'" target="_blank" class="btn sec" style="text-decoration:none">🔗 Открыть</a>';
      if(translateBtn) h+=translateBtn;
      h+='<button class="btn sec" onclick="saveArticleNote('+idx+')">📝 Заметка</button>';
      h+='<button class="btn danger" onclick="delSavedArticle('+idx+')"></button>';
      h+='</div>';
      if(a.note) h+='<div class="note" style="margin-top:8px;background:#1a2035"><b>📝 Моя заметка:</b><br>'+esc(a.note)+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }
  
  h+='<div class="card"><b>📚 Локальная база знаний</b>';
  h+='<button class="btn ai" onclick="addLocalKnowledge()" style="width:100%;margin-bottom:10px">+ Добавить тему</button>';
  if(!db.knowledge.length) h+='<div class="mut">Нет записей</div>';
  db.knowledge.forEach(k=>{
    h+='<div class="note" style="margin-top:8px"><div class="row spread"><b>'+esc(k.topic)+'</b><span class="chip '+(k.status===3?'ok':'on')+'">'+['Не начато','Изучаю','Практика','Освоено'][k.status]+'</span></div>';
    h+='<div class="mut">📁 '+esc(k.dir||'—')+'</div>';
    if(k.theory) h+='<div class="mut"> '+esc(k.theory).substring(0,100)+'</div>';
    h+='<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">';
    for(let i=0;i<4;i++){h+='<button class="btn '+(k.status===i?'ai':'sec')+'" style="padding:6px 10px;font-size:12px" onclick="setKbStatus(\''+k.id+'\','+i+')">'+['Не начато','Изучаю','Практика','Освоено'][i]+'</button>';}
    h+='<button class="btn danger" style="padding:6px 10px" onclick="delKnowledge(\''+k.id+'\')">🗑</button>';
    h+='</div></div>';
  });
  h+='</div>';
  return h;
}

async function searchHabr(){
  const q=db.searchQuery||db.profile.specs[0]||'javascript';
  toast('📘 Ищу на Habr...');
  try{
    const r=await fetch('https://habr.com/api/v1/articles/?q='+encodeURIComponent(q)+'&page=1&per_page=10');
    const data=await r.json();
    let added=0;
    (data.items||[]).forEach(a=>{
      if(!db.savedArticles.some(x=>x.url===a.link)){
        db.savedArticles.push({id:uid(),source:'habr',title:a.title,author:a.author?a.author.login:'',url:'https://habr.com'+a.link,description:a.summary||'',stats:'👁 '+a.stats.views_count+'  '+a.stats.comments_count,date:today(),lang:'ru'});
        added++;
      }
    });
    save();render();toast('📘 Habr: +'+added+' статей');
  }catch(e){toast('Ошибка Habr (возможно CORS)');}
}

async function searchAllRU(){
  db.searchQuery=document.getElementById('searchQuery').value.trim()||db.profile.specs[0]||'javascript';
  toast('🚀 Ищу на русском...');
  await searchHabr();
  await new Promise(r=>setTimeout(r,500));
  await searchVC();
  await new Promise(r=>setTimeout(r,500));
  await searchDevToRu();
  toast('✅ Найдено: '+(db.savedArticles?db.savedArticles.length:0)+' материалов');

function quickSearch(q){db.searchQuery=q;document.getElementById('searchQuery').value=q;searchAllRU();}
function delSavedArticle(idx){db.savedArticles.splice(idx,1);save();render();}
function clearSavedArticles(){if(confirm('Удалить все сохранённые статьи?')){db.savedArticles=[];save();render();}}
function saveArticleNote(idx){const note=prompt('Ваша заметка к статье:');if(note!==null){db.savedArticles[idx].note=note;save();render();toast('Заметка сохранена');}}

function addLocalKnowledge(){openModal('<h3>Новая тема</h3><label>Тема *</label><input id="kb_topic"><label>Категория</label><input id="kb_dir"><label>Теория</label><textarea id="kb_theory" rows="3"></textarea><label>Практика</label><textarea id="kb_practice" rows="3"></textarea><div class="row"><button class="btn" onclick="saveKnowledge()">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button></div>');}
function saveKnowledge(){const topic=document.getElementById('kb_topic').value.trim();if(!topic){toast('Тема?');return;}db.knowledge.push({id:uid(),topic:topic,dir:document.getElementById('kb_dir').value.trim(),theory:document.getElementById('kb_theory').value.trim(),practice:document.getElementById('kb_practice').value.trim(),status:0});save();closeModal();render();toast('Тема добавлена');}
function setKbStatus(id,status){const k=db.knowledge.find(x=>x.id===id);if(k){k.status=status;save();render();}}
function delKnowledge(id){if(confirm('Удалить?')){db.knowledge=db.knowledge.filter(k=>k.id!==id);save();render();}}

// ===== ОСТАЛЬНЫЕ ВКЛАДКИ =====
function rClients(){let h='<div class="row spread"><h2> Клиенты</h2><button class="btn" onclick="addClient()">+ Лид</button></div>';db.clients.forEach(c=>{h+='<div class="card"><div class="row spread"><b>'+esc(c.name)+'</b><span class="chip on">'+c.status+'</span></div><div class="mut">'+esc(c.company)+' · '+c.budget+' '+c.cur+'</div></div>';});return h;}
function addClient(){const n=prompt('Имя:');if(!n)return;db.clients.push({id:uid(),name:n,company:prompt('Компания:')||'',budget:+prompt('Бюджет:')||0,cur:'RUB',status:'Новый',date:today()});save();render();}
function rProjects(){let h='<div class="row spread"><h2>📁 Проекты</h2><button class="btn" onclick="addProject()">+ Проект</button></div>';db.projects.forEach(p=>{h+='<div class="card"><div class="row spread"><b>'+esc(p.name)+'</b><span class="chip on">'+STAGES[p.stage]+'</span></div><div class="mut">'+esc(p.client||'—')+' · '+p.budget+' '+p.cur+'</div></div>';});return h;}
function addProject(){const n=prompt('Название:');if(!n)return;db.projects.push({id:uid(),name:n,client:prompt('Клиент:')||'',budget:+prompt('Бюджет:')||0,cur:'RUB',stage:0,date:today()});save();render();}
function rCalendar(){return '<div class="row spread"><h2>📅 Календарь</h2></div><div class="card mut">Календарь дедлайнов</div>';}
function rDiary(){let h='<div class="row spread"><h2>📝 Дневник</h2><button class="btn" onclick="addDiary()">+ Запись</button></div>';db.diary.slice().reverse().slice(0,10).forEach(e=>{h+='<div class="note" style="margin-top:8px"><b>'+e.date+' '+e.time+'</b><div>'+esc(e.text)+'</div></div>';});return h;}
function addDiary(){const text=prompt('Что сделали?');if(!text)return;db.diary.push({id:uid(),date:today(),time:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),text:text});save();render();}
function rHabits(){let h='<div class="row spread"><h2>✅ Привычки</h2><button class="btn" onclick="addHabit()">+ Привычка</button></div>';const todayStr=today();db.habits.forEach(hab=>{const done=hab.history&&hab.history[todayStr];h+='<div class="card row spread"><div class="row" style="gap:10px"><span style="font-size:24px">'+hab.icon+'</span><span>'+esc(hab.name)+'</span></div><button class="btn '+(done?'ok':'sec')+'" onclick="toggleHabit(\''+hab.id+'\')">'+(done?'✓':'Отметить')+'</button></div>';});return h;}
function addHabit(){const name=prompt('Название:');if(!name)return;db.habits.push({id:uid(),name:name,icon:'✅',streak:0,history:{}});save();render();}
function toggleHabit(id){const h=db.habits.find(x=>x.id===id);if(!h)return;if(!h.history)h.history={};const todayStr=today();if(h.history[todayStr]){delete h.history[todayStr];}else{h.history[todayStr]=true;h.streak++;}save();render();}
function rFinances(){let h='<div class="row spread"><h2>💰 Финансы</h2><button class="btn" onclick="addFin()">+ Операция</button></div>';db.finances.forEach(f=>{h+='<div class="card row spread"><div><b class="'+(f.type==='in'?'plus':'minus')+'">'+(f.type==='in'?'+':'-')+' '+f.amt+' '+f.cur+'</b><div class="mut">'+f.cat+'</div></div></div>';});return h;}
function addFin(){const a=+prompt('Сумма:');if(!a)return;db.finances.unshift({id:uid(),date:today(),type:prompt('Тип (in/out):','in'),amt:a,cur:'RUB',cat:'Проект'});save();render();}
function rTime(){const mode=TIMER_MODES[db.timerMode||0];return '<div class="row spread"><h2>⏱ Время</h2></div><div class="card" style="text-align:center"><div style="font-size:48px;font-weight:bold;color:var(--acc)" id="timer">'+formatTime(mode.work*60)+'</div><div class="mut">'+mode.name+'</div><div class="row" style="justify-content:center;margin-top:15px;gap:8px"><button class="btn" onclick="startT()">▶ Старт</button><button class="btn sec" onclick="resetT()">Сброс</button></div></div><div class="card"><b>Режимы</b>'+TIMER_MODES.map((m,i)=>'<div class="row spread" style="margin:8px 0"><span>'+m.name+'</span><button class="btn '+(db.timerMode===i?'ai':'sec')+'" onclick="setTimerMode('+i+')">Выбрать</button></div>').join('')+'</div>';}
function formatTime(sec){const m=Math.floor(sec/60).toString().padStart(2,'0'),s=(sec%60).toString().padStart(2,'0');return m+':'+s;}
let tInt,tSec,tMode='focus';
function startT(){if(tInt)return;const mode=TIMER_MODES[db.timerMode||0];tSec=mode.work*60;tInt=setInterval(()=>{tSec--;const el=document.getElementById('timer');if(el)el.textContent=formatTime(tSec);if(tSec<=0){clearInterval(tInt);tInt=null;toast('Время вышло!');}},1000);}
function resetT(){clearInterval(tInt);tInt=null;const el=document.getElementById('timer');if(el)el.textContent=formatTime(TIMER_MODES[db.timerMode||0].work*60);}
function setTimerMode(i){db.timerMode=i;save();render();}
function rGrowth(){let h='<div class="row spread"><h2> Рост</h2></div><div class="card"><b>💪 Навыки</b>';db.skills.forEach(s=>{h+='<div style="margin:10px 0"><div class="row spread"><span>'+esc(s.n)+'</span><span class="mut">'+['Новичок','Базово','Уверенно','Профи','Эксперт'][s.l-1]+'</span></div><div class="bar"><i style="width:'+(s.l*20)+'%"></i></div></div>';});h+='</div>';return h;}
function rSettings(){return '<div class="row spread"><h2>⚙️ Настройки</h2></div><div class="card"><b>👤 Профиль</b><label>Имя</label><input value="'+esc(db.profile.name)+'" onchange="db.profile.name=this.value;save()"><label>Специализация</label><input value="'+esc(db.profile.spec)+'" onchange="db.profile.spec=this.value;save()"></div><div class="card"><b>🎨 Тема</b><button class="btn sec" onclick="document.body.classList.toggle(\'light-theme\');localStorage.setItem(\'theme\',document.body.classList.contains(\'light-theme\')?\'light\':\'dark\')" style="width:100%">🌓 Переключить тему</button></div><div class="card"><b>🔄 Сброс</b><button class="btn danger" onclick="hardReset()" style="width:100%">🔄 Сбросить кэш</button></div>';}
function hardReset(){if(confirm("️ Удалить кэш?")){if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if("caches"in window)caches.keys().then(n=>n.forEach(k=>caches.delete(k)));window.location.href=window.location.pathname+"?v="+Date.now();}}

function render(){
  document.getElementById('date').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const app=document.getElementById('app');
  switch(tab){
    case 'home':app.innerHTML=rHome();break;case 'radar':app.innerHTML=rRadar();break;case 'clients':app.innerHTML=rClients();break;
    case 'projects':app.innerHTML=rProjects();break;case 'calendar':app.innerHTML=rCalendar();break;case 'diary':app.innerHTML=rDiary();break;
    case 'habits':app.innerHTML=rHabits();break;case 'finances':app.innerHTML=rFinances();break;case 'time':app.innerHTML=rTime();break;
    case 'growth':app.innerHTML=rGrowth();break;case 'knowledge':app.innerHTML=rKnowledge();break;case 'settings':app.innerHTML=rSettings();break;
  }
}

window.onload=()=>{
  try{
    if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');
    setTimeout(()=>{document.getElementById('splash').classList.add('hidden');setTimeout(()=>{document.getElementById('splash').style.display='none';},500);renderNav();render();},1500);
  }catch(e){console.error('Ошибка:',e);document.getElementById('splash').classList.add('hidden');}
};
</script>
