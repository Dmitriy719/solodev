<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloDev v3.0</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--ok:#3ecf8e;--bad:#ff6b6b;--line:#242b36}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;z-index:10}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;padding:8px;overflow-x:auto;z-index:20}
nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:60px;background:var(--card2);border:none;border-radius:10px;padding:8px 4px;color:var(--mut);font-size:11px;cursor:pointer}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-btn small{display:block;margin-top:2px;font-size:10px}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}.stat b{font-size:20px}
.mut{color:var(--mut);font-size:13px}.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:10px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.spread{justify-content:space-between}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;margin:4px 0 10px}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#splash.hidden{display:none}
.error-box{position:fixed;inset:0;background:#200;color:#f88;padding:20px;font-family:monospace;z-index:200;overflow:auto}
</style>
</head>
<body>
<div id="splash"><h1 style="font-size:48px;margin-bottom:20px">⚡</h1><h1>SoloDev v3.0</h1><p class="mut">Загрузка...</p></div>
<header><b>⚡ SoloDev v3.0</b><span id="date"></span></header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
// Перехват ошибок, чтобы приложение не зависало молча
window.onerror = function(msg, url, line) {
    document.getElementById('splash').classList.add('hidden');
    document.body.innerHTML = '<div class="error-box"><h2>⚠️ Ошибка в коде:</h2><p>' + msg + '</p><p>Строка: ' + line + '</p><button class="btn" onclick="location.reload()">Перезагрузить</button></div>';
    return true;
};

const KEY = 'solodev_v3';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function seed() {
    return {
        profile: { name: 'Дмитрий', spec: 'Fullstack разработчик' },
        clients: [{ id: uid(), name: 'Алексей', company: 'TechStart', budget: 45000, status: 'В работе' }],
        projects: [{ id: uid(), name: 'Интернет-магазин', client: 'Алексей', budget: 45000, stage: 'В работе', tasks: [] }],
        finances: [{ id: uid(), date: today(), type: 'in', amt: 30000, cat: 'Проект' }]
    };
}

let db;
try {
    const loaded = localStorage.getItem(KEY);
    db = loaded ? JSON.parse(loaded) : seed();
} catch (e) {
    db = seed();
}

function save() { localStorage.setItem(KEY, JSON.stringify(db)); }

const TABS = [
    { id: 'home', icon: '🏠', label: 'Главная' },
    { id: 'clients', icon: '👥', label: 'Клиенты' },
    { id: 'projects', icon: '📁', label: 'Проекты' },
    { id: 'finances', icon: '💰', label: 'Финансы' },
    { id: 'settings', icon: '⚙️', label: 'Настройки' }
];
let tab = 'home';

function renderNav() {
    document.getElementById('nav').innerHTML = TABS.map(t => 
        '<button class="nav-btn ' + (t.id === tab ? 'active' : '') + '" onclick="go(\'' + t.id + '\')">' + t.icon + '<br><small>' + t.label + '</small></button>'
    ).join('');
}

function go(id) { tab = id; renderNav(); render(); window.scrollTo(0, 0); }
function toast(msg) { 
    const t = document.createElement('div'); 
    t.style.cssText = 'position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:24px;font-size:14px;z-index:50';
    t.textContent = msg; 
    document.body.appendChild(t); 
    setTimeout(() => t.remove(), 2000); 
}

function rHome() {
    const inc = db.finances.filter(f => f.type === 'in').reduce((s, f) => s + f.amt, 0);
    return '<div class="note" style="background:linear-gradient(135deg,var(--acc),#9d6cff);color:#fff;padding:20px;margin-bottom:20px"><div style="font-size:24px">Привет, ' + esc(db.profile.name) + '! 👋</div><div style="opacity:.9">' + esc(db.profile.spec) + '</div></div>' +
    '<div class="grid">' +
    '<div class="card stat"><span>Доход</span><b class="plus">' + inc.toLocaleString() + ' ₽</b></div>' +
    '<div class="card stat"><span>Клиентов</span><b>' + db.clients.length + '</b></div>' +
    '<div class="card stat"><span>Проектов</span><b>' + db.projects.length + '</b></div>' +
    '<div class="card stat"><span>Операций</span><b>' + db.finances.length + '</b></div>' +
    '</div>';
}

function rClients() {
    let h = '<div class="row spread"><h2>👥 Клиенты</h2><button class="btn" onclick="addClient()">+ Клиент</button></div>';
    if (!db.clients.length) h += '<div class="card mut">Нет клиентов</div>';
    db.clients.forEach(c => {
        h += '<div class="card"><div class="row spread"><b>' + esc(c.name) + '</b><span class="chip on">' + c.status + '</span></div><div class="mut">' + esc(c.company) + ' · ' + c.budget + ' ₽</div><button class="btn danger" style="margin-top:8px" onclick="delClient(\'' + c.id + '\')">🗑 Удалить</button></div>';
    });
    return h;
}
function addClient() {
    const n = prompt('Имя клиента:'); if (!n) return;
    db.clients.push({ id: uid(), name: n, company: prompt('Компания:') || '', budget: +(prompt('Бюджет:') || 0), status: 'Новый' });
    save(); render(); toast('Клиент добавлен');
}
function delClient(id) {
    if (confirm('Удалить клиента?')) { db.clients = db.clients.filter(c => c.id !== id); save(); render(); }
}

function rProjects() {
    let h = '<div class="row spread"><h2>📁 Проекты</h2><button class="btn" onclick="addProject()">+ Проект</button></div>';
    if (!db.projects.length) h += '<div class="card mut">Нет проектов</div>';
    db.projects.forEach(p => {
        h += '<div class="card"><div class="row spread"><b>' + esc(p.name) + '</b><span class="chip on">' + p.stage + '</span></div><div class="mut">' + esc(p.client) + ' · ' + p.budget + ' ₽</div><button class="btn danger" style="margin-top:8px" onclick="delProject(\'' + p.id + '\')">🗑 Удалить</button></div>';
    });
    return h;
}
function addProject() {
    const n = prompt('Название проекта:'); if (!n) return;
    db.projects.push({ id: uid(), name: n, client: prompt('Клиент:') || '', budget: +(prompt('Бюджет:') || 0), stage: 'В работе', tasks: [] });
    save(); render(); toast('Проект создан');
}
function delProject(id) {
    if (confirm('Удалить проект?')) { db.projects = db.projects.filter(p => p.id !== id); save(); render(); }
}

function rFinances() {
    let h = '<div class="row spread"><h2>💰 Финансы</h2><button class="btn" onclick="addFin()">+ Операция</button></div>';
    db.finances.forEach(f => {
        h += '<div class="card row spread"><div><b class="' + (f.type === 'in' ? 'plus' : 'minus') + '">' + (f.type === 'in' ? '+' : '-') + ' ' + f.amt + ' ₽</b><div class="mut">' + f.date + ' · ' + f.cat + '</div></div></div>';
    });
    return h;
}
function addFin() {
    const amt = +(prompt('Сумма:')); if (!amt) return;
    db.finances.unshift({ id: uid(), date: today(), type: prompt('Тип (in/out):', 'in'), amt: amt, cat: 'Проект' });
    save(); render(); toast('Операция добавлена');
}

function rSettings() {
    return '<div class="row spread"><h2>⚙️ Настройки</h2></div>' +
    '<div class="card"><b>👤 Профиль</b>' +
    '<label>Имя</label><input value="' + esc(db.profile.name) + '" onchange="db.profile.name=this.value;save()">' +
    '<label>Специализация</label><input value="' + esc(db.profile.spec) + '" onchange="db.profile.spec=this.value;save()">' +
    '</div>' +
    '<div class="card"><button class="btn danger" onclick="hardReset()" style="width:100%">🔄 Сбросить все данные</button></div>';
}
function hardReset() {
    if (confirm('⚠️ Удалить ВСЕ данные? Это действие необратимо.')) {
        localStorage.removeItem(KEY);
        location.reload();
    }
}

function render() {
    document.getElementById('date').textContent = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    const app = document.getElementById('app');
    if (tab === 'home') app.innerHTML = rHome();
    else if (tab === 'clients') app.innerHTML = rClients();
    else if (tab === 'projects') app.innerHTML = rProjects();
    else if (tab === 'finances') app.innerHTML = rFinances();
    else if (tab === 'settings') app.innerHTML = rSettings();
}

window.onload = () => {
    setTimeout(() => {
        document.getElementById('splash').classList.add('hidden');
        renderNav();
        render();
    }, 800);
};
</script>
</body>
</html>
