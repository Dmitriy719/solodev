<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloDev v2.0</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#ffb454;--line:#242b36}
body.light-theme{--bg:#f4f6f8;--card:#fff;--card2:#e9ecef;--txt:#212529;--mut:#6c757d;--line:#dee2e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;z-index:10}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;padding:8px;overflow-x:auto;z-index:20}
.nav-btn{flex:1;min-width:60px;background:var(--card2);border:none;border-radius:10px;padding:8px 4px;color:var(--mut);font-size:11px;cursor:pointer}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-btn small{display:block;margin-top:2px;font-size:10px}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}.stat b{font-size:20px}
.mut{color:var(--mut);font-size:13px}.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:10px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.spread{justify-content:space-between}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.ai{background:linear-gradient(90deg,var(--acc),#9d6cff)}
.btn.warn{background:var(--warn);color:#000}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;margin:4px 0 10px}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.chip.ok{background:var(--ok);color:#fff}
.chip.warn{background:var(--warn);color:#000}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#splash.hidden{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:24px;font-size:14px;z-index:50}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
#modal.on{display:flex}.m-card{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@keyframes load{0%{width:0%}100%{width:100%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.stage{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;margin:2px}
.stage-0{background:#3a4a7a;color:#fff}.stage-1{background:var(--acc);color:#fff}
.stage-2{background:var(--warn);color:#000}.stage-3{background:var(--ok);color:#fff}
.lead-card{border-left:3px solid var(--acc);padding-left:12px}
.lead-card.hh{border-left-color:#d6001c}
.lead-card.hn{border-left-color:#ff6600}
.lead-card.reddit{border-left-color:#ff4500}
</style>
</head>
<body>
<div id="splash">
  <h1 style="font-size:48px;margin-bottom:20px;animation:pulse 1.5s ease infinite"></h1>
  <h1>SoloDev v2.0</h1>
  <p class="mut">Загрузка приложения...</p>
  <div class="bar" style="width:200px;margin-top:20px"><i style="width:0%;animation:load 2s ease forwards"></i></div>
</div>
<header><b>⚡ SoloDev v2.0</b><span id="date"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="m-card" id="mcard"></div></div>
<script>
const KEY='solodev_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const STAGES=['Идея','В работе','Тестирование','Завершён'];
const KB_STATUS=['Не начато','Изучаю','Практика','Освоено'];
const TIMER_MODES=[{work:25,break:5,name:'25/5 Классика'},{work:50,break:10,name:'50/10 Глубокая'},{work:90,break:20,name:'90/20 Ультрадиан'}];

const PAIN_DB={
  'Фронтенд':[
    {seg:'Владельцы интернет-магазинов',pain:'Сайт медленно загружается',sol:'Оптимизация скорости и Core Web Vitals',demand:5},
    {seg:'Стартапы без сайта',pain:'Нет современного сайта',sol:'Лендинг за 1-2 недели',demand:4},
    {seg:'Малый бизнес',pain:'Сайт не работает на мобильных',sol:'Адаптивная вёрстка',demand:5},
    {seg:'Блогеры',pain:'Сложно обновлять контент',sol:'CMS с простым редактором',demand:3}
  ],
  'Бэкенд':[
    {seg:'Стартапы',pain:'Нужен быстрый API',sol:'REST API на Node.js/Python',demand:5},
    {seg:'Интернет-магазины',pain:'Медленная обработка заказов',sol:'Оптимизация базы данных',demand:4},
    {seg:'SaaS-проекты',pain:'Проблемы с масштабируемостью',sol:'Микросервисная архитектура',demand:5}
  ],
  'Боты':[
    {seg:'Владельцы Telegram-каналов',pain:'Много однотипных вопросов',sol:'Бот с FAQ и автоответами',demand:5},
    {seg:'Онлайн-школы',pain:'Ручная проверка домашних заданий',sol:'Бот с автоматической проверкой',demand:4},
    {seg:'Рестораны',pain:'Много звонков для бронирования',sol:'Бот для бронирования столов',demand:4}
  ]
};

function seed(){return{
  profile:{name:'Дмитрий',spec:'Fullstack разработчик',currency:'RUB',rates:{BYN:30,CNY:11.5,USD:90},specs:['Фронтенд','Бэкенд','Боты']},
  clients:[{id:uid(),name:'Алексей',company:'TechStart',budget:45000,cur:'RUB',status:'В работе',date:today()}],
  projects:[{id:uid(),name:'Интернет-магазин',client:'Алексей',budget:45000,cur:'RUB',stage:1,deadline:'2026-09-01',tasks:[{id:uid(),text:'Сверстать главную',done:false},{id:uid(),text:'Настроить оплату',done:true}],date:today()}],
  finances:[{id:uid(),date:today(),type:'in',amt:30000,cur:'RUB',cat:'Проект'}],
  pains:[],
  skills:[{n:'JavaScript',l:4},{n:'React',l:3}],
  goals:[{t:'Изучить TypeScript',done:false}],
  knowledge:[{id:uid(),dir:'Фронтенд',topic:'React Hooks',theory:'useEffect, useState, useContext',practice:'Создать кастомный хук',status:1,resources:'react.dev'}],
  prices:[{id:uid(),name:'Лендинг',price:25000,cur:'RUB',unit:'проект'}],
  tasks:[{id:uid(),text:'Сверстать главную',done:false,date:today()}],
  templates:[],
  outreachStats:{sent:0,replied:0,converted:0},
  timerMode:0,
  leads:[]
}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let db=(()=>{const s=seed(),l=load();return l?{...s,...l}:s})();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}

const TABS=[{id:'home',icon:'🏠',label:'Главная'},{id:'radar',icon:'🎯',label:'Радар'},{id:'clients',icon:'👥',label:'Клиенты'},{id:'projects',icon:'📁',label:'Проекты'},{id:'finances',icon:'💰',label:'Финансы'},{id:'price',icon:'💵',label:'Прайс'},{id:'time',icon:'',label:'Время'},{id:'plan',icon:'📅',label:'План'},{id:'growth',icon:'🎯',label:'Рост'},{id:'lawyer',icon:'⚖️',label:'Юрист'},{id:'settings',icon:'⚙️',label:'Настройки'}];
let tab='home';

function renderNav(){document.getElementById('nav').innerHTML=TABS.map(t=>'<button class="nav-btn '+(t.id===tab?'active':'')+'" onclick="go(\''+t.id+'\')">'+t.icon+'<br><small>'+t.label+'</small></button>').join('');}
function go(id){tab=id;renderNav();render();window.scrollTo(0,0)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function openModal(h){document.getElementById('mcard').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('Скопировано!')).catch(()=>toast('Ошибка копирования'))}

// ===== РАДАР С АГРЕГАТОРОМ ЛИДОВ =====
function rRadar(){
  let h='<div class="row spread"><h2>🎯 Радар</h2><button class="btn" onclick="generatePains()">+ Шаблоны</button></div>';
  
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><b>🌐 АВТОПОИСК в интернете</b>';
  h+='<p class="mut">Ищет реальные вакансии и запросы на HH.ru, Hacker News и Reddit</p>';
  h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
  h+='<button class="btn ai" onclick="searchHH()" style="flex:1">🇺 HH.ru</button>';
  h+='<button class="btn warn" onclick="searchHN()" style="flex:1">🔶 Hacker News</button>';
  h+='<button class="btn sec" onclick="searchReddit()" style="flex:1">🔴 Reddit</button>';
  h+='</div>';
  h+='<button class="btn" onclick="searchAll()" style="width:100%;margin-top:8px">🚀 Искать ВЕЗДЕ сразу</button>';
  h+='</div>';
  
  if(db.leads&&db.leads.length){
    h+='<div class="card"><b>🎯 Найдено лидов: '+db.leads.length+'</b>';
    h+='<button class="btn danger" style="margin-top:8px" onclick="clearLeads()">🗑 Очистить все</button>';
    db.leads.forEach((l,idx)=>{
      const srcClass=l.source==='hh'?'hh':l.source==='hn'?'hn':'reddit';
      const srcName=l.source==='hh'?'🇷🇺 HH.ru':l.source==='hn'?' HN':'🔴 Reddit';
      h+='<div class="card lead-card '+srcClass+'" style="margin-top:10px">';
      h+='<div class="row spread"><b>'+(idx+1)+'. '+esc(l.title)+'</b><span class="chip warn">'+srcName+'</span></div>';
      if(l.company) h+='<div class="mut">🏢 '+esc(l.company)+'</div>';
      if(l.salary) h+='<div class="plus">💰 '+esc(l.salary)+'</div>';
      if(l.description) h+='<div class="note" style="margin-top:8px">'+esc(l.description).substring(0,200)+'...</div>';
      if(l.url) h+='<div class="mut"><a href="'+esc(l.url)+'" target="_blank" style="color:var(--acc)">🔗 Открыть оригинал</a></div>';
      h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
      h+='<button class="btn sec" onclick="leadToClient('+idx+')">👥 В клиенты</button>';
      h+='<button class="btn sec" onclick="leadOutreach('+idx+')">✍️ Написать</button>';
      h+='<button class="btn danger" onclick="delLead('+idx+')">🗑</button>';
      h+='</div></div>';
    });
    h+='</div>';
  }
  
  h+='<div class="card" style="background:#1a2035;border-color:#3a4a7a"><b>🤖 Шаблоны болей</b>';
  h+='<p class="mut">Специализации: '+(db.profile.specs.join(', ')||'не выбраны')+'</p>';
  h+='<p class="mut">Найдено: <b>'+db.pains.length+'</b> | Отправлено: <b>'+(db.outreachStats?db.outreachStats.sent:0)+'</b></p>';
  h+='<button class="btn ai" onclick="generatePains()" style="width:100%;margin-bottom:8px">🎯 Сгенерировать шаблоны</button>';
  h+='<button class="btn sec" onclick="generateAllPains()" style="width:100%">🚀 АВТОПОИСК по всем специализациям</button></div>';
  
  if(db.pains&&db.pains.length){
    h+='<div class="row" style="margin:10px 0;gap:8px"><button class="btn sec" onclick="copyAllOutreach()"> Все письма</button><button class="btn danger" onclick="clearAllPains()">🗑 Очистить</button></div>';
    db.pains.forEach((p,idx)=>{
      h+='<div class="card"><div class="row spread"><b>'+(idx+1)+'. '+esc(p.seg)+'</b><span class="chip on">'+'★'.repeat(p.demand)+'</span></div>';
      h+='<div class="mut" style="margin-top:5px">'+esc(p.pain)+'</div>';
      h+='<div class="note" style="margin-top:8px">💡 '+esc(p.sol)+'</div>';
      h+='<div class="row" style="margin-top:10px;gap:8px">';
      h+='<button class="btn sec" onclick="genOutreach(\''+esc(p.pain)+'\',\''+esc(p.sol)+'\',\''+esc(p.seg)+'\')">✍️ Написать</button>';
      h+='<button class="btn danger" onclick="delPain(\''+p.id+'\')">🗑</button></div></div>';
    });
  }
  return h;
}

// АГРЕГАТОР ЛИДОВ - РЕАЛЬНЫЙ ПОИСК
async function searchHH(){
  toast('🔍 Ищу на HH.ru...');
  const queries=db.profile.specs.length?db.profile.specs:['разработчик'];
  let found=0;
  for(const q of queries){
    try{
      const r=await fetch('https://api.hh.ru/vacancies?text='+encodeURIComponent(q)+'&per_page=5&area=1&order_by=publication_time');
      if(!r.ok)continue;
      const data=await r.json();
      (data.items||[]).forEach(v=>{
        if(!db.leads.some(l=>l.url===v.alternate_url)){
          db.leads.push({
            id:uid(),source:'hh',title:v.name,company:v.employer?v.employer.name:'',
            salary:v.salary?(v.salary.from?v.salary.from+'':v.salary.to?v.salary.to+'':'')+(' '+(v.salary.currency||'RUB')):'',
            description:v.snippet?v.snippet.requirement||v.snippet.description||'':'',
            url:v.alternate_url,date:today()
          });
          found++;
        }
      });
    }catch(e){console.error('HH error:',e);}
  }
  save();render();toast('🇷 HH.ru: найдено '+found+' вакансий');
}

async function searchHN(){
  toast('🔍 Ищу на Hacker News...');
  let found=0;
  try{
    const r=await fetch('https://hn.algolia.com/api/v1/search?query=hiring+developer&tags=story&hitsPerPage=10');
    const data=await r.json();
    (data.hits||[]).forEach(h=>{
      if(!db.leads.some(l=>l.url===h.url||l.title===h.title)){
        db.leads.push({
          id:uid(),source:'hn',title:h.title,company:h.author||'',
          salary:'',description:h._highlightResult?h._highlightResult.comment_text?h._highlightResult.comment_text.value:''':'',
          url:h.url||'https://news.ycombinator.com/item?id='+h.object_id,date:today()
        });
        found++;
      }
    });
  }catch(e){console.error('HN error:',e);}
  save();render();toast('🔶 Hacker News: найдено '+found+' постов');
}

async function searchReddit(){
  toast(' Ищу на Reddit...');
  let found=0;
  const subs=['forhire','freelance_forhire','hireawebdeveloper'];
  for(const s of subs){
    try{
      const r=await fetch('https://www.reddit.com/r/'+s+'/hot.json?limit=5');
      const data=await r.json();
      (data.data?data.data.children||[]:[]).forEach(p=>{
        const post=p.data;
        if(!db.leads.some(l=>l.url==='https://reddit.com'+post.permalink)){
          db.leads.push({
            id:uid(),source:'reddit',title:post.title,company:'r/'+s,
            salary:'',description:post.selftext?post.selftext.substring(0,300):'',
            url:'https://reddit.com'+post.permalink,date:today()
          });
          found++;
        }
      });
    }catch(e){console.error('Reddit error:',e);}
  }
  save();render();toast('🔴 Reddit: найдено '+found+' постов');
}

async function searchAll(){
  toast('🚀 Ищу везде...');
  await searchHH();
  await new Promise(r=>setTimeout(r,500));
  await searchHN();
  await new Promise(r=>setTimeout(r,500));
  await searchReddit();
  toast('✅ Поиск завершён! Найдено: '+db.leads.length+' лидов');
}

function leadToClient(idx){
  const l=db.leads[idx];
  if(!l)return;
  db.clients.push({id:uid(),name:l.company||l.title,company:l.company||'',budget:0,cur:'RUB',status:'Новый',date:today(),source:l.source,url:l.url});
  db.outreachStats=db.outreachStats||{sent:0,replied:0,converted:0};
  db.outreachStats.converted++;
  save();render();toast(' Добавлен в клиенты!');
}

function leadOutreach(idx){
  const l=db.leads[idx];
  if(!l)return;
  const txt='Здравствуйте!\n\nМеня зовут '+db.profile.name+', я '+db.profile.spec+'.\n\nУвидел ваш запрос: "'+l.title+'".\n\nЯ как раз специализируюсь на таких задачах. Буду рад обсудить детали.\n\nС уважением,\n'+db.profile.name;
  copyText(txt);
  db.outreachStats=db.outreachStats||{sent:0,replied:0,converted:0};
  db.outreachStats.sent++;
  save();
  openModal('<h3>✉️ Письмо скопировано!</h3><textarea id="outText" rows="10" style="width:100%">'+esc(txt)+'</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="copyText(document.getElementById(\'outText\').value);closeModal()"> Копировать снова</button>');
}

function delLead(idx){db.leads.splice(idx,1);save();render();}
function clearLeads(){if(confirm('Удалить все найденные лиды?')){db.leads=[];save();render();}}

function generatePains(){
  let added=0;
  (db.profile.specs||[]).forEach(sp=>{(PAIN_DB[sp]||[]).forEach(p=>{if(!db.pains.some(x=>x.pain===p.pain)){db.pains.push({id:uid(),...p,status:'Гипотеза'});added++;}});});
  save();render();toast(added>0?'✅ Добавлено '+added+' клиентов!':'⚠️ Все уже в базе');
}

function generateAllPains(){
  let added=0;
  Object.keys(PAIN_DB).forEach(sp=>{PAIN_DB[sp].forEach(p=>{if(!db.pains.some(x=>x.pain===p.pain)){db.pains.push({id:uid(),...p,status:'Гипотеза'});added++;}});});
  save();render();toast('🚀 Найдено '+added+' новых клиентов!');
}

function delPain(id){if(confirm('Удалить?')){db.pains=db.pains.filter(p=>p.id!==id);save();render();}}
function clearAllPains(){if(confirm('Удалить ВСЕХ?')){db.pains=[];save();render();toast('Очищено');}}

function genOutreach(pain,sol,seg){
  const txt='Здравствуйте!\n\nМеня зовут '+db.profile.name+', я '+db.profile.spec+'.\n\nВижу, что для "'+seg+'" актуально: "'+pain+'".\nЯ решаю такие задачи: '+sol+'.\n\nНайдётся 5 минут обсудить?\n\nС уважением,\n'+db.profile.name;
  copyText(txt);
  db.outreachStats=db.outreachStats||{sent:0,replied:0,converted:0};
  db.outreachStats.sent++;
  save();
  openModal('<h3>✉️ Письмо скопировано!</h3><textarea id="outText" rows="10" style="width:100%">'+esc(txt)+'</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="copyText(document.getElementById(\'outText\').value);closeModal()">📋 Копировать снова</button>');
}

function copyAllOutreach(){
  if(!db.pains.length){toast('Нет клиентов');return;}
  let allText='';
  db.pains.forEach((p,idx)=>{allText+='=== ПИСЬМО '+(idx+1)+' ===\nКому: '+p.seg+'\nЗдравствуйте!\n\nМеня зовут '+db.profile.name+', я '+db.profile.spec+'.\n\nВижу, что для "'+p.seg+'" актуально: "'+p.pain+'".\nЯ решаю такие задачи: '+p.sol+'.\n\nНайдётся 5 минут обсудить?\n\nС уважением,\n'+db.profile.name+'\n\n\n';});
  copyText(allText);
  db.outreachStats=db.outreachStats||{sent:0,replied:0,converted:0};
  db.outreachStats.sent+=db.pains.length;
  save();toast('📋 Скопировано '+db.pains.length+' писем!');
}

// ===== ПРОЕКТЫ =====
function rProjects(){
  let h='<div class="row spread"><h2> Проекты</h2><button class="btn" onclick="addProject()">+ Проект</button></div>';
  if(!db.projects.length) h+='<div class="card mut">Нет проектов</div>';
  db.projects.forEach(p=>{
    const doneTasks=p.tasks?p.tasks.filter(t=>t.done).length:0;
    const totalTasks=p.tasks?p.tasks.length:0;
    const progress=totalTasks?Math.round(doneTasks/totalTasks*100):0;
    h+='<div class="card">';
    h+='<div class="row spread"><b>'+esc(p.name)+'</b><span class="stage stage-'+p.stage+'">'+STAGES[p.stage]+'</span></div>';
    h+='<div class="mut">'+esc(p.client||'—')+' · '+p.budget.toLocaleString()+' '+p.cur+'</div>';
    if(p.deadline) h+='<div class="mut">Дедлайн: '+p.deadline+'</div>';
    h+='<div class="bar" style="margin:10px 0"><i style="width:'+progress+'%"></i></div>';
    h+='<div class="mut">Задачи: '+doneTasks+'/'+totalTasks+' ('+progress+'%)</div>';
    h+='<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">';
    if(p.stage<3) h+='<button class="btn sec" onclick="nextStage(\''+p.id+'\')">Следующий этап →</button>';
    h+='<button class="btn sec" onclick="showProjectTasks(\''+p.id+'\')">📋 Задачи</button>';
    h+='<button class="btn danger" onclick="delProject(\''+p.id+'\')">🗑</button>';
    h+='</div></div>';
  });
  return h;
}

function addProject(){
  openModal('<h3>Новый проект</h3>'+
    '<label>Название</label><input id="pj_name">'+
    '<label>Клиент</label><input id="pj_client">'+
    '<label>Бюджет</label><input type="number" id="pj_budget" value="0">'+
    '<label>Валюта</label><select id="pj_cur"><option>RUB</option><option>USD</option><option>BYN</option><option>CNY</option></select>'+
    '<label>Дедлайн</label><input type="date" id="pj_deadline">'+
    '<div class="row"><button class="btn" onclick="saveProject()">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button></div>');
}

function saveProject(){
  const name=document.getElementById('pj_name').value.trim();
  if(!name){toast('Укажите название');return;}
  db.projects.push({id:uid(),name:name,client:document.getElementById('pj_client').value.trim(),budget:+document.getElementById('pj_budget').value||0,cur:document.getElementById('pj_cur').value,deadline:document.getElementById('pj_deadline').value,stage:0,tasks:[],date:today()});
  save();closeModal();render();toast('Проект создан');
}

function nextStage(id){const p=db.projects.find(x=>x.id===id);if(p&&p.stage<3){p.stage++;save();render();toast('Этап: '+STAGES[p.stage]);}}
function delProject(id){if(confirm('Удалить проект?')){db.projects=db.projects.filter(p=>p.id!==id);save();render();}}

function showProjectTasks(id){
  const p=db.projects.find(x=>x.id===id);if(!p)return;
  let h='<h3>Задачи: '+esc(p.name)+'</h3>';
  if(p.tasks&&p.tasks.length){p.tasks.forEach(t=>{h+='<div class="row" style="margin:8px 0"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleProjTask(\''+id+'\',\''+t.id+'\')"><span style="flex:1;'+(t.done?'text-decoration:line-through;color:var(--mut)':'')+'">'+esc(t.text)+'</span><button class="btn danger" onclick="delProjTask(\''+id+'\',\''+t.id+'\')">✕</button></div>';});}
  else{h+='<div class="mut">Нет задач</div>';}
  h+='<div class="row" style="margin-top:10px"><input id="newTask" placeholder="Новая задача"><button class="btn" onclick="addProjTask(\''+id+'\')">+</button></div>';
  openModal(h);
}

function addProjTask(projId){const text=document.getElementById('newTask').value.trim();if(!text)return;const p=db.projects.find(x=>x.id===projId);if(p){if(!p.tasks)p.tasks=[];p.tasks.push({id:uid(),text:text,done:false});save();showProjectTasks(projId);render();}}
function toggleProjTask(projId,taskId){const p=db.projects.find(x=>x.id===projId);if(p&&p.tasks){const t=p.tasks.find(x=>x.id===taskId);if(t)t.done=!t.done;save();showProjectTasks(projId);render();}}
function delProjTask(projId,taskId){const p=db.projects.find(x=>x.id===projId);if(p&&p.tasks){p.tasks=p.tasks.filter(t=>t.id!==taskId);save();showProjectTasks(projId);render();}}

// ===== БАЗА ЗНАНИЙ =====
function rGrowth(){
  const mastered=db.knowledge.filter(k=>k.status===3).length;
  const total=db.knowledge.length;
  const progress=total?Math.round(mastered/total*100):0;
  
  let h='<div class="row spread"><h2>🎯 Рост</h2></div>';
  
  h+='<div class="card" style="background:#1a2035;border-color:#3a4a7a"><b>📊 Прогресс обучения</b>';
  h+='<div class="mut" style="margin-top:5px">Освоено: '+mastered+' из '+total+' ('+progress+'%)</div>';
  h+='<div class="bar" style="margin-top:10px"><i style="width:'+progress+'%"></i></div>';
  h+='<button class="btn ai" onclick="addKnowledge()" style="width:100%;margin-top:10px">+ Добавить тему</button></div>';
  
  h+='<div class="card"><b>💪 Навыки</b>';
  db.skills.forEach(s=>{h+='<div style="margin:10px 0"><div class="row spread"><span>'+esc(s.n)+'</span><span class="mut">'+['Новичок','Базово','Уверенно','Профи','Эксперт'][s.l-1]+'</span></div><div class="bar"><i style="width:'+(s.l*20)+'%"></i></div></div>';});
  h+='</div>';
  
  h+='<div class="card"><b>📚 База знаний</b>';
  if(!db.knowledge.length) h+='<div class="mut">Нет записей</div>';
  db.knowledge.forEach(k=>{
    h+='<div class="note" style="margin-top:8px">';
    h+='<div class="row spread"><b>'+esc(k.topic)+'</b><span class="chip '+(k.status===3?'ok':'on')+'">'+KB_STATUS[k.status]+'</span></div>';
    h+='<div class="mut" style="margin-top:5px">📁 '+esc(k.dir||'—')+'</div>';
    h+='<div class="mut">📖 Теория: '+esc(k.theory||'—')+'</div>';
    h+='<div class="mut">🔧 Практика: '+esc(k.practice||'—')+'</div>';
    if(k.resources) h+='<div class="mut">🔗 Ресурсы: '+esc(k.resources)+'</div>';
    h+='<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap">';
    for(let i=0;i<KB_STATUS.length;i++){h+='<button class="btn '+(k.status===i?'ai':'sec')+'" style="padding:6px 10px;font-size:12px" onclick="setKbStatus(\''+k.id+'\','+i+')">'+KB_STATUS[i]+'</button>';}
    h+='<button class="btn danger" style="padding:6px 10px;font-size:12px" onclick="delKnowledge(\''+k.id+'\')">🗑</button>';
    h+='</div></div>';
  });
  h+='</div>';
  
  h+='<div class="card"><b>🎯 Цели</b>';
  db.goals.forEach((g,i)=>{h+='<div class="row spread" style="margin:10px 0"><div class="row" style="gap:10px"><input type="checkbox" '+(g.done?'checked':'')+' onchange="toggleGoal('+i+')"><span style="'+(g.done?'text-decoration:line-through;color:var(--ok)':'')+'">'+esc(g.t)+'</span></div></div>';});
  h+='</div>';
  return h;
}

function addKnowledge(){
  openModal('<h3>Новая тема</h3>'+
    '<label>Тема *</label><input id="kb_topic">'+
    '<label>Категория</label><input id="kb_dir" placeholder="Фронтенд, Бэкенд...">'+
    '<label>Теория</label><textarea id="kb_theory" rows="3"></textarea>'+
    '<label>Практика</label><textarea id="kb_practice" rows="3"></textarea>'+
    '<label>Ресурсы (ссылки)</label><input id="kb_resources">'+
    '<div class="row"><button class="btn" onclick="saveKnowledge()">Сохранить</button><button class="btn sec" onclick="closeModal()">Отмена</button></div>');
}

function saveKnowledge(){
  const topic=document.getElementById('kb_topic').value.trim();
  if(!topic){toast('Укажите тему');return;}
  db.knowledge.push({id:uid(),topic:topic,dir:document.getElementById('kb_dir').value.trim(),theory:document.getElementById('kb_theory').value.trim(),practice:document.getElementById('kb_practice').value.trim(),resources:document.getElementById('kb_resources').value.trim(),status:0});
  save();closeModal();render();toast('Тема добавлена');
}

function setKbStatus(id,status){const k=db.knowledge.find(x=>x.id===id);if(k){k.status=status;save();render();toast('Статус: '+KB_STATUS[status]);}}
function delKnowledge(id){if(confirm('Удалить тему?')){db.knowledge=db.knowledge.filter(k=>k.id!==id);save();render();}}
function toggleGoal(i){db.goals[i].done=!db.goals[i].done;save();render();}

// ===== НАСТРАИВАЕМЫЙ ТАЙМЕР =====
function rTime(){
  const mode=TIMER_MODES[db.timerMode||0];
  return '<div class="row spread"><h2>⏱ Время</h2></div>'+
    '<div class="card" style="text-align:center"><div style="font-size:48px;font-weight:bold;color:var(--acc)" id="timer">'+formatTime(mode.work*60)+'</div>'+
    '<div class="mut" id="timerMode" style="margin:10px 0">🎯 Режим: Фокус</div>'+
    '<div class="mut" id="timerPreset" style="margin-bottom:10px">'+mode.name+'</div>'+
    '<div class="row" style="justify-content:center;margin-top:15px;gap:8px"><button class="btn" onclick="startT()">▶ Старт</button><button class="btn sec" onclick="resetT()">Сброс</button></div>'+
    '</div>'+
    '<div class="card"><b>⚙️ Режим таймера</b>'+
    TIMER_MODES.map((m,i)=>'<div class="row spread" style="margin:8px 0"><span>'+m.name+' ('+m.work+'мин работа / '+m.break+'мин перерыв)</span><button class="btn '+(db.timerMode===i?'ai':'sec')+'" onclick="setTimerMode('+i+')">Выбрать</button></div>').join('')+
    '</div>'+
    '<div class="note"><b>💡 Совет:</b> 25/5 — для рутинных задач, 50/10 — для глубокой работы, 90/20 — для сложных проектов</div>';
}

function formatTime(sec){const m=Math.floor(sec/60).toString().padStart(2,'0'),s=(sec%60).toString().padStart(2,'0');return m+':'+s;}

let tInt,tSec,tMode='focus';
function getTimerSec(){const mode=TIMER_MODES[db.timerMode||0];return tMode==='focus'?mode.work*60:mode.break*60;}

function startT(){
  if(tInt)return;
  tSec=getTimerSec();
  tInt=setInterval(()=>{
    tSec--;
    const el=document.getElementById('timer'),modeEl=document.getElementById('timerMode');
    if(el)el.textContent=formatTime(tSec);
    if(modeEl)modeEl.textContent=tMode==='focus'?'🎯 Режим: Фокус':'☕ Режим: Перерыв';
    if(tSec<=0){
      clearInterval(tInt);tInt=null;
      if(tMode==='focus'){toast('☕ Время перерыва!');tMode='break';}
      else{toast(' Время работать!');tMode='focus';}
      startT();
    }
  },1000);
}

function resetT(){clearInterval(tInt);tInt=null;tMode='focus';const el=document.getElementById('timer'),modeEl=document.getElementById('timerMode');if(el)el.textContent=formatTime(TIMER_MODES[db.timerMode||0].work*60);if(modeEl)modeEl.textContent='🎯 Режим: Фокус';}

function setTimerMode(i){db.timerMode=i;save();render();toast('Режим: '+TIMER_MODES[i].name);}

// ===== ОСТАЛЬНЫЕ ВКЛАДКИ =====
function rHome(){
  const m=MONTHS[new Date().getMonth()];
  const inc=db.finances.filter(f=>f.type==='in').reduce((s,f)=>s+f.amt,0);
  const activeProjects=db.projects.filter(p=>p.stage<3).length;
  const leadsCount=(db.leads?db.leads.length:0)+(db.pains?db.pains.length:0);
  return '<div class="note" style="background:linear-gradient(135deg,var(--acc),#9d6cff);color:#fff;padding:20px;margin-bottom:20px"><div style="font-size:24px">Привет, '+esc(db.profile.name)+'! 👋</div><div style="opacity:.9">'+esc(db.profile.spec)+'</div></div><div class="grid"><div class="card stat"><span>Доход, '+m+'</span><b class="plus">'+inc.toLocaleString()+' ₽</b></div><div class="card stat"><span>Клиентов</span><b>'+db.clients.length+'</b></div><div class="card stat"><span>Активных проектов</span><b>'+activeProjects+'</b></div><div class="card stat"><span>Всего лидов</span><b>'+leadsCount+'</b></div></div><div class="card"><b>⚡ Быстрые действия</b><div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn" onclick="go(\'radar\')">🎯 Найти клиентов</button><button class="btn sec" onclick="go(\'projects\')">📁 Проекты</button><button class="btn sec" onclick="go(\'growth\')">📚 База знаний</button></div></div>';
}
function rClients(){return '<div class="row spread"><h2> Клиенты</h2><button class="btn" onclick="addClient()">+ Лид</button></div>'+db.clients.map(c=>'<div class="card"><div class="row spread"><b>'+esc(c.name)+'</b><span class="chip on">'+c.status+'</span></div><div class="mut">'+esc(c.company)+' · '+c.budget+' '+c.cur+'</div></div>').join('');}
function addClient(){const n=prompt('Имя:');if(!n)return;db.clients.push({id:uid(),name:n,company:prompt('Компания:')||'',budget:+prompt('Бюджет:')||0,cur:'RUB',status:'Новый',date:today()});save();render();}
function rFinances(){return '<div class="row spread"><h2> Финансы</h2><button class="btn" onclick="addFin()">+ Операция</button></div>'+db.finances.map(f=>'<div class="card row spread"><div><b class="'+(f.type==='in'?'plus':'minus')+'">'+(f.type==='in'?'+':'-')+' '+f.amt+' '+f.cur+'</b><div class="mut">'+f.cat+'</div></div></div>').join('');}
function addFin(){const a=+prompt('Сумма:');if(!a)return;db.finances.unshift({id:uid(),date:today(),type:prompt('Тип (in/out):','in'),amt:a,cur:'RUB',cat:'Проект'});save();render();}
function rPrices(){return '<div class="row spread"><h2>💵 Прайс</h2></div>'+db.prices.map(p=>'<div class="card row spread"><div><b>'+esc(p.name)+'</b></div><b class="plus">'+p.price+' '+p.cur+'</b></div>').join('');}
function rPlan(){return '<div class="row spread"><h2>📅 План</h2><button class="btn" onclick="addTask()">+ Задача</button></div>'+db.tasks.map(t=>'<div class="card row spread"><div class="row" style="gap:10px"><input type="checkbox" '+(t.done?'checked':'')+' onchange="togTask(\''+t.id+'\')"><span style="'+(t.done?'text-decoration:line-through;color:var(--mut)':'')+'">'+esc(t.text)+'</span></div></div>').join('');}
function addTask(){const t=prompt('Задача:');if(!t)return;db.tasks.push({id:uid(),text:t,done:false,date:today()});save();render();}
function togTask(id){const t=db.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render();}
function rLawyer(){return '<div class="row spread"><h2>️ Юрист</h2></div><div class="card"><button class="btn sec" style="width:100%;margin:8px 0" onclick="useTpl(\'dogovor\')"> Договор</button><button class="btn sec" style="width:100%;margin:8px 0" onclick="useTpl(\'act\')">📋 Акт</button></div>';}
function useTpl(type){const t={dogovor:'ДОГОВОР\n\nЗаказчик: _________\nИсполнитель: '+db.profile.name,act:'АКТ\n\nВыполнено: _________'};openModal('<h3>Шаблон</h3><textarea id="tplText" rows="10" style="width:100%">'+esc(t[type]||'')+'</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="copyText(document.getElementById(\'tplText\').value);closeModal()">📋 Копировать</button>');}
function rSettings(){return '<div class="row spread"><h2>⚙️ Настройки</h2></div><div class="card"><b>👤 Профиль</b><label>Имя</label><input value="'+esc(db.profile.name)+'" onchange="db.profile.name=this.value;save()"><label>Специализация</label><input value="'+esc(db.profile.spec)+'" onchange="db.profile.spec=this.value;save()"></div><div class="card"><b>🎨 Тема</b><button class="btn sec" onclick="document.body.classList.toggle(\'light-theme\');localStorage.setItem(\'theme\',document.body.classList.contains(\'light-theme\')?\'light\':\'dark\')" style="width:100%">🌓 Переключить тему</button></div><div class="card"><b>📊 Экспорт</b><button class="btn" onclick="exportCSV()" style="width:100%">📥 Скачать Excel (CSV)</button></div><div class="card"><b>🔄 Сброс</b><button class="btn danger" onclick="hardReset()" style="width:100%">🔄 Сбросить кэш и обновить</button></div>';}

function exportCSV(){let csv='Тип,Имя,Сумма\n';db.clients.forEach(c=>{csv+='Клиент,'+c.name+','+c.budget+'\n';});const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='SoloDev_'+today()+'.csv';link.click();toast('✅ Экспорт завершён!');}
function hardReset(){if(confirm("⚠️ Удалить кэш и перезагрузить? Данные сохранятся.")){if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if("caches"in window)caches.keys().then(n=>n.forEach(k=>caches.delete(k)));window.location.href=window.location.pathname+"?v="+Date.now();}}

function render(){
  document.getElementById('date').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const app=document.getElementById('app');
  switch(tab){
    case 'home':app.innerHTML=rHome();break;
    case 'radar':app.innerHTML=rRadar();break;
    case 'clients':app.innerHTML=rClients();break;
    case 'projects':app.innerHTML=rProjects();break;
    case 'finances':app.innerHTML=rFinances();break;
    case 'price':app.innerHTML=rPrices();break;
    case 'time':app.innerHTML=rTime();break;
    case 'plan':app.innerHTML=rPlan();break;
    case 'growth':app.innerHTML=rGrowth();break;
    case 'lawyer':app.innerHTML=rLawyer();break;
    case 'settings':app.innerHTML=rSettings();break;
  }
}

window.onload=()=>{
  try{
    if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');
    setTimeout(()=>{
      document.getElementById('splash').classList.add('hidden');
      setTimeout(()=>{document.getElementById('splash').style.display='none';},500);
      renderNav();
      render();
    },1500);
  }catch(e){
    console.error('Ошибка:',e);
    document.getElementById('splash').classList.add('hidden');
  }
};
</script>
</body>
