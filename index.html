<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1116">
<title>SoloDev v1.1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--txt:#e8ecf3;--mut:#8b94a7;--acc:#6c8cff;--acc2:#9d6cff;--ok:#3ecf8e;--warn:#ffb454;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:rgba(14,17,22,.95);backdrop-filter:blur(8px);border-bottom:1px solid #242b36;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
header b{font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #242b36;display:flex;gap:4px;padding:8px;overflow-x:auto;z-index:20}
nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:60px;background:var(--card2);border:none;border-radius:10px;padding:8px 4px;color:var(--mut);font-size:11px;cursor:pointer}
.nav-btn.active{background:var(--acc);color:#fff}
.nav-btn small{display:block;margin-top:2px;font-size:10px}
main{padding:14px;max-width:760px;margin:0 auto}
h2{font-size:18px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid #242b36;border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat span{display:block;font-size:12px;color:var(--mut)}
.stat b{font-size:20px}
.mut{color:var(--mut);font-size:13px}
.plus{color:var(--ok)}.minus{color:var(--bad)}
.note{background:var(--card2);border-radius:8px;padding:10px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid #242b36}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.ai{background:linear-gradient(90deg,var(--acc),var(--acc2))}
input,select,textarea{width:100%;background:var(--card2);border:1px solid #242b36;color:var(--txt);border-radius:10px;padding:10px;margin:4px 0 10px}
.chip{display:inline-block;background:var(--card2);border:1px solid #242b36;border-radius:16px;padding:6px 12px;font-size:12px;margin:2px}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}
#splash.hidden{opacity:0;pointer-events:none}
#splash .logo{font-size:72px;margin-bottom:20px;animation:pulse 1.5s ease infinite}
#splash h1{font-size:28px;margin-bottom:10px;color:var(--acc)}
.loader{width:200px;height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-top:20px}
.loader-bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;animation:load 2s ease forwards}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes load{to{width:100%}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:24px;font-size:14px;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="splash"><div class="logo">⚡</div><h1>SoloDev</h1><p class="mut">Загрузка...</p><div class="loader"><div class="loader-bar"></div></div></div>

<header><b>⚡ SoloDev v1.1</b><span id="date"></span></header>

<main id="app"></main>

<nav id="nav"></nav>

<script>
// ===== ДАННЫЕ =====
const KEY='solodev_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>d?d.split('-').reverse().join('.'):'';
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

// ===== БАЗА ДАННЫХ С ПРЕДУСТАНОВКАМИ =====
function seed(){
  const d=today();
  return{
    profile:{name:'Дмитрий',spec:'Fullstack разработчик',country:'ru',currency:'RUB',rate:1500,rates:{BYN:30,CNY:11.5,USD:90},specs:['Фронтенд','Бэкенд','Боты']},
    clients:[
      {id:uid(),name:'Алексей Иванов',company:'TechStart',country:'ru',source:'Telegram',contact:'@alexey',budget:45000,cur:'RUB',status:'В работе',date:d},
      {id:uid(),name:'Мария Петрова',company:'Digital Pro',country:'ru',source:'Рекомендация',contact:'@maria',budget:30000,cur:'RUB',status:'Переговоры',date:d},
      {id:uid(),name:'Иван Сидоров',company:'Startup Hub',country:'by',source:'Холодный поиск',contact:'@ivan',budget:500,cur:'USD',status:'Новый',date:d}
    ],
    projects:[
      {id:uid(),name:'Интернет-магазин',client:'Алексей Иванов',budget:45000,cur:'RUB',deadline:'2026-09-01',stage:'В работе',date:d},
      {id:uid(),name:'Лендинг',client:'Мария Петрова',budget:30000,cur:'RUB',deadline:'2026-08-25',stage:'Разработка',date:d}
    ],
    tasks:[
      {id:uid(),proj:'',text:'Настроить CI/CD',done:true,date:d},
      {id:uid(),proj:'',text:'Сверстать главную',done:false,date:d},
      {id:uid(),proj:'',text:'Интеграция API',done:false,date:d}
    ],
    finances:[
      {id:uid(),date:'2026-08-01',type:'in',amt:30000,cur:'RUB',cat:'Проект'},
      {id:uid(),date:'2026-08-05',type:'out',amt:5000,cur:'RUB',cat:'Софт'},
      {id:uid(),date:'2026-08-10',type:'in',amt:15000,cur:'RUB',cat:'Проект'}
    ],
    pains:[
      {id:uid(),seg:'Владельцы магазинов',pain:'Сайт медленно грузится',demand:5,sol:'Оптимизация скорости',status:'Подтверждена',src:'Автопоиск'},
      {id:uid(),seg:'Стартапы',pain:'Нет мобильного приложения',demand:4,sol:'React Native приложение',status:'Гипотеза',src:'Автопоиск'}
    ],
    proposals:[
      {id:uid(),client:'Мария Петрова',task:'Лендинг',scope:'Современный адаптивный лендинг',price:30000,cur:'RUB',days:14,status:'Отправлен',date:d}
    ],
    skills:[
      {n:'HTML/CSS',l:5},{n:'JavaScript',l:4},{n:'TypeScript',l:3},{n:'React',l:4},{n:'Node.js',l:3},{n:'Python',l:2}
    ],
    goals:[
      {t:'Изучить TypeScript',done:true},
      {t:'Сделать 3 проекта в портфолио',done:false},
      {t:'Увеличить доход до 100к/мес',done:false}
    ],
    knowledge:[
      {id:uid(),dir:'Фронтенд',topic:'React Hooks',theory:'useEffect, useState, useContext',practice:'Создать кастомный хук',time:'2 недели',res:'',status:'Изучаю'},
      {id:uid(),dir:'Бэкенд',topic:'REST API',theory:'Методы GET, POST, PUT, DELETE',practice:'Сделать API для блога',time:'1 неделя',res:'',status:'Освоено'},
      {id:uid(),dir:'DevOps',topic:'Docker',theory:'Контейнеризация приложений',practice:'Задеплоить приложение в Docker',time:'3 недели',res:'',status:'Практика'}
    ],
    prices:[
      {id:uid(),name:'Лендинг',price:25000,cur:'RUB',unit:'проект'},
      {id:uid(),name:'Интернет-магазин',price:60000,cur:'RUB',unit:'проект'},
      {id:uid(),name:'Telegram бот',price:15000,cur:'RUB',unit:'проект'},
      {id:uid(),name:'Консультация',price:2000,cur:'RUB',unit:'час'}
    ],
    mails:15,
    pinHash:null,
    tax:{regime:'ru_npdu',limit:2400000,calc:{ind:'',ent:''},useDeduct:false},
    channels:[{name:'Telegram',action:'5 контактов в день',status:'Работает',leads:8}],
    sessions:[{id:uid(),date:d,min:240,task:'Разработка'}],
    plan:[],
    blocks:[],
    balance:{limitMin:360,items:['Время с семьёй','Спорт','Отдых'],checks:{}},
    contracts:[]
  };
}

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
let db=(()=>{const s=seed(),l=load();return l?{...s,...l}:s})();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}

// ===== НАВИГАЦИЯ =====
const TABS=[
  {id:'home',icon:'🏠',label:'Главная'},
  {id:'clients',icon:'',label:'Клиенты'},
  {id:'projects',icon:'📁',label:'Проекты'},
  {id:'finances',icon:'💰',label:'Финансы'},
  {id:'taxes',icon:'🧾',label:'Налоги'},
  {id:'price',icon:'💵',label:'Прайс'},
  {id:'time',icon:'⏱',label:'Время'},
  {id:'plan',icon:'📅',label:'План'},
  {id:'growth',icon:'🎯',label:'Рост'},
  {id:'lawyer',icon:'⚖️',label:'Юрист'},
  {id:'settings',icon:'️',label:'Настройки'}
];
let tab='home';

function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="nav-btn ${t.id===tab?'active':''}" onclick="go('${t.id}')">${t.icon}<br><small>${t.label}</small></button>`).join('');
}

function go(id){tab=id;renderNav();render();window.scrollTo(0,0)}

// ===== РЕНДЕР ФУНКЦИИ =====
function render(){
  const app=document.getElementById('app');
  const date=new Date();
  document.getElementById('date').textContent=date.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  
  const m=MONTHS[date.getMonth()];
  const inc=db.finances.filter(f=>f.type==='in'&&f.date.startsWith(today().slice(0,7))).reduce((s,f)=>s+(f.cur==='RUB'?f.amt:f.amt*(db.profile.rates[f.cur]||1)),0);
  const exp=db.finances.filter(f=>f.type==='out'&&f.date.startsWith(today().slice(0,7))).reduce((s,f)=>s+(f.cur==='RUB'?f.amt:f.amt*(db.profile.rates[f.cur]||1)),0);
  
  switch(tab){
    case 'home':
      app.innerHTML=`<div class="note" style="background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;padding:20px;margin-bottom:20px">
        <div style="font-size:24px;margin-bottom:8px">Привет, ${esc(db.profile.name)}! 👋</div>
        <div style="opacity:.9">${esc(db.profile.spec)}</div>
      </div>
      <div class="grid">
        <div class="card stat"><span>Доход, ${m}</span><b class="plus">${inc.toLocaleString()} ₽</b></div>
        <div class="card stat"><span>Расход, ${m}</span><b class="minus">${exp.toLocaleString()} ₽</b></div>
        <div class="card stat"><span>Клиентов</span><b>${db.clients.length}</b></div>
        <div class="card stat"><span>Проектов</span><b>${db.projects.length}</b></div>
      </div>
      <div class="card"><b> Быстрые действия</b>
        <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px">
          <button class="btn" onclick="go('clients')">+ Клиент</button>
          <button class="btn ai" onclick="go('projects')">+ Проект</button>
          <button class="btn sec" onclick="go('finances')">💵 Операция</button>
        </div>
      </div>
      <div class="card"><b>🎯 Активные проекты</b>
        ${db.projects.slice(0,3).map(p=>`<div class="note" style="margin-top:8px"><div class="row spread"><b>${esc(p.name)}</b><span class="chip on">${esc(p.stage)}</span></div><div class="mut">${esc(p.client)} · ${p.budget.toLocaleString()} ${p.cur}</div></div>`).join('')}
      </div>`;
      break;
      
    case 'clients':
      app.innerHTML=`<div class="row spread"><h2>👥 Клиенты</h2><button class="btn" onclick="addClient()">+ Лид</button></div>
      ${db.clients.map(c=>`<div class="card">
        <div class="row spread"><b>${esc(c.name)}</b><span class="chip on">${c.status}</span></div>
        <div class="mut">${esc(c.company)} · ${c.budget.toLocaleString()} ${c.cur}</div>
        <div class="mut">Источник: ${c.source}</div>
        <div class="row" style="margin-top:8px"><button class="btn sec" onclick="editClient('${c.id}')">✏️</button><button class="btn danger" onclick="delClient('${c.id}')">🗑</button></div>
      </div>`).join('')}`;
      break;
      
    case 'projects':
      app.innerHTML=`<div class="row spread"><h2>📁 Проекты</h2><button class="btn" onclick="addProject()">+ Проект</button></div>
      ${db.projects.map(p=>`<div class="card">
        <div class="row spread"><b>${esc(p.name)}</b><span class="chip on">${p.stage}</span></div>
        <div class="mut">${esc(p.client)}</div>
        <div class="bar" style="margin:10px 0"><i style="width:${p.stage==='В работе'?'60%':p.stage==='Разработка'?'40%':'80%'}"></i></div>
        <div class="row spread"><span class="mut">Дедлайн: ${fmtDate(p.deadline)}</span><b>${p.budget.toLocaleString()} ${p.cur}</b></div>
      </div>`).join('')}`;
      break;
      
    case 'finances':
      app.innerHTML=`<div class="row spread"><h2>💰 Финансы</h2><button class="btn" onclick="addFinance()">+ Операция</button></div>
      <div class="grid">
        <div class="card stat"><span>Доход</span><b class="plus">${inc.toLocaleString()} ₽</b></div>
        <div class="card stat"><span>Расход</span><b class="minus">${exp.toLocaleString()} ₽</b></div>
      </div>
      ${db.finances.map(f=>`<div class="card row spread">
        <div><b class="${f.type==='in'?'plus':'minus'}">${f.type==='in'?'+':'-'} ${f.amt.toLocaleString()} ${f.cur}</b><div class="mut">${fmtDate(f.date)} · ${f.cat}</div></div>
      </div>`).join('')}`;
      break;
      
    case 'taxes':
      app.innerHTML=`<div class="row spread"><h2>🧾 Налоги</h2></div>
      <div class="card"><b>НПД (Самозанятость)</b>
        <div class="mut">4% с физлиц, 6% с юрлиц</div>
        <div style="margin-top:10px"><label>Доход от физлиц (₽)</label><input type="number" id="taxInd" value="${db.tax.calc.ind||0}" onchange="calcTax()"></div>
        <div style="margin-top:10px"><label>Доход от юрлиц (₽)</label><input type="number" id="taxEnt" value="${db.tax.calc.ent||0}" onchange="calcTax()"></div>
        <div id="taxResult" style="margin-top:15px;padding:15px;background:var(--card2);border-radius:10px"><b>Налог: 0 ₽</b></div>
      </div>`;
      setTimeout(calcTax,100);
      break;
      
    case 'price':
      app.innerHTML=`<div class="row spread"><h2> Прайс</h2><button class="btn" onclick="addPrice()">+ Услуга</button></div>
      ${db.prices.map(p=>`<div class="card row spread">
        <div><b>${esc(p.name)}</b><div class="mut">${p.unit}</div></div>
        <b class="plus">${p.price.toLocaleString()} ${p.cur}</b>
      </div>`).join('')}
      <div class="card" style="margin-top:20px"><b>🧮 Калькулятор</b>
        <div style="margin-top:10px"><label>Часов</label><input type="number" id="calcH" value="10" onchange="calcPrice()"></div>
        <div style="margin-top:10px"><label>Ставка (₽/час)</label><input type="number" id="calcR" value="${db.profile.rate}" onchange="calcPrice()"></div>
        <div id="calcResult" style="margin-top:15px;font-size:1.3em;color:var(--acc)"><b>0 ₽</b></div>
      </div>`;
      break;
      
    case 'time':
      app.innerHTML=`<div class="row spread"><h2>⏱ Время</h2></div>
      <div class="card" style="text-align:center;padding:30px">
        <div style="font-size:48px;font-weight:bold;color:var(--acc);margin-bottom:10px" id="timer">25:00</div>
        <div class="mut">Таймер Pomodoro</div>
        <div class="row" style="justify-content:center;margin-top:15px">
          <button class="btn" onclick="startTimer()">▶ Старт</button>
          <button class="btn sec" onclick="resetTimer()">Сброс</button>
        </div>
      </div>
      <div class="card"><b>Сегодня</b>
        <div class="mut">${db.sessions.filter(s=>s.date===today()).reduce((a,s)=>a+s.min,0)} минут работы</div>
      </div>`;
      break;
      
    case 'plan':
      app.innerHTML=`<div class="row spread"><h2>📅 План</h2><button class="btn" onclick="addTask()">+ Задача</button></div>
      ${db.tasks.map(t=>`<div class="card row spread">
        <div class="row" style="gap:10px"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><span style="${t.done?'text-decoration:line-through;color:var(--mut)':''}">${esc(t.text)}</span></div>
        <button class="btn danger" onclick="delTask('${t.id}')">✕</button>
      </div>`).join('')}`;
      break;
      
    case 'growth':
      app.innerHTML=`<div class="row spread"><h2>🎯 Рост</h2></div>
      <div class="card"><b> Навыки</b>
        ${db.skills.map(s=>`<div style="margin:10px 0"><div class="row spread"><span>${esc(s.n)}</span><span class="mut">${['Не знаю','Новичок','Базово','Уверенно','Профи','Эксперт'][s.l]}</span></div><div class="bar"><i style="width:${s.l*20}%"></i></div></div>`).join('')}
      </div>
      <div class="card"><b>🎯 Цели</b>
        ${db.goals.map((g,i)=>`<div class="row spread" style="margin:10px 0"><div class="row" style="gap:10px"><input type="checkbox" ${g.done?'checked':''} onchange="toggleGoal(${i})"><span style="${g.done?'text-decoration:line-through;color:var(--ok)':''}">${esc(g.t)}</span></div></div>`).join('')}
      </div>
      <div class="card"><b>📚 База знаний</b>
        ${db.knowledge.map(k=>`<div class="note" style="margin-top:8px"><div class="row spread"><b>${esc(k.topic)}</b><span class="chip on">${esc(k.dir)}</span></div><div class="mut">${esc(k.theory)}</div><div class="mut" style="margin-top:5px">Практика: ${esc(k.practice)}</div><div class="mut">Время: ${k.time} · Статус: ${k.status}</div></div>`).join('')}
      </div>`;
      break;
      
    case 'lawyer':
      app.innerHTML=`<div class="row spread"><h2>⚖️ Юрист</h2></div>
      <div class="card"><b>Шаблоны документов</b>
        <button class="btn sec" style="width:100%;margin:8px 0" onclick="useTemplate('dogovor')"> Договор</button>
        <button class="btn sec" style="width:100%;margin:8px 0" onclick="useTemplate('act')">📋 Акт</button>
        <button class="btn sec" style="width:100%;margin:8px 0" onclick="useTemplate('nda')">🔐 NDA</button>
      </div>
      <div class="card"><b>📁 Мои документы</b>
        <div class="mut">Нет созданных документов</div>
      </div>`;
      break;
      
    case 'settings':
      app.innerHTML=`<div class="row spread"><h2>⚙️ Настройки</h2></div>
      <div class="card"><b>Профиль</b>
        <label>Имя</label><input value="${esc(db.profile.name)}" onchange="db.profile.name=this.value;save()">
        <label>Специализация</label><input value="${esc(db.profile.spec)}" onchange="db.profile.spec=this.value;save()">
      </div>
      <div class="card"><b>💱 Курсы валют</b>
        <div class="mut">1 BYN = ${db.profile.rates.BYN} ₽</div>
        <div class="mut">1 CNY = ${db.profile.rates.CNY} ₽</div>
        <div class="mut">1 USD = ${db.profile.rates.USD} ₽</div>
      </div>
      <div class="card"><b>🔄 Сброс данных</b>
        <button class="btn danger" onclick="hardReset()" style="width:100%"> Очистить всё и начать заново</button>
      </div>`;
      break;
  }
}

// ===== ФУНКЦИИ =====
function addClient(){
  const name=prompt('Имя клиента:');
  if(!name)return;
  db.clients.push({id:uid(),name,company:prompt('Компания:')||'',country:'ru',source:prompt('Источник:')||'',contact:'',budget:+prompt('Бюджет:')||0,cur:'RUB',status:'Новый',date:today()});
  save();render();
}

function delClient(id){if(confirm('Удалить?')){db.clients=db.clients.filter(c=>c.id!==id);save();render()}}
function editClient(id){toast('Редактирование')}

function addProject(){
  const name=prompt('Название проекта:');
  if(!name)return;
  db.projects.push({id:uid(),name,client:prompt('Клиент:')||'',budget:+prompt('Бюджет:')||0,cur:'RUB',deadline:prompt('Дедлайн (ГГГГ-ММ-ДД):')||'',stage:'В работе',date:today()});
  save();render();
}

function addFinance(){
  const type=prompt('Тип (in/out):','in');
  const amt=+prompt('Сумма:');
  if(!amt)return;
  db.finances.unshift({id:uid(),date:today(),type:type||'in',amt,cur:'RUB',cat:'Проект'});
  save();render();
}

function calcTax(){
  const ind=+document.getElementById('taxInd').value||0;
  const ent=+document.getElementById('taxEnt').value||0;
  const tax=ind*0.04+ent*0.06;
  document.getElementById('taxResult').innerHTML=`<b>Налог: ${Math.round(tax).toLocaleString()} ₽</b>`;
}

function addPrice(){
  const name=prompt('Название услуги:');
  if(!name)return;
  db.prices.push({id:uid(),name,price:+prompt('Цена:')||0,cur:'RUB',unit:'проект'});
  save();render();
}

function calcPrice(){
  const h=+document.getElementById('calcH').value||0;
  const r=+document.getElementById('calcR').value||0;
  document.getElementById('calcResult').innerHTML=`<b>${(h*r).toLocaleString()} ₽</b>`;
}

let timerInterval;
let timerSeconds=25*60;
function startTimer(){
  if(timerInterval)return;
  timerInterval=setInterval(()=>{
    timerSeconds--;
    const m=Math.floor(timerSeconds/60).toString().padStart(2,'0');
    const s=(timerSeconds%60).toString().padStart(2,'0');
    const el=document.getElementById('timer');
    if(el)el.textContent=`${m}:${s}`;
    if(timerSeconds<=0){clearInterval(timerInterval);timerInterval=null;toast('Время вышло!');timerSeconds=25*60}
  },1000);
}

function resetTimer(){clearInterval(timerInterval);timerInterval=null;timerSeconds=25*60;const el=document.getElementById('timer');if(el)el.textContent='25:00'}

function addTask(){
  const text=prompt('Задача:');
  if(!text)return;
  db.tasks.push({id:uid(),proj:'',text,done:false,date:today()});
  save();render();
}

function toggleTask(id){const t=db.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}
function delTask(id){db.tasks=db.tasks.filter(t=>t.id!==id);save();render()}
function toggleGoal(i){db.goals[i].done=!db.goals[i].done;save();render()}

function useTemplate(type){
  const templates={
    dogovor:'ДОГОВОР\n\nЗаказчик: _________\nИсполнитель: '+db.profile.name+'\n\nСумма: _________ ₽',
    act:'АКТ\n\nВыполнено: _________\n\nПодпись: _________',
    nda:'NDA\n\nКонфиденциальность\n\nПодпись: _________'
  };
  alert(templates[type]||'Шаблон не найден');
}

function hardReset(){
  if(confirm('Очистить ВСЕ данные? Это необратимо!')){
    localStorage.removeItem(KEY);
    location.reload();
  }
}

function toast(msg){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

// ===== ЗАПУСК =====
window.onload=()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hidden');
    setTimeout(()=>document.getElementById('splash').style.display='none',500);
    renderNav();
    render();
  },2000);
};

function hardReset(){
  if(confirm("🔄 Обновить приложение? Данные (клиенты, проекты, финансы) СОХРАНЯТСЯ.")){
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));
    }
    if("caches" in window){
      caches.keys().then(n=>n.forEach(k=>caches.delete(k)));
    }
    window.location.href = window.location.pathname + "?v=" + Date.now();
  }
}
