<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloDev v4.6</title>
<style>
body{background:#0e1116;color:#e8ecf3;font-family:system-ui,sans-serif;margin:0;padding:20px}
h1{color:#6c8cff}
.card{background:#171b22;border:1px solid #242b36;border-radius:12px;padding:15px;margin:10px 0}
.btn{background:#6c8cff;color:#fff;border:none;border-radius:8px;padding:10px 15px;width:100%;margin-top:10px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.small{width:auto;padding:8px 12px;font-size:14px}
.btn.active{background:#9d6cff}
.btn.ai{background:linear-gradient(90deg,#6c8cff,#9d6cff)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:#8b94a7;font-size:13px}
.stat{display:block;font-size:12px;color:#8b94a7}.stat b{font-size:20px}
.bar{height:6px;background:#1f2530;border-radius:3px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#6c8cff;border-radius:3px}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:15px;padding:10px;background:#1f2530;border-radius:8px}
.chart-col{flex:1;background:#6c8cff;border-radius:4px 4px 0 0;min-height:4px;position:relative}
.chart-col span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:#8b94a7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.on{display:flex}
.modal-content{background:#171b22;width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
input,textarea{width:100%;background:#1f2530;border:1px solid #242b36;color:#e8ecf3;border-radius:8px;padding:10px;margin:8px 0}
.nav{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.info-row{display:flex;justify-content:space-between;margin:8px 0;padding:8px;background:#1f2530;border-radius:8px}
.lead-card{border-left:3px solid #6c8cff;padding-left:12px;margin:10px 0}
.estimate-box{background:#1f2530;border-radius:8px;padding:10px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.estimate-item div:first-child{font-size:11px;color:#8b94a7;margin-bottom:4px}
.estimate-item div:last-child{font-size:14px;font-weight:bold;color:#e8ecf3}
</style>
</head>
<body>
<h1>⚡ SoloDev v4.6</h1>
<div class="nav">
<button class="btn small active" id="btnHome" onclick="showHome()">🏠 Главная</button>
<button class="btn small" id="btnDashboard" onclick="showDashboard()">📊 Дашборд</button>
<button class="btn small" id="btnRadar" onclick="showRadar()">🎯 Радар</button>
<button class="btn small" id="btnProjects" onclick="showProjects()">📁 Проекты</button>
</div>
<div id="app"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-content" id="modalContent"></div></div>
<script>
var db={profile:{name:'Дмитрий',spec:'Fullstack разработчик',specs:['Фронтенд','Бэкенд','Боты']},clients:[{id:'1',name:'Алексей',company:'TechStart',budget:45000,status:'В работе'}],projects:[{id:'1',name:'Интернет-магазин',client:'Алексей',budget:45000,stage:1,deadline:'2026-09-01',estimatedHours:40,tasks:[{id:'1',text:'Сверстать главную',done:false}]}],finances:[{id:'1',date:'2026-08-14',type:'in',amt:30000,cat:'Проект'},{id:'2',date:'2026-08-13',type:'in',amt:15000,cat:'Проект'},{id:'3',date:'2026-08-12',type:'in',amt:20000,cat:'Проект'},{id:'4',date:'2026-08-11',type:'in',amt:10000,cat:'Проект'}],leads:[],pains:[]};
var currentView='home';
function save(){localStorage.setItem('solodev',JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function showHome(){currentView='home';updateNav();renderHome()}
function showDashboard(){currentView='dashboard';updateNav();renderDashboard()}
function showRadar(){currentView='radar';updateNav();renderRadar()}
function showProjects(){currentView='projects';updateNav();renderProjects()}
function updateNav(){document.getElementById('btnHome').classList.toggle('active',currentView==='home');document.getElementById('btnDashboard').classList.toggle('active',currentView==='dashboard');document.getElementById('btnRadar').classList.toggle('active',currentView==='radar');document.getElementById('btnProjects').classList.toggle('active',currentView==='projects')}

function renderHome(){
  var inc=0;db.finances.forEach(function(f){if(f.type==='in')inc+=f.amt});
  var h='<div class="card" style="background:linear-gradient(135deg,#6c8cff,#9d6cff);color:#fff"><h2 style="margin:0">Привет, '+esc(db.profile.name)+'! 👋</h2><p style="margin:5px 0 0 0;opacity:0.9">'+esc(db.profile.spec)+'</p></div>';
  h+='<div class="grid"><div class="card"><span class="stat">Доход</span><b style="font-size:20px;color:#3ecf8e">'+inc.toLocaleString()+' ₽</b></div><div class="card"><span class="stat">Клиентов</span><b style="font-size:20px">'+db.clients.length+'</b></div><div class="card"><span class="stat">Проектов</span><b style="font-size:20px">'+db.projects.length+'</b></div><div class="card"><span class="stat">Шаблонов КП</span><b style="font-size:20px">'+db.pains.length+'</b></div></div>';
  document.getElementById('app').innerHTML=h;
}

function renderDashboard(){
  var monthFin=db.finances.filter(function(f){return f.date&&f.date.startsWith(today().slice(0,7))});
  var monthInc=0;monthFin.forEach(function(f){if(f.type==='in')monthInc+=f.amt});
  var daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  var currentDay=new Date().getDate();
  var dailyAvg=currentDay>0?Math.round(monthInc/currentDay):0;
  var forecast=currentDay>0?Math.round(monthInc/currentDay*daysInMonth):0;
  var remaining=forecast-monthInc;
  var h='<h2>📊 Дашборд продуктивности</h2>';
  h+='<div class="grid"><div class="card"><span class="stat">Доход за месяц</span><b style="font-size:20px;color:#3ecf8e">'+monthInc.toLocaleString()+' ₽</b></div><div class="card"><span class="stat">Ср. в день</span><b style="font-size:20px">'+dailyAvg.toLocaleString()+' ₽</b></div></div>';
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><h3 style="margin-top:0;color:#fff">💰 Прогноз дохода на месяц</h3><div style="font-size:32px;text-align:center;margin:15px 0;color:#3ecf8e;font-weight:bold">'+forecast.toLocaleString()+' ₽</div>';
  h+='<div class="info-row"><span>📅 Уже заработано:</span><b style="color:#3ecf8e">'+monthInc.toLocaleString()+' ₽</b></div>';
  h+='<div class="info-row"><span>📈 Осталось до прогноза:</span><b style="color:#9d6cff">'+remaining.toLocaleString()+' ₽</b></div>';
  h+='<div class="mut" style="text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid #242b36">При текущей скорости к '+daysInMonth+' числу</div></div>';
  document.getElementById('app').innerHTML=h;
}

var PAIN_DB=[
  {spec:'Фронтенд',seg:'Интернет-магазины',pain:'Медленная загрузка страниц, клиенты уходят',sol:'Оптимизация Core Web Vitals, lazy loading, сжатие изображений',complexity:'Средняя',time:'1-2 недели',cost:'30 000 - 80 000 ₽'},
  {spec:'Фронтенд',seg:'Стартапы',pain:'Нет адаптивной версии сайта (не работает на мобильных)',sol:'Полная адаптивная вёрстка (Mobile First)',complexity:'Низкая',time:'3-7 дней',cost:'15 000 - 40 000 ₽'},
  {spec:'Фронтенд',seg:'Инфобизнес',pain:'Сложно обновлять контент на сайте',sol:'Внедрение простой CMS (Strapi, WordPress) или конструктора блоков',complexity:'Средняя',time:'1-2 недели',cost:'40 000 - 90 000 ₽'},
  {spec:'Бэкенд',seg:'SaaS-сервисы',pain:'База данных не выдерживает нагрузку при росте',sol:'Оптимизация SQL-запросов, индексы, внедрение кэширования (Redis)',complexity:'Высокая',time:'2-4 недели',cost:'100 000 - 250 000 ₽'},
  {spec:'Бэкенд',seg:'Малый бизнес',pain:'Нужен простой API для мобильного приложения или сайта',sol:'Разработка REST API на Node.js/Python с документацией (Swagger)',complexity:'Средняя',time:'1-3 недели',cost:'40 000 - 100 000 ₽'},
  {spec:'Бэкенд',seg:'E-commerce',pain:'Интеграция с 1С, CRM или платёжными системами',sol:'Написание надёжных интеграционных шлюзов с обработкой ошибок',complexity:'Высокая',time:'2-5 недель',cost:'80 000 - 200 000 ₽'},
  {spec:'Мобильная разработка',seg:'Доставка еды / Услуги',pain:'Нет собственного приложения, высокая комиссия агрегаторов',sol:'Кроссплатформенное приложение (Flutter / React Native)',complexity:'Высокая',time:'1.5 - 3 месяца',cost:'150 000 - 400 000 ₽'},
  {spec:'Мобильная разработка',seg:'Фитнес-клубы',pain:'Клиенты забывают о тренировках, высокий отток',sol:'Приложение с push-уведомлениями и записью на занятия',complexity:'Средняя',time:'3-6 недель',cost:'80 000 - 180 000 ₽'},
  {spec:'Боты',seg:'Онлайн-школы',pain:'Менеджеры тонут в однотипных вопросах в Telegram',sol:'Чат-бот с автоответами, приёмом оплаты и выдачей материалов',complexity:'Средняя',time:'1-2 недели',cost:'25 000 - 60 000 ₽'},
  {spec:'Боты',seg:'Рестораны / Салоны',pain:'Много звонков для бронирования в нерабочее время',sol:'Бот для бронирования столов/записи с интеграцией в календарь',complexity:'Низкая',time:'5-10 дней',cost:'15 000 - 35 000 ₽'},
  {spec:'DevOps',seg:'Веб-студии',pain:'Ручной и долгий деплой проектов, человеческий фактор',sol:'Настройка CI/CD пайплайна (GitHub Actions / GitLab CI)',complexity:'Средняя',time:'3-7 дней',cost:'20 000 - 50 000 ₽'},
  {spec:'DevOps',seg:'Стартапы',pain:'Сайт периодически падает, нет мониторинга',sol:'Настройка серверов, Nginx, Docker + мониторинг (Prometheus/Grafana)',complexity:'Высокая',time:'1-3 недели',cost:'50 000 - 120 000 ₽'},
  {spec:'Дизайн',seg:'Локальный бизнес',pain:'Устаревший, непродающий дизайн сайта',sol:'Редизайн ключевых страниц с упором на UX/UI и конверсию',complexity:'Средняя',time:'1-2 недели',cost:'30 000 - 70 000 ₽'},
  {spec:'Дизайн',seg:'Приложения',pain:'Нет единого стиля, интерфейс неудобный',sol:'Разработка UI-кита и прототипов в Figma',complexity:'Высокая',time:'2-4 недели',cost:'60 000 - 150 000 ₽'}
];

function renderRadar(){
  var h='<h2>🎯 Радар — генератор предложений</h2>';
  h+='<div class="card" style="background:linear-gradient(135deg,#1a2035,#2a1040);border-color:#3a4a7a"><h3 style="margin-top:0;color:#fff">💡 Где искать клиентов</h3>';
  h+='<p class="mut">Внешние API часто блокируются, используйте прямые ссылки:</p>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">';
  h+='<a href="https://www.hh.ru" target="_blank" class="btn small" style="flex:1;text-decoration:none">🇷🇺 HH.ru (сайт)</a>';
  h+='<a href="https://t.me/s/job_for_devs" target="_blank" class="btn small" style="flex:1;text-decoration:none">✈️ Telegram-каналы</a>';
  h+='<a href="https://kwork.ru/projects" target="_blank" class="btn small" style="flex:1;text-decoration:none">🛒 Kwork</a>';
  h+='</div></div>';
  
  h+='<div class="card"><h3 style="margin-top:0">🤖 Генератор шаблонов проектов</h3>';
  h+='<p class="mut">Создаёт готовые коммерческие предложения по вашим навыкам: '+(db.profile.specs||[]).join(', ')+'</p>';
  h+='<button class="btn ai" onclick="generatePains()">🎯 Сгенерировать шаблоны</button>';
  h+='<button class="btn small" style="background:transparent;color:#ff6b6b;border:1px solid #ff6b6b;margin-top:8px" onclick="clearPains()">🗑 Очистить все шаблоны</button></div>';
  
  if(db.pains&&db.pains.length){
    db.pains.forEach(function(p,idx){
      h+='<div class="card">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="background:#6c8cff;color:#fff;padding:2px 8px;border-radius:6px;font-size:11px">'+esc(p.spec)+'</span><b>'+esc(p.seg)+'</b></div>';
      h+='<div style="color:#ff6b6b;font-size:14px;margin-bottom:6px">❌ '+esc(p.pain)+'</div>';
      h+='<div style="color:#3ecf8e;font-size:14px;margin-bottom:10px">✅ '+esc(p.sol)+'</div>';
      h+='<div class="estimate-box">';
      h+='<div class="estimate-item"><div>Сложность</div><div>'+p.complexity+'</div></div>';
      h+='<div class="estimate-item"><div>Сроки</div><div>'+p.time+'</div></div>';
      h+='<div class="estimate-item"><div>Бюджет</div><div style="color:#3ecf8e">'+p.cost+'</div></div>';
      h+='</div>';
      h+='<div style="display:flex;gap:8px;margin-top:12px"><button class="btn small" onclick="genOutreach(\''+esc(p.seg)+'\',\''+esc(p.pain)+'\',\''+esc(p.sol)+'\',\''+p.time+'\',\''+p.cost+'\')">✍️ Скопировать письмо</button><button class="btn small" style="background:transparent;color:#ff6b6b;border:1px solid #ff6b6b" onclick="delPain(\''+p.id+'\')">🗑</button></div>';
      h+='</div>';
    });
  }
  document.getElementById('app').innerHTML=h;
}

function generatePains(){
  var added=0;
  var userSpecs = db.profile.specs || ['Фронтенд', 'Бэкенд', 'Боты'];
  PAIN_DB.forEach(function(p){
    if(userSpecs.includes(p.spec) && !db.pains.some(function(x){return x.pain===p.pain})){
      db.pains.push({id:uid(), spec:p.spec, seg:p.seg, pain:p.pain, sol:p.sol, complexity:p.complexity, time:p.time, cost:p.cost, status:'Гипотеза'});
      added++;
    }
  });
  save(); renderRadar();
  alert(added>0 ? '✅ Добавлено '+added+' готовых шаблонов проектов!' : '⚠️ Все шаблоны по вашим навыкам уже в базе');
}

function clearPains(){if(confirm('Удалить все шаблоны?')){db.pains=[];save();renderRadar()}}
function delPain(id){if(confirm('Удалить этот шаблон?')){db.pains=db.pains.filter(function(p){return p.id!==id});save();renderRadar()}}

function genOutreach(seg, pain, sol, time, cost){
  var txt='Здравствуйте!\n\nМеня зовут '+db.profile.name+', я '+db.profile.spec+'.\n\nЗаметил, что для '+seg+' актуальна проблема: "'+pain+'".\n\nЯ решаю такие задачи следующим образом: '+sol+'.\n\nОбычно реализация занимает '+time+', а бюджет составляет '+cost+'.\n\nНайдётся 5-10 минут на этой неделе, чтобы обсудить детали?\n\nС уважением,\n'+db.profile.name+'\n'+(db.profile.phone||'Телефон');
  navigator.clipboard.writeText(txt).then(function(){alert('✉️ Письмо скопировано! Вставьте его в Telegram или почту.')});
}

function renderProjects(){
  var h='<h2>📁 Проекты</h2><button class="btn" onclick="addProject()">+ Проект</button>';
  db.projects.forEach(function(p){
    var doneTasks=p.tasks?p.tasks.filter(function(t){return t.done}).length:0;
    var totalTasks=p.tasks?p.tasks.length:0;
    var progress=totalTasks?Math.round(doneTasks/totalTasks*100):0;
    var roi=p.estimatedHours&&p.estimatedHours>0?Math.round(p.budget/p.estimatedHours):0;
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(p.name)+'</b><span style="padding:4px 12px;background:#6c8cff;border-radius:12px;font-size:12px">'+['Идея','В работе','Тестирование','Завершён'][p.stage]+'</span></div>';
    h+='<div class="mut">'+esc(p.client||'—')+' · '+p.budget.toLocaleString()+' ₽</div>';
    if(p.deadline) h+='<div class="mut">📅 Дедлайн: '+p.deadline+'</div>';
    if(roi) h+='<div style="color:#3ecf8e;font-size:13px">🧮 ROI: '+roi+' ₽/час</div>';
    h+='<div class="bar"><i style="width:'+progress+'%"></i></div>';
    h+='<div class="mut">Задачи: '+doneTasks+'/'+totalTasks+' ('+progress+'%)</div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">';
    if(p.stage<3) h+='<button class="btn small" onclick="nextStage(\''+p.id+'\')">Этап →</button>';
    h+='<button class="btn small" style="background:#1f2530" onclick="showTasks(\''+p.id+'\')">Задачи</button>';
    h+='<button class="btn small" style="background:#1f2530" onclick="showROI(\''+p.id+'\')">ROI</button>';
    h+='<button class="btn small" style="background:#1f2530" onclick="showReport(\''+p.id+'\')">Отчёт</button>';
    h+='<button class="btn small" style="background:transparent;color:#ff6b6b;border:1px solid #ff6b6b" onclick="delProject(\''+p.id+'\')">🗑</button>';
    h+='</div></div>';
  });
  document.getElementById('app').innerHTML=h;
}

function addProject(){var name=prompt('Название проекта:');if(!name)return;var client=prompt('Клиент:')||'';var budget=+prompt('Бюджет (₽):')||0;var deadline=prompt('Дедлайн (ГГГГ-ММ-ДД):')||'';var hours=+prompt('Оценка часов:')||40;db.projects.push({id:uid(),name:name,client:client,budget:budget,stage:0,deadline:deadline,estimatedHours:hours,tasks:[],date:today()});save();renderProjects()}
function nextStage(id){var p=db.projects.find(function(x){return x.id===id});if(p&&p.stage<3){p.stage++;save();renderProjects();alert('Этап: '+['Идея','В работе','Тестирование','Завершён'][p.stage])}}
function delProject(id){if(confirm('Удалить проект?')){db.projects=db.projects.filter(function(p){return p.id!==id});save();renderProjects()}}

function showTasks(id){var p=db.projects.find(function(x){return x.id===id});if(!p)return;var h='<h3>Задачи: '+esc(p.name)+'</h3>';if(p.tasks&&p.tasks.length){p.tasks.forEach(function(t){h+='<div style="display:flex;align-items:center;gap:10px;margin:10px 0"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask(\''+id+'\',\''+t.id+'\')" style="width:auto"><span style="flex:1;'+(t.done?'text-decoration:line-through;color:#8b94a7':'')+'">'+esc(t.text)+'</span><button class="btn small" style="background:transparent;color:#ff6b6b;border:1px solid #ff6b6b;padding:5px 10px" onclick="delTask(\''+id+'\',\''+t.id+'\')">✕</button></div>'})}else{h+='<div class="mut">Нет задач</div>'}h+='<div style="display:flex;gap:8px;margin-top:15px"><input id="newTask" placeholder="Новая задача" style="flex:1"><button class="btn small" onclick="addTask(\''+id+'\')">+</button></div><button class="btn" onclick="closeModal()">Закрыть</button>';openModal(h)}
function addTask(projId){var text=document.getElementById('newTask').value.trim();if(!text)return;var p=db.projects.find(function(x){return x.id===projId});if(p){if(!p.tasks)p.tasks=[];p.tasks.push({id:uid(),text:text,done:false});save();showTasks(projId);renderProjects()}}
function toggleTask(projId,taskId){var p=db.projects.find(function(x){return x.id===projId});if(p&&p.tasks){var t=p.tasks.find(function(x){return x.id===taskId});if(t)t.done=!t.done;save();showTasks(projId);renderProjects()}}
function delTask(projId,taskId){var p=db.projects.find(function(x){return x.id===projId});if(p&&p.tasks){p.tasks=p.tasks.filter(function(t){return t.id!==taskId});save();showTasks(projId);renderProjects()}}

function showROI(id){var p=db.projects.find(function(x){return x.id===id});if(!p)return;var roi=p.estimatedHours&&p.estimatedHours>0?Math.round(p.budget/p.estimatedHours):0;var verdict=roi>=1000?'✅ Отлично':roi>=500?'👍 Нормально':'⚠️ Низкий ROI';var h='<h3>🧮 ROI проекта</h3><div class="card"><div style="display:flex;justify-content:space-between;margin:10px 0"><span>Бюджет:</span><b>'+p.budget.toLocaleString()+' ₽</b></div><div style="display:flex;justify-content:space-between;margin:10px 0"><span>Часов:</span><b>'+p.estimatedHours+'</b></div><div style="display:flex;justify-content:space-between;margin:10px 0;padding-top:10px;border-top:1px solid #242b36"><span>Ставка:</span><b style="color:#3ecf8e">'+roi+' ₽/час</b></div><div style="margin-top:15px;font-size:18px;text-align:center">'+verdict+'</div></div><button class="btn" onclick="closeModal()">Закрыть</button>';openModal(h)}

function showReport(id){var p=db.projects.find(function(x){return x.id===id});if(!p)return;var doneTasks=p.tasks?p.tasks.filter(function(t){return t.done}).length:0;var totalTasks=p.tasks?p.tasks.length:0;var report='ОТЧЁТ ПО ПРОЕКТУ\n\nПроект: '+p.name+'\nКлиент: '+p.client+'\nДата: '+today()+'\n\nСтатус: '+['Идея','В работе','Тестирование','Завершён'][p.stage]+'\nБюджет: '+p.budget+' ₽\nДедлайн: '+p.deadline+'\n\nПрогресс: '+doneTasks+'/'+totalTasks+' задач\n\nЗадачи:\n'+(p.tasks||[]).map(function(t){return (t.done?'✓':'○')+' '+t.text}).join('\n')+'\n\nС уважением,\n'+db.profile.name;var h='<h3>📊 Отчёт</h3><textarea id="reportText" rows="12" style="font-family:monospace;font-size:13px">'+esc(report)+'</textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="copyReport()">📋 Копировать</button></div><button class="btn" onclick="closeModal()">Закрыть</button>';openModal(h)}
function copyReport(){var text=document.getElementById('reportText').value;navigator.clipboard.writeText(text).then(function(){alert('📋 Скопировано!')})}

function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}

window.onload=function(){
  save(); // Инициализация localStorage
  renderHome()
};
</script>
</body>
</html>
